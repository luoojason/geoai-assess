  finally{ btn.disabled=false; btn.textContent="Find with AI"; }
}
/* A failed lookup must never be quiet. The State/County boxes keep whatever they
   were showing — which is a default nobody chose — so saying only "could not
   place that" in small grey text let a run start against the wrong county. Seen
   in the 2026-08-09 sweep: the resolver errored, the form stayed on Ohio/Adams,
   and the project was created there. */
/* What the assistant told the analyst on step 1 is part of the project (#4a): keep the
   text that is on screen so it is still there when they come back. */
function captureAiNote(){
  if(!AREA.fields) return;
  const w=$("f_wherehint"), sg=$("project_suggesthint");
  AREA.fields.ai_note = [(w?.textContent||"").trim(), (sg?.textContent||"").trim()].join("\n");
}
function restoreAiNote(){
  const note = AREA.fields?.ai_note; if(!note) return;
  const [where, suggest] = note.split("\n");
  const w=$("f_wherehint"); if(w && where) w.textContent = where;
  if(suggest && AREA.project && !AREA.project.suggestNote) AREA.project.suggestNote = esc(suggest);
}
function resolveFailed(hint, why){
  // The two manual choices (whole county / only the ones I choose) are the way
  // forward now, so say plainly that the AI could not do it (Prof. Shi 2026-11-13 #12).
  if(AREA.project){ AREA.project.aiFailed = true; renderScope("project"); }
  hint.innerHTML = `<span style="color:var(--red);font-weight:600;">Could not place that location.</span>`
    + ` ${esc(why)}<br><b>The project area below was not changed</b> —`
    + ` it still shows <b>${esc(document.getElementById('project_state')?.selectedOptions[0]?.textContent||'')},`
    + ` ${esc(document.getElementById('project_county')?.selectedOptions[0]?.textContent||'')}</b>.`
    + ` Set it yourself, or try describing the location differently.`;
  const box = document.getElementById('f_where');
  if(box) box.style.borderColor = "var(--red)";
}

async function loadUnits(sel){
  try{
    const {units} = await api("/hcas/areal-units");
    AREAL_UNITS = units;
  }catch(e){ /* the form shows an empty list; creating falls back to the server default */ }
}
let AREAL_UNITS = [];

/* The area as the server stores it, or an error message for the analyst. */
function areaPayload(w){
  const a = AREA[w];
  if(!a || !a.state_fips || !a.county_fips) return {error:"Choose a state and county."};
  const selected = a.unit !== "county" && a.mode === "selected";
  if(selected && !a.geoids.length)
    return {error: `Choose at least one ${unitWord(a.unit)} for the ${w==="base"?"base":"project"} area, or pick “Whole county”.`};
  return {state_fips:a.state_fips, county_fips:a.county_fips, areal_unit:a.unit||"county",
          area_geoids: selected ? a.geoids.slice() : [],
          area_name: selected && a.unit==="block_group" ? (a.name||"").trim() : "",
          area_polygon: w==="project" ? (a.polygon||null) : null};
}

/* step 1 — study area (live base map since 2026-07-27).
   Prof. Shi 2026-08-07 #10: FIPS codes out, descriptive Census figures in.
   Anything the Census could not give us is listed as missing with the reason,
   never filled in with a plausible number.
   2026-09-16: an area smaller than its county leads with the area's own size
   and 2020 population; the county's figures follow as context. With a base
   area and comparison on, the two are shown side by side. */
function num(v, digits){ return v==null?null:(+v).toLocaleString(undefined,{maximumFractionDigits:digits==null?0:digits}); }
function viewIntake(a){
  const one = intakePanel(a, "project");
  if(!a.base) return one;
  if(!compareOn()) return one + compareHint();
  return `<div class="cmpgrid"><div>${cmpHead("project")}${one}</div>
    <div>${cmpHead("base")}${intakePanel(a.base, "base")}</div></div>`;
}
function intakePanel(a, which){
  const p = a.profile||{}, pa = a.project_area||{};
  const sub = pa.kind === "units" || pa.kind === "custom";
  const rows = sub ? [
    ["Area", esc(pa.label||a.place_name||"—")],
    ["Made of", `${num(pa.count)} ${esc(unitWord(pa.unit||"", pa.count!==1))}`],
    ["Size", pa.area_km2!=null?`${num(pa.area_km2,2)} km²`:null],
    ["Population", pa.population!=null?`${num(pa.population)} <span class="subnote" style="display:inline">(2020 Census)</span>`
      : (pa.population_partial!=null?`at least ${num(pa.population_partial)}`:null)],
    ["In county", esc(a.county_place_name||"")],
    ["County population", num(p.population)],
    ["County median income", p.median_household_income_usd!=null?`$${num(p.median_household_income_usd)}`:null],
  ] : [
    ["Place", esc(a.place_name||"—")],
    ["Total area", p.total_area_km2!=null?`${num(p.total_area_km2)} km² (land ${num(p.land_area_km2)} km²)`:null],
    ["Total population", num(p.population)],
    ["Population density", p.population_density_per_km2_of_land!=null?`${num(p.population_density_per_km2_of_land,1)} / km² of land`:null],
    ["Median household income", p.median_household_income_usd!=null?`$${num(p.median_household_income_usd)}`:null],
    ["Median home value", p.median_home_value_usd!=null?`$${num(p.median_home_value_usd)}`:null],
    ["Median age", num(p.median_age,1)],
    ["Reporting unit", esc(unitLabel(a.areal_unit))],
    ["Extent", "Entire county boundary"],
  ];
  const shown = rows.filter(r=>r[1]!=null);
  const missing = Object.entries(p.unavailable||{});
  const sources = [pa.source, p.source_boundary, p.source_acs, p.source_population]
    .filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i);
  const narrow = which === "base" || compareOn() && a.base;
  return `<div class="panel"><div class="ph">${which==="base"?"Base area":"Study area"}</div>
    <div class="cols" style="align-items:stretch;">
      <div style="flex:none;width:${narrow?"100%":"320px"};">
        <dl class="kv">${shown.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
        ${pa.population_note?`<div class="subnote">${esc(pa.population_note)}</div>`:""}
        ${sources.length?`<div class="subnote">Source: ${esc(sources.join(" · "))}</div>`:""}
        ${missing.length?`<div class="subnote" style="margin-top:10px;">Not available:<ul style="margin:4px 0;padding-left:16px;">
          ${missing.map(([k,v])=>`<li><b>${esc(UNAVAILABLE_NAMES[k]||k.replace(/_/g," "))}</b> — ${esc(v)}</li>`).join("")}</ul></div>`:""}
        ${which==="project" && a.notes ? `<div class="sec" style="margin-top:12px;"><h4>Notes</h4>
          ${notesBlock("step1", a.notes, {title:"Project notes"})}</div>` : ""}
      </div>
      <div class="mapview" style="flex:1;min-width:260px;">${baseMapFrame(which)}</div>
    </div></div>`;
}
function unitLabel(id){
  const u = AREAL_UNITS.find(u=>u.id===id);
  return u ? u.label : (id||"Census tract");
}

/* ---- base-area comparison (Prof. Shi 2026-09-16 #3) ----
   "In all the other steps, provide an option 'Compare with the base area'."
   The choice is remembered per project; it only shows or hides — the base
   area is always computed once one is defined, so switching is instant. */
function hasBase(){ return !!S.project?.meta?.base; }
function compareOn(){
  if(!hasBase()) return false;
  try{ return localStorage.getItem("hcas_compare_"+S.pid) !== "off"; }catch(_){ return true; }
}
function setCompare(on){
  try{ localStorage.setItem("hcas_compare_"+S.pid, on ? "on" : "off"); }catch(_){}
  renderCanvas();
}
function compareToggle(){
  if(!hasBase() || !S.pid) return "";
  return `<label class="chkline" style="margin-top:10px;"><input type="checkbox" ${compareOn()?"checked":""}
    onchange="setCompare(this.checked)"> Compare with the base area</label>`;
}
function compareHint(){ return ""; }
function cmpHead(which){
  const s1 = stepRow(1); const a = s1 ? (s1.human_final||s1.ai_draft||{}) : {};
  const name = which==="base" ? (a.base?.place_name || "Base area") : (a.place_name || "Project area");
  return `<div class="cmphead"><span class="tag ${which==="base"?"base":"done"}">${which==="base"?"Base area":"Project area"}</span>${esc(name)}</div>`;
}
/* Steps whose output is the method, not data about an area. */
const SHARED_STEP_NOTE = {
  2:"The factors chosen here are used for both areas, so the two can be compared like for like. The comparison appears at steps 3, 5, 7 and 8.",
  4:"The methodology is shared by both areas. The comparison appears at steps 3, 5, 7 and 8.",
  6:"This workflow runs for the project area and the base area alike. The comparison appears at steps 3, 5, 7 and 8.",
};

/* Plain labels for measures (Prof. Shi 2026-09-16 #6: no internal names). */
let MEASURES = {};
function measureLabel(id){ return (MEASURES[id]&&MEASURES[id].label) || String(id||"").replace(/_/g," "); }
async function loadMeasures(){ try{ MEASURES = (await api("/hcas/measures")).measures || {}; }catch(_){} }

/* step 2 — factors (editable toggles).
   The rows are the CURRENT list (checked, in order) followed by any factor from
   the AI draft the analyst has since dropped (unchecked), so a factor added by
   a revision appears and an un-checked one can be restored. */
function factorRows(a){
  const key = f => f.factor+"|"+f.metric;
  const rows = (a.factors||[]).map(f=>({f, on:true}));
  const have = new Set(rows.map(r=>key(r.f)));
  ((stepRow(2)?.ai_draft?.factors)||[]).forEach(f=>{
    if(!have.has(key(f))){ have.add(key(f)); rows.push({f, on:false}); }
  });
  return rows;
}
function viewFactors(a){
  const rows = factorRows(a);
  const items = rows.map((r,i)=>{
    const f = r.f;
    return `<label class="factor ${r.on?'':'off'}" data-i="${i}">
      <input type="checkbox" ${r.on?'checked':''} data-i="${i}">
      <div><span class="fname">${esc(f.factor)}</span>${f.metric==="needs_data"
          ? `<span class="tag wait" style="margin-left:9px;">Awaiting data</span>`
          : `<span class="metric" title="${esc((MEASURES[f.metric]||{}).description||f.metric)}">${esc(measureLabel(f.metric))}</span>`}
        <div class="rat">${esc(f.rationale||"")}</div>
        ${f.metric==="needs_data" && f.data_needed ? `<div class="rat"><b>Data needed:</b> ${esc(f.data_needed)}</div>` : ""}</div>
    </label>`;
  }).join("");
  // Prof. Shi 2026-08-07 #11: asking for a change used to re-run the whole step
  // and return a different list in a different order. This box sends ONE
  // instruction and applies it as a diff — kept factors stay put, in order.
  return `<div class="panel"><div class="ph">Suggested factors — keep the ones that apply</div>
    ${items||'<div class="empty">No factors suggested.</div>'}
    <div class="sec" style="margin-top:14px;"><h4>Change the list</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input id="f_revise" style="flex:1;min-width:260px;font:400 var(--fs-sm) var(--sans);padding:9px 11px;border:1px solid var(--line-d);border-radius:var(--r-sm);color:var(--ink);"
               placeholder="e.g. add pollution data · drop parking"
               onkeydown="if(event.key==='Enter'){event.preventDefault();reviseFactors();}">
        <button class="cbtn" id="revisebtn" onclick="reviseFactors()">Apply change</button>
      </div>
      <div class="hint" id="revisehint">Only what you ask for changes — the factors you keep stay in place,
        in this order. Un-check a factor to drop it.</div>
    </div>
    <div class="sec" style="margin-top:14px;"><h4>Notes</h4>
      ${notesBlock("step2", a.notes||"", {editable:true, title:"Notes on the factor selection",
          onSave:v=>{ if(S.edited) S.edited.notes=v; }})}
      <div style="margin-top:12px;"><button class="cbtn run" id="f_rerun" onclick="runStep()"
        title="Draw up the factor list again from scratch">Re-run</button></div></div></div>`;
}
function wireFactors(){
  // Same row order the view just rendered, so index -> factor stays aligned.
  const base = factorRows(S.edited||{}).map(r=>r.f);
  const sync = ()=>{
    const keep=[...document.querySelectorAll('.factor input:checked')].map(c=>+c.dataset.i);
    S.edited.factors = keep.map(i=>base[i]);
    document.querySelectorAll('.factor').forEach(l=>l.classList.toggle('off',!l.querySelector('input').checked));
  };
  document.querySelectorAll('.factor input').forEach(c=>c.onchange=sync);
  const nt=$("notes_step2"); if(nt) nt.oninput=()=>{ S.edited.notes=nt.value; };
}
async function reviseFactors(){
  const box=$("f_revise"), hint=$("revisehint"), btn=$("revisebtn");
  const instruction=(box?.value||"").trim();
  if(!instruction){ hint.textContent="Type what to change first."; return; }
  btn.disabled=true; hint.innerHTML='<span class="spin"></span>Applying your change…';
  try{
    const place=(stepRow(1)?.human_final||stepRow(1)?.ai_draft||{}).place_name||"the study area";
    const r=await api("/hcas/revise-factors",{method:"POST",
      body:JSON.stringify({artifact:S.edited, instruction, place, project_id:S.pid})});
    relayAi(r);
    S.edited=r.artifact;
    renderCanvas();
    const bits=[];
    if(r.added?.length) bits.push(`added ${r.added.map(esc).join(", ")}`);
    if(r.removed?.length) bits.push(`removed ${r.removed.map(esc).join(", ")}`);
    if(!bits.length) bits.push("no change was needed");
    $("revisehint").innerHTML = `<b>${bits.join(" · ")}.</b> `
      + (r.note?esc(r.note)+" ":"") + "Everything else kept its place.";
  }catch(e){ hint.innerHTML=`<span style="color:var(--red)">${esc(e.message)}</span>`; }
  finally{ const b=$("revisebtn"); if(b) b.disabled=false; }
}

/* ---- layer list (Prof. Shi 2026-07-27): names only, per-layer visibility
   toggle, and a right-click menu → Attribute Table / Properties beneath the
   map. Layer data is stashed so the menu can render without re-threading. ---- */
let LAYER_DATA = {};    // key -> inventory entry (or study-area block)
let STUDY_DATA = null;  // study-area block for shared extent/crs

/* Prof. Shi 2026-08-07 #12: "On the data list, always show the data sources."
   The source rides under the layer name (still no EPSG column — his 2026-07-27
   note); it stays in Properties too. */
function layerRow(key, name, o){
  o = o||{};
  const cb = (o.toggle && o.foliumLabel)
    ? `<input type="checkbox" class="lvis" checked title="Show / hide on map"
         onclick="event.stopPropagation()" onchange="toggleMapLayer('${esc(o.foliumLabel)}',this.checked)">`
    : `<span class="lvis-sp"></span>`;
  const src = o.source ? `<span class="lsrc">${esc(o.source)}</span>` : "";
  const count = (o.count!=null) ? `<span class="lsrc">· ${plural(o.count, "feature")}</span>` : "";
  return `<div class="leaf lrow" oncontextmenu="return layerMenu(event,'${esc(key)}')"
       title="Right-click for Attribute Table &amp; Properties">
    ${cb}<span class="lname">${esc(name)}${o.hasError?' <span style="color:var(--red)" title="fetch error">⚠</span>':''}
      <span class="lmeta">${src}${count}</span></span>
    <button class="lkebab" onclick="layerMenu(event,'${esc(key)}')" title="Layer options">⋯</button></div>`;
}
function layerListPanel(layers, studyArea, o){
  o = o||{};
  LAYER_DATA = {}; STUDY_DATA = studyArea || null;
  let rows = "";
  if(studyArea){
    LAYER_DATA["__study__"] = studyArea;
    rows += layerRow("__study__", studyArea.name||"Study area",
      {toggle:o.toggles, foliumLabel:"Study Area", source:studyArea.source});
  }
  (layers||[]).forEach(l=>{
    LAYER_DATA[l.layer] = l;
    rows += layerRow(l.layer, l.name||l.layer, {toggle:o.toggles, foliumLabel:FOLIUM_LABEL[l.layer],
      hasError:!!l.error, source:l.source, count:l.error?null:l.feature_count});
  });
  return `<div class="grp"><div class="gname">Layers</div>${rows||'<div class="empty" style="padding:10px;">No layers.</div>'}</div>`;
}
function layerMenu(ev, key){
  ev.preventDefault(); ev.stopPropagation(); closeLayerMenu();
  const m = document.createElement("div"); m.id = "lmenu"; m.className = "lmenu";
  m.innerHTML = `<button onclick="layerInfo('attr','${esc(key)}')">Open Attribute Table</button>
    <button onclick="layerInfo('props','${esc(key)}')">Properties</button>`;
  document.body.appendChild(m);
  m.style.left = Math.min(ev.clientX, innerWidth-200)+"px";
  m.style.top  = Math.min(ev.clientY, innerHeight-90)+"px";
  // Close on the NEXT click. Deferred so this event doesn't self-close it, and
  // on `click` (not `mousedown`) so a menu item's own click still lands first.
  setTimeout(()=>document.addEventListener("click", closeLayerMenu, {once:true}), 0);
  return false;
}
function closeLayerMenu(){ const m=$("lmenu"); if(m) m.remove(); }
function kvTable(rows){
  return `<table class="data"><tbody>${rows.map(([k,v])=>
    `<tr><td style="font-family:var(--mono);color:var(--faint);white-space:nowrap;">${esc(k)}</td><td>${esc(v)}</td></tr>`
  ).join("")}</tbody></table>`;
}
function layerInfo(kind, key){
  closeLayerMenu();
  const box = $("layerinfo"); if(!box) return;
  const d = LAYER_DATA[key]; if(!d){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="panel">${kind==="attr" ? attrTableHtml(key,d) : propsHtml(key,d)}
    <div style="margin-top:8px;"><button class="cbtn" style="padding:5px 11px;font-size:var(--fs-xs)" onclick="$('layerinfo').innerHTML=''">Close ✕</button></div></div>`;
  box.scrollIntoView({behavior:REDUCED?"auto":"smooth", block:"nearest"});
}
function attrTableHtml(key,d){
  let rows, note="";
  if(key==="__study__"){
    rows = [["FIPS", d.fips||"—"], ["Name", d.name||"Study area"]];
    if(d.area_km2!=null)   rows.push(["Area (km²)", (+d.area_km2).toLocaleString()]);
    if(d.population!=null)  rows.push(["Population", (+d.population).toLocaleString()]);
    if(d.radius_m!=null)    rows.push(["Radius (m)", d.radius_m]);
  } else {
    rows = [["Layer", d.name||d.layer],
            ["Feature count", d.feature_count!=null?(+d.feature_count).toLocaleString():"—"],
            ["Geometry type", d.geom_type||"vector"]];
    if(d.error) rows.push(["Fetch status", d.error]);
    note = `<div class="subnote">Per-feature attributes (individual polygons) aren't stored in the audit record; the analysis map (step 7) draws every feature.</div>`;
  }
  return `<div class="ph">Attribute table · ${esc(d.name||d.layer||"layer")}</div>${kvTable(rows)}${note}`;
}
function propsHtml(key,d){
  const ext = key==="__study__" ? d.extent_4326 : (STUDY_DATA && STUDY_DATA.extent_4326);
  const rows = [
    ["Source / origin", d.source||"—"],
    ["Coordinate system", d.crs||"EPSG:5070"],
    ["Geometry type", d.geom_type||"vector"],
    ["Spatial extent (WGS84)", (ext&&ext.length===4) ? ext.map(x=>(+x).toFixed(3)).join(", ") : "—"],
  ];
  if(key!=="__study__") rows.push(["Feature count", d.feature_count!=null?(+d.feature_count).toLocaleString():"—"]);
  if(d.area_km2!=null)  rows.push(["Area (km²)", (+d.area_km2).toLocaleString()]);
  rows.push(["Cell size / resolution", "— (vector layer)"]);
  return `<div class="ph">Properties · ${esc(d.name||d.layer||"layer")}</div>${kvTable(rows)}`;
}
/* Drive the map's own layer control from the left list. The folium map is a
   nested srcdoc iframe (same origin), so we click the matching overlay input. */
function toggleMapLayer(label, visible){
  const f = document.querySelector(".mapframe"); if(!f) return;
  try{
    const outer = f.contentWindow;
    const inner = outer.document.querySelector("iframe");
    const doc = (inner && inner.contentWindow.document) || outer.document;
    for(const lb of doc.querySelectorAll(".leaflet-control-layers-overlays label")){
      if(lb.textContent.trim() === label){
        const cb = lb.querySelector('input[type=checkbox]');
        if(cb && cb.checked !== visible) cb.click();
        return;
      }
    }
  }catch(_){}
}

/* step 3 — data */
function viewData(a){
  // Stale-mirror warning: the layers arrived, but they are old. Amber, above
  // everything, because every figure downstream inherits the age.
  const stale = a.data_freshness_warning
    ? `<div class="warnbar" style="background:var(--amber-tint);color:var(--amber)">⚠<div>
        <b>These map features are out of date.</b> ${esc(a.data_freshness_warning)}</div></div>` : "";
  // Prof. Shi 2026-09-16 #2: saved data is reused, and can be fetched again on demand.
  const refetch = `<div class="cmpbar"><button class="cbtn" onclick="runStep({refresh:true})" ${S.busy?"disabled":""}
      title="Download every map layer again instead of reusing the saved copy">Re-fetch data ↻</button>
    <span class="hint">Downloaded map data is saved and reused — by this project and by any other covering the same
      area — for 30 days, so reopening a project does not fetch it again. Re-fetch downloads it fresh.</span></div>`;
  const waiting = awaitingPanel(a.awaiting_data);
  if(a.base && compareOn()){
    return `${stale}${refetch}${waiting}<div class="cmpgrid">
      <div>${cmpHead("project")}${dataCompact(a, "project")}</div>
      <div>${cmpHead("base")}${dataCompact(a.base, "base")}</div></div>`;
  }
  const list = layerListPanel(a.layers||[], a.study_area, {toggles:false});
  // Prof. Shi's layout: layers left · map upper-right · tables beneath the map
  return `${stale}${layerWarn(a)}${unitBar(a)}${refetch}${waiting}<div class="cols" style="align-items:stretch;flex-wrap:nowrap;">
    <div class="panel tree" style="width:280px;flex:none;"><div class="ph">Data layers</div>${list}
      <div class="subnote">Right-click a layer for its attribute table &amp; properties.</div></div>
    <div class="stack" style="flex:1;">
      ${dataDownloadLink(a)}
      ${dataUploadPanel()}
      <div class="panel"><div class="ph">${a.study_area?.kind==="units"||a.study_area?.kind==="custom"?"Project area map":"Study area map"}</div>
        <div class="mapview">${baseMapFrame("project")}</div></div>
      <div id="layerinfo"></div>
      ${tablesPanel(a.tables)}
      ${outcomesPanel(a.health_outcomes)}
    </div></div>`;
}
function layerWarn(a){
  const errs = (a.layers||[]).filter(l=>l.error);
  return errs.length?`<div class="warnbar">⚠<div><b>${errs.length} data source${errs.length>1?"s":""} could not be reached</b> —
    the flagged layers are empty. Any metric that needs one is reported as <i>not measured</i> rather than as zero,
    and no recommendation is derived from it. ${esc(errs[0].error)}
    <br><b>Re-running is cheap</b> — every layer that already arrived is cached and returns instantly, so each attempt gets further. You can also confirm and continue with what you have.</div></div>`:"";
}
// Prof. Shi 2026-08-07 #5: report the outcome of the reporting-unit search,
// whether or not the data exists.
function unitBar(a){
  const au = a.areal_unit;
  return au ? `<div class="warnbar" style="${au.available
      ? "background:var(--ok-tint);color:var(--ok)" : "background:var(--amber-tint);color:var(--amber)"}">
      ${au.available?"✓":"⚠"}<div><b>Reporting unit — ${esc(au.label||au.unit)}:</b> ${esc(au.note||"")}</div></div>` : "";
}
/* One area's data as a single column, for the side-by-side comparison. */
function dataCompact(a, which){
  const rows = (a.layers||[]).map(l=>`<tr><td>${esc(l.name||l.layer)}${l.error?' <span style="color:var(--red)">⚠</span>':""}</td>
      <td class="num">${l.error?'<span style="color:var(--red)">unavailable</span>':(+l.feature_count).toLocaleString()}</td></tr>`).join("");
  return `${layerWarn(a)}${unitBar(a)}
    <div class="panel"><div class="ph">Map</div><div class="mapview">${baseMapFrame(which)}</div></div>
    <div class="panel"><div class="ph">Map layers</div>${rows?`<table class="data"><tbody>${rows}</tbody></table>`
      :'<div class="empty" style="padding:10px;">No map layers needed.</div>'}</div>
    ${tablesPanel(a.tables)}${outcomesPanel(a.health_outcomes)}`;
}
function tablesPanel(tables){
  if(!tables || !tables.length) return "";
  return `<div class="panel"><div class="ph">Community data</div>
    <table class="data"><tbody>${tables.map(t=>`<tr><td>${esc(t.name)}<div class="subnote">${esc(t.level)}</div></td>
      <td>${t.error?`<span style="color:var(--red)">⚠ ${esc(t.error)}</span>`:`✓ ${esc(t.note||"available")}`}</td></tr>`).join("")}</tbody></table></div>`;
}
function outcomesPanel(ho){
  ho = ho || {};
  const area = ho.level === "project_area";
  const pct = v => v==null ? '<span style="color:var(--faint)">—</span>' : `${v}%`;
  const rows = (ho.measures||[]).map(m=>{
    const ref = area ? m.area_pct : m.county_pct;
    const flag = ref!=null && m.us_pct!=null ? (ref>m.us_pct ? ' <span class="above">above US</span>' : ' <span class="below">below US</span>') : "";
    return area
      ? `<tr><td>${esc(m.label)}</td><td>${pct(m.area_pct)}${flag}</td><td>${pct(m.county_pct)}</td><td>${pct(m.us_pct)}</td></tr>`
      : `<tr><td>${esc(m.label)}</td><td>${m.county_pct}%${flag}</td><td>${m.us_pct}%</td></tr>`;
  }).join("");
  const head = area ? "<th>Measure</th><th>Area</th><th>County</th><th>US</th>" : "<th>Measure</th><th>County</th><th>US</th>";
  return `<div class="panel"><div class="ph">${esc(ho.source||"Health outcomes")}</div>
    ${ho.area_note?`<div class="subnote" style="margin-bottom:6px;">${esc(ho.area_note)}</div>`:""}
    ${rows?`<table class="data"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
      ${area&&ho.note?`<div class="subnote">${esc(ho.note)}</div>`:""}`
      :`<div class="empty" style="padding:14px;">${esc(ho.note||"No outcomes this run.")}</div>`}</div>`;
}
/* Factors kept though no connected data measures them yet (2026-09-16 #6). */
function awaitingPanel(list){
  if(!list || !list.length) return "";
  return `<div class="panel"><div class="ph">Factors awaiting data</div>
    <div class="subnote" style="margin:0 0 8px;">No connected data source measures these yet. They stay in the
      assessment, and the report lists them as not measured, so the gap is never hidden.</div>
    <ul style="margin:0;padding-left:18px;">${list.map(f=>`<li style="font-size:var(--fs-sm);margin:3px 0;"><b>${esc(f.factor)}</b>${
      f.data_needed?` — ${esc(f.data_needed)}`:""}</li>`).join("")}</ul></div>`;
}

/* Bring-your-own-data (Xun Shi 2026-08-14, #all-aigis): download whatever this
   project has fetched/uploaded so far, or upload a .zip / single .geojson so a
   layer is used instead of being fetched at all. */
function dataDownloadLink(a){
  if(!S.pid || !(a.layers||[]).length) return "";
  return `<div class="panel" style="padding:12px 14px;">
    <a class="cbtn" href="/hcas/projects/${S.pid}/data.zip" target="_blank" style="text-decoration:none;">Download this project's data ↧</a>
    <span class="hint" style="margin-left:8px;">Every layer fetched or uploaded so far, as GeoJSON.</span>
  </div>`;
}
function dataUploadPanel(){
  return `<div class="panel" style="padding:12px 14px;">
    <div class="hint">Upload a .zip (from a previous download) or a single .geojson file named after
      the layer it supplies — e.g. facilities.geojson — to use your own data instead of fetching it.
      An upload is never overwritten by a re-run; ${STEP_TITLES[2]} uses it the next time it runs.</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">
      <input type="file" id="datafile" accept=".zip,.geojson,.json" multiple>
      <button class="cbtn" onclick="uploadDataFiles()">Upload</button>
    </div>
    <div id="dataUploadResult" class="subnote" style="margin-top:8px;"></div>
  </div>`;
}
async function uploadDataFiles(){
  const input = $("datafile"), out = $("dataUploadResult");
  const files = input?.files ? Array.from(input.files) : [];
  if(!files.length){ if(out) out.textContent = "Choose a file first."; return; }
  if(out) out.textContent = "Uploading…";
  const accepted = [], rejected = [];
  for(const f of files){
    try{
      const r = await fetch(`/hcas/projects/${S.pid}/data?filename=${encodeURIComponent(f.name)}`,
        {method:"POST", headers:{"X-Requested-With":"geoai"}, body:f});
      const body = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(body.detail || (r.status+" "+r.statusText));
      accepted.push(...(body.accepted||[]));
      rejected.push(...(body.rejected||[]));
    }catch(e){ rejected.push({file:f.name, reason:e.message}); }
  }
  if(out) out.innerHTML = [
    accepted.length ? `<div style="color:var(--ok)">✓ ${accepted.map(x=>`${esc(layerName(x.layer))} (${plural(x.feature_count, "feature")})`).join(", ")} — run this step to use it.</div>` : "",
    rejected.length ? `<div style="color:var(--red)">✗ ${rejected.map(x=>`${esc(x.file)}: ${esc(x.reason)}`).join("; ")}</div>` : "",
  ].filter(Boolean).join("");
  if(input) input.value = "";
}

/* step 4 — methodology */
function viewSolution(a){
  const list = (arr)=>(arr||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const theory = (a.theoretical_basis||[]).map(t=>`<li><b>${esc(t.theory)}</b> — ${esc(t.application)}</li>`).join("");

  // Provenance. The backend has always attached this block when the corpus
  // answered, and the UI has always thrown it away — so a grounded run and a
  // degraded one rendered identically. Stating the version, the search method
  // and the resolved document count is what lets a reader audit the run.
  const kb = a.knowledgebase;
  const kbSources = kb ? (kb.source_documents||[]) : [];
  const provenance = kb
    ? `<div class="sec"><h4>Grounding</h4><p>Grounded in <b>${plural(kbSources.length, "document")}</b>
         from the knowledgebase — index <b>${esc(kb.version||"?")}</b>,
         ${esc(kb.method||"?")} search, ${esc(String(kb.duration_seconds||"?"))}s.</p></div>`
    : `<div class="sec"><h4>Grounding</h4><p class="muted">Knowledgebase unavailable for this
         run — the methodology below uses the built-in theory list, exactly as it would
         with grounding switched off.</p></div>`;

  // References split by provenance. A flat list mixed the app's hardcoded
  // titles with documents the corpus actually vouched for, so a reader could
  // not tell which claims were corpus-backed — the very thing the grounding
  // exists to establish. Corpus membership is decided by the returned source
  // list, never by guessing from the title.
  const corpus = new Set(kbSources);
  const all = a.references||[];
  const fromKb = all.filter(r=>corpus.has(r));
  const builtin = all.filter(r=>!corpus.has(r));
  const refBlock = (title, arr, note) => arr.length
    ? `<div class="sec"><h4>${title}</h4>${note||""}<ul>${arr.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`
    : "";

  return `<div class="cols" style="align-items:flex-start;">
    <div class="panel" style="flex:2;"><div class="ph">Methodology</div>
      <div class="sec"><h4>Framework</h4><p>${esc(a.framework||"—")}</p></div>
      ${provenance}
      <div class="sec"><h4>Theoretical basis</h4><ul>${theory||"<li>—</li>"}</ul></div>
      <div class="sec"><h4>Assumptions</h4><ul>${list(a.assumptions)||"<li>—</li>"}</ul></div>
      <div class="sec"><h4>Limitations</h4><ul>${list(a.limitations)||"<li>—</li>"}</ul></div>
      ${refBlock("References · from the knowledgebase", fromKb,
          `<p class="muted">Returned by the corpus for this question, not recalled by the model.</p>`)}
      ${refBlock("References · built-in", builtin)}
      ${all.length ? "" : `<div class="sec"><h4>References</h4><ul><li>—</li></ul></div>`}
    </div></div>`;
}

/* step 6 — workflow */
/* Workflow flowchart (Prof. Shi 2026-11-13, step 6: "create a flowchart to illustrate the
   workflow"). Input data layers -> processing operations -> metrics -> outputs, drawn as
   inline SVG from the step-6 artifact, so it follows every edit. No library: the page
   already has to cope with a blocked CDN. Colours are inline so the same SVG can be
   pasted into the exported report. */
function flowWrap(text, max){
  const words = String(text==null?"":text).split(/\s+/).filter(Boolean);
  const lines = []; let cur = "";
  for(const w of words){
    if(!cur) cur = w;
    else if((cur+" "+w).length <= max) cur += " "+w;
    else { lines.push(cur); cur = w; }
  }
  if(cur) lines.push(cur);
  if(lines.length > 3){ lines.length = 3; lines[2] = lines[2].slice(0, Math.max(1, max-1)).replace(/\s+$/,"") + "…"; }
  return lines.map(l => l.length > max+2 ? l.slice(0, max) + "…" : l);
}
function flowchartSvg(wf){
  const steps = (wf && wf.steps) || [];
  const W = 214, H = 58, GX = 56, PITCH = 72, TOP = 34, PAD = 6;
  const colX = [0,1,2,3].map(i => PAD + i*(W+GX));
  const width = PAD*2 + 4*W + 3*GX;
  // ---- nodes
  const computes = steps.filter(s => s.action==="compute");
  const waits = steps.filter(s => s.action==="awaiting_data");
  const hasBase = steps.some(s => s.action==="compare_with_base");
  const layerIds = []; const srcNames = [];
  computes.forEach(s => {
    (s.layers||[]).forEach(l => { if(!layerIds.includes(l)) layerIds.push(l); });
    if(!(s.layers||[]).length && s.source && !srcNames.includes(s.source)) srcNames.push(s.source);
  });
  const col0 = [
    ...layerIds.map(l => ({id:"L:"+l, lines:flowWrap(layerName(l), 26), sub:"map layer", kind:"layer"})),
    ...srcNames.map(n => ({id:"S:"+n, lines:flowWrap(n, 26), sub:"published data", kind:"layer"})),
  ];
  const col1 = computes.map((s,i) => ({id:"O:"+i, lines:flowWrap("Compute "+measureLabel(s.metric), 26), sub:"for each reporting unit", kind:"op"}));
  const col2 = [
    ...computes.map((s,i) => ({id:"M:"+i, lines:flowWrap(measureLabel(s.metric), 26), sub:"metric", kind:"metric"})),
    ...waits.map((s,i) => ({id:"W:"+i, lines:flowWrap(s.factor||"Awaiting data", 26), sub:"awaiting data"+(s.data_needed?": "+s.data_needed:""), kind:"wait"})),
  ];
  const col3 = [];
  if(hasBase) col3.push({id:"C", lines:["Compare with","base area"], sub:"output", kind:"out"});
  col3.push({id:"I", lines:["Generate","interventions"], sub:"output", kind:"out"});
  col3.push({id:"R", lines:["Assemble the","report"], sub:"output", kind:"out"});
  const cols = [col0, col1, col2, col3];
  const rows = Math.max(1, ...cols.map(c => c.length));
  const height = TOP + rows*PITCH + 6;
  // ---- positions (each column centred on the tallest one)
  const pos = {};
  cols.forEach((c, ci) => {
    const off = TOP + (rows - c.length) * PITCH / 2;
    c.forEach((n, ri) => { n.x = colX[ci]; n.y = off + ri*PITCH; pos[n.id] = n; });
  });
  // ---- edges
  const edges = [];
  computes.forEach((s,i) => {
    const ins = (s.layers||[]).length ? s.layers.map(l => "L:"+l) : (s.source ? ["S:"+s.source] : []);
    ins.forEach(id => edges.push([id, "O:"+i]));
    edges.push(["O:"+i, "M:"+i]);
    edges.push(["M:"+i, "I"]);
    if(hasBase) edges.push(["M:"+i, "C"]);
  });
  if(hasBase) edges.push(["C", "R"]);
  edges.push(["I", "R"]);
  const col3x = colX[3];
  const edgeSvg = edges.map(([a,b]) => {
    const p = pos[a], q = pos[b]; if(!p || !q) return "";
    if(p.x === q.x){   // inside the outputs column: straight down/up the side
      const x = p.x + W/2, y1 = p.y + H, y2 = q.y;
      return `<path d="M${x} ${y1} L${x} ${y2}" fill="none" stroke="#7c8a99" stroke-width="1.4" marker-end="url(#fcArrow)"/>`;
    }
    const x1 = p.x + W, y1 = p.y + H/2, x2 = q.x, y2 = q.y + H/2, mx = (x1+x2)/2;
    return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2-2} ${y2}" fill="none" stroke="#7c8a99" stroke-width="1.4" marker-end="url(#fcArrow)"/>`;
  }).join("");
  const FILL = {layer:["#e6f4f1","#0f766e"], op:["#ffffff","#475569"], metric:["#f0f9ff","#0369a1"], wait:["#fffbeb","#b45309"], out:["#0f766e","#0f766e"]};
  const nodeSvg = cols.flat().map(n => {
    const [fill, stroke] = FILL[n.kind];
    const dark = n.kind === "out";
    const txt = dark ? "#ffffff" : "#1e293b", sub = dark ? "#d1fae5" : "#64748b";
    const all = [...n.lines.map(t => ({t, b:true})), ...flowWrap(n.sub, 30).slice(0, n.kind==="wait" ? 2 : 1).map(t => ({t, b:false}))];
    const lh = 14.5, y0 = n.y + H/2 - (all.length*lh)/2 + 11;
    const tspans = all.map((l,i) => `<text x="${n.x+W/2}" y="${y0 + i*lh}" text-anchor="middle" font-size="${l.b?12.5:10.5}"
        font-weight="${l.b?600:400}" fill="${l.b?txt:sub}" font-family="Inter,Segoe UI,Arial,sans-serif">${esc(l.t)}</text>`).join("");
    return `<g><rect x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="9" fill="${fill}" stroke="${stroke}"
        stroke-width="1.5"${n.kind==="wait" ? ' stroke-dasharray="6 4"' : ""}/>${tspans}</g>`;
  }).join("");
  const heads = ["Input data", "Processing", "Metrics", "Outputs"].map((t,i) =>
    `<text x="${colX[i]+W/2}" y="18" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#64748b"
       font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">${t.toUpperCase()}</text>`).join("");
  return `<svg class="flowchart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="100%"
      style="max-width:${width}px;height:auto;display:block" role="img"
      aria-label="Workflow flowchart: input data layers, processing operations, metrics and outputs">
    <defs><marker id="fcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c8a99"/></marker></defs>
    ${heads}${edgeSvg}${nodeSvg}</svg>`;
}

function viewWorkflow(a){
  const steps = (a.steps||[]).map((s,i)=>{
    let lbl;
    if(s.action==="compute"){
      const src = s.layers&&s.layers.length ? ` · from ${esc(s.layers.map(layerName).join(", "))}` : (s.source?` · from ${esc(s.source)}`:"");
      lbl = `compute <b>${esc(measureLabel(s.metric))}</b>${src}`;
    }else if(s.action==="awaiting_data"){
      lbl = `<span class="tag wait" style="font-size:10px;">awaiting data</span> <b>${esc(s.factor)}</b>${s.data_needed?` — needs ${esc(s.data_needed)}`:""}`;
    }else if(s.action==="compare_with_base"){
      lbl = "compare every result with the <b>base area</b>";
    }else if(s.action==="generate_interventions"){ lbl = "generate interventions"; }
    else if(s.action==="assemble_report"){ lbl = "assemble report"; }
    else lbl = esc(s.action);
    return `<li><span class="n">${i+1}</span><span>${lbl}</span></li>`;
  }).join("");
  return `<div class="panel"><div class="ph">Workflow flowchart</div>
    <div class="flowwrap" style="overflow-x:auto;">${flowchartSvg(a)}</div>
    <div class="subnote" style="margin-top:6px;">Drawn from the steps below, so it follows any change to them. It is included in the report.</div></div>
    <div class="panel" style="margin-top:14px;"><div class="ph">Workflow steps</div>
    <ul class="flow">${steps||"<li>—</li>"}</ul></div>`;
}

/* step 7 — analysis results */
const RESULT_LABELS = {
  building_coverage_ratio:"Building coverage (share of area)", greenspace_coverage_ratio:"Green space (share of area)",
  greenspace_area_m2:"Green space area (m²)", road_density_km_per_km2:"Road density (km per km²)",
  far:"Floor area ratio", levels_tagged_pct:"Buildings with a height tag (%)",
  parking_coverage_ratio:"Parking (share of area)", pedestrian_density_km_per_km2:"Sidewalks and paths (km per km²)",
  transit_stop_count:"Transit stops", transit_stop_density_per_km2:"Transit stops per km²",
  facility_count:"Community facilities", facility_density_per_km2:"Community facilities per km²",
  land_use_mix:"Land-use mix (0 = one use, 1 = even mix)", land_use_categories:"Land-use categories",
  near_major_road_exposure:"Buildings within 150 m of a major road (%)", industrial_land_share:"Industrial land (% of area)",
};
function resultLabel(k, details){
  if(RESULT_LABELS[k]) return RESULT_LABELS[k];
  const d = (details||{})[k];
  return withUnit(measureLabel(k), d && d.unit);
}
// Mirrors with_unit in hcas.py: never "(percentile) (percentile (0-1))".
function withUnit(label, unit){
  if(!unit) return label;
  const m = String(unit).match(/^(.*?)(?: \((.*)\))?$/);
  const head = m[1], rest = m[2]||"";
  const tag = `(${head})`;
  if(label.toLowerCase().endsWith(tag.toLowerCase()))
    return label.slice(0, -tag.length) + (rest ? `(${head}, ${rest})` : tag);
  if(head.length >= 4 && label.toLowerCase().includes(head.toLowerCase())) return label;
  return `${label} (${unit})`;
}
function fmtVal(v){
  return v===null||v===undefined ? null
    : typeof v==="number" ? (+v).toLocaleString(undefined,{maximumFractionDigits:3}) : String(v);
}
function metricCards(a){
  const det = a.measure_details||{};
  return Object.entries(a.metrics||{}).map(([k,v])=>{
    const d = det[k];
    const why = v==null && d && d.not_measured ? d.not_measured : "";
    return `<div class="metric-c" title="${esc(k)}"><div class="mn">${esc(resultLabel(k, det))}</div>
      <div class="mv"${v==null?' style="color:var(--warn,#dd6b20);font-style:italic;font-size:12px;"':''}>${
        v==null ? "not measured" : esc(fmtVal(v))}</div>
      ${d ? `<div class="ml">${esc(d.level||"")}${d.source?` · ${esc(d.source)}`:""}${d.us!=null?` · US ${esc(fmtVal(d.us))}`:""}</div>` : ""}
      ${why ? `<div class="ml">${esc(why)}</div>` : ""}</div>`;
  }).join("");
}
function runWarnings(a){
  // null = the layer this metric needs failed to fetch. Never render it as a
  // number; "not measured" and 0 are different claims about a community.
  const errs = a.fetch_errors||{};
  const errKeys = Object.keys(errs);
  const warn = errKeys.length?`<div class="warnbar">⚠<div><b>Data sources failed during this run:</b> ${errKeys.map(esc).join(", ")} — ${esc(errs[errKeys[0]])}</div></div>`:"";
  const terrs = Object.entries(a.table_errors||{});
  const twarn = terrs.length?`<div class="warnbar">⚠<div><b>Community data unavailable this run:</b> ${terrs.map(([k,v])=>esc(v)).join(" · ")}</div></div>`:"";
  const note = a.map_note?`<div class="warnbar">⚠<div>${esc(a.map_note)}</div></div>`:"";
  const um = a.unmeasured_metrics||[];
  const unmeasured = um.length?`<div class="warnbar">⚠<div><b>Not measured this run:</b> ${um.map(k=>esc(resultLabel(k, a.measure_details))).join(", ")} — shown as "not measured", not as 0. No recommendation was generated from them, so an absent finding here means unknown, not fine.</div></div>`:"";
  return warn + twarn + note + unmeasured;
}
function interventionsHtml(a){
  return (a.interventions||[]).map(iv=>`
    <div class="iv ${esc(iv.severity||"")}"><span class="sev">${esc(iv.severity||"")}</span>
      <div class="cat">${esc(iv.category)}</div>
      <div class="fin">${esc(iv.finding)}</div>
      <div class="fin"><b>→</b> ${esc(iv.recommendation)} <span style="color:var(--ghost)">(${esc(iv.standard||"")})</span></div></div>`).join("");
}
function mapFrame(a, which){
  const q = which==="base" ? "?which=base" : "";
  return a.map_available
    ? `<iframe class="mapframe" src="/hcas/projects/${S.pid}/map${q}" title="${which==="base"?"Base area":"Assessment"} map"></iframe>`
    : `<div class="lab"><div class="eyebrow">Map view</div>
        <div class="mono" style="color:var(--faint);font-size:12px;margin-top:5px;">The map could not be rendered this run.</div></div>`;
}
function comparisonPanel(a){
  const comp = a.comparison||{};
  const keys = Object.keys(comp);
  if(!keys.length) return "";
  const det = a.measure_details||{};
  const cell = v => v==null ? '<span style="color:var(--faint)">not measured</span>' : esc(fmtVal(v));
  const rows = keys.map(k=>{
    const r = comp[k];
    const diff = r.difference==null ? '<span style="color:var(--faint)">—</span>'
      : `${r.difference>0?"+":""}${esc(fmtVal(r.difference))}`;
    return `<tr><td>${esc(resultLabel(k, det))}</td><td class="num">${cell(r.project)}</td><td class="num">${cell(r.base)}</td><td class="num">${diff}</td></tr>`;
  }).join("");
  return `<div class="panel"><div class="ph">Project area compared with the base area</div>
    <div style="overflow-x:auto;"><table class="data"><thead><tr><th>Measure</th><th>Project area</th><th>Base area</th><th>Difference</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="subnote">Both areas were computed with the same confirmed workflow and data sources. Difference = project area minus base area.
      County-wide measures are equal when both areas are in the same county.</div></div>`;
}
function viewExecution(a){
  const waiting = awaitingPanel(a.awaiting_data);
  if(a.base && compareOn()){
    const b = a.base;
    return `${runWarnings(a)}${comparisonPanel(a)}${waiting}<div class="cmpgrid">
      <div>${cmpHead("project")}<div class="panel"><div class="ph">Map view${a.map_available?` · <a href="/hcas/projects/${S.pid}/map" target="_blank" style="text-transform:none;letter-spacing:0;">open ↗</a>`:""}</div>
          <div class="mapview">${mapFrame(a,"project")}</div></div>
        <div class="panel"><div class="ph">Metrics</div><div class="metricgrid">${metricCards(a)||'<div class="empty">No metrics.</div>'}</div></div>
        ${byUnitPanel(a.by_unit)}
        <div class="panel"><div class="ph">Recommendations</div>${interventionsHtml(a)||'<div class="empty">None.</div>'}</div></div>
      <div>${cmpHead("base")}${runWarnings(b)}<div class="panel"><div class="ph">Map view${b.map_available?` · <a href="/hcas/projects/${S.pid}/map?which=base" target="_blank" style="text-transform:none;letter-spacing:0;">open ↗</a>`:""}</div>
          <div class="mapview">${mapFrame(b,"base")}</div></div>
        <div class="panel"><div class="ph">Metrics</div><div class="metricgrid">${metricCards(b)||'<div class="empty">No metrics.</div>'}</div></div>
        ${byUnitPanel(b.by_unit)}
        <div class="panel"><div class="ph">Recommendations</div>${interventionsHtml(b)||'<div class="empty">None.</div>'}</div></div>
    </div>`;
  }
  // Layer list built from the confirmed step-3 inventory (the analysis map draws
  // these). Visibility checkboxes drive the map's own layer control. landuse has
  // no map layer, so it shows without a toggle.
  const s3 = stepRow(3);
  const inv = s3 ? (s3.human_final||s3.ai_draft||{}) : {};
  const list = layerListPanel(inv.layers||[], inv.study_area, {toggles:!!a.map_available});
  // Prof. Shi's layout: layer list left · map upper-right · metrics + recs beneath
  return `${runWarnings(a)}${waiting}<div class="cols" style="align-items:stretch;flex-wrap:nowrap;">
    <div class="panel tree" style="width:280px;flex:none;"><div class="ph">Layers</div>${list}
      <div class="subnote">Toggle a layer's checkbox to show/hide it; right-click for attributes &amp; properties.</div></div>
    <div class="stack" style="flex:1;">
      <div class="panel"><div class="ph">Map view${a.map_available?` · <a href="/hcas/projects/${S.pid}/map" target="_blank" style="text-transform:none;letter-spacing:0;">open full map ↗</a>`:""}</div>
        <div class="mapview">${mapFrame(a,"project")}</div></div>
      <div id="layerinfo"></div>
      <div class="panel"><div class="ph">Metrics</div>
        <div class="metricgrid">${metricCards(a)||'<div class="empty">No metrics.</div>'}</div></div>
      ${byUnitPanel(a.by_unit)}
      <div class="panel"><div class="ph">Recommendations</div>${interventionsHtml(a)||'<div class="empty">None.</div>'}</div>
    </div></div>`;
}

/* Per-unit table (Prof. Shi 2026-08-07 #5). Always renders something: either the
   rows or the stated reason there are none, so an absent table never has to be
   guessed at. */
function byUnitPanel(bu){
  if(!bu) return "";
  const rows = bu.rows||[];
  const head = `<div class="ph">By ${esc((bu.label||bu.unit||"unit").toLowerCase())}${
    rows.length?` · ${rows.length} ${rows.length===1?"area":"areas"}`:""}</div>`;
  if(!rows.length)
    return `<div class="panel">${head}<div class="empty" style="padding:14px;">${esc(bu.note||"Not tabulated.")}</div></div>`;
  // Column set = union of the metric keys actually present, in first-row order.
  const cols = [];
  rows.forEach(r=>Object.keys(r.metrics||{}).forEach(k=>{ if(!cols.includes(k)) cols.push(k); }));
  const fmt = v => v==null ? '<span style="color:var(--faint)">—</span>'
    : (typeof v==="number" ? (+v).toLocaleString(undefined,{maximumFractionDigits:3}) : esc(v));
  const body = rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${(+r.area_km2).toLocaleString(undefined,{maximumFractionDigits:2})}</td>${
    cols.map(c=>`<td>${fmt((r.metrics||{})[c])}</td>`).join("")}</tr>`).join("");
  return `<div class="panel">${head}
    ${bu.note?`<div class="subnote" style="margin-bottom:8px;">${esc(bu.note)}</div>`:""}
    <div style="overflow-x:auto;max-height:340px;overflow-y:auto;">
      <table class="data"><thead><tr><th>${esc(bu.label||"Unit")}</th><th>km²</th>${
        cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="subnote">Computed with the same metric code as the county figures, clipped to each
      boundary. Source: ${esc(bu.source||"US Census TIGERweb")}.</div></div>`;
}

/* The embedded map is same-origin, so we can see inside it: if its document
   finished loading but Leaflet (global L) never appeared, the drawing library's
   CDN is blocked — data is fine, the browser just can't draw. Say so. */
function wireMapCheck(){
  const f = document.querySelector(".mapframe");
  if(!f) return;
  const check = ()=>{
    try{
      // folium wraps the map in a nested srcdoc iframe — Leaflet lives there
      const outer = f.contentWindow;
      if(!outer || !outer.document || outer.document.readyState === "loading") return;
      const inner = outer.document.querySelector("iframe");
      const w = (inner && inner.contentWindow) || outer;
      if(!w.document || w.document.readyState === "loading") return;
      if(typeof w.L !== "undefined" || $("mapcdnwarn")) return;
      f.closest(".stack").insertAdjacentHTML("afterbegin",
        `<div class="warnbar" id="mapcdnwarn">⚠<div><b>The map data loaded but the map cannot draw</b> —
         the browser could not download the map-drawing library from its content network
         (cdn.jsdelivr.net appears blocked). The metrics and report are unaffected.</div></div>`);
    }catch(_){}
  };
  f.addEventListener("load", ()=>setTimeout(check, 4000));
  setTimeout(check, 15000);
}

/* ================= actions ================= */
/* Reads the definition form. Creates the project, or — when the analyst came
   back to re-define it (Prof. Shi 2026-08-07 #8) — updates it in place, which
   marks everything drafted from the old scope stale. */
/* A fingerprint of everything the definition form sets, to tell whether the
   analyst changed anything since the project was saved. */
function areaSig(o){
  return o ? [o.state_fips, o.county_fips, o.areal_unit||"county",
              [...(o.area_geoids||[])].map(String).sort().join(","), o.area_name||""].join("|") : "";
}
function scopeSig(o){
  return [o.title||"", o.location_query||"", o.notes||"", areaSig(o), areaSig(o.base)].join("§");
}
function readStep1Form(){
  const area = areaPayload("project");
  if(area.error) throw new Error(area.error);
  let base = null;
  if(AREA.compare){
    base = areaPayload("base");
    if(base.error) throw new Error(base.error);
  }
  return { title:($("f_title").value||"Untitled assessment"), ...area, base,
           location_query:($("f_where")?.value||""), notes:($("f_tasks")?.value||""),
           ai_note:(AREA.fields?.ai_note||"") };
}
function step1Changed(){
  const m = S.project?.meta; if(!S.pid || !m) return true;
  return scopeSig(readStep1Form()) !== scopeSig({title:m.title, location_query:m.location_query, notes:m.notes,
    state_fips:m.state_fips, county_fips:m.county_fips, areal_unit:m.areal_unit,
    area_geoids:m.area_geoids, area_name:m.area_name, base:m.base||null});
}
/* Reads the definition form. Creates the project, or updates it in place when
   the analyst changed something — which marks everything drafted from the old
   scope stale. */
async function ensureProject(){
  const form = readStep1Form();
  if(S.pid){
    const mm = S.project?.meta || {};
    if(step1Changed() || (mm.ai_note||"") !== form.ai_note
        || !!mm.area_polygon !== !!form.area_polygon
        || (mm.area_polygon_name||"") !== (form.area_polygon?.properties?.name||""))
      await api(`/hcas/projects/${S.pid}`,{method:"PATCH",body:JSON.stringify(form)});
    S.redefining=false;
    return;
  }
  // gate_mode is always "gated": Prof. Shi 2026-08-07 #6 removed the choice —
  // "always do the user-confirmation". The auto arm stays available to the
  // research ablation through the API, not through the wizard.
  S.pid=(await api("/hcas/projects",{method:"POST",
        body:JSON.stringify({...form, gate_mode:"gated"})})).project_id;
  await flushPendingAi();
  dropResumeBar();
  try{ localStorage.setItem("hcas_last_project", S.pid); }catch(_){}
}
async function refresh(keep){
  S.project=await api(`/hcas/projects/${S.pid}`);
  // `keep` means a run just finished; if the user has since moved to a different
  // step, adopt THAT step's artifact rather than leaving the finished one in the
  // editor under the wrong heading.
  if(keep && !S.edited){ const r=stepRow(S.current); if(r) S.edited=JSON.parse(JSON.stringify(r.human_final??r.ai_draft)); }
  if(!keep){ const row=stepRow(S.current); S.edited=row?JSON.parse(JSON.stringify(row.human_final??row.ai_draft)):null; }
  renderRail(); renderBar(); renderCanvas(); renderChat(); renderCmd();
}
// Keep a freshly-drafted step in local project state so navigating away and
// back restores it even if the server refresh below fails (e.g. a transient
// error or rate-limit). Without this, a failed GET /projects left S.project
// stale and the step re-rendered as "Nothing here yet".
function upsertLocalDraft(n, draft){
  if(!S.project || !Array.isArray(S.project.steps)) S.project = {...(S.project||{}), steps: []};
  let row = S.project.steps.find(s=>s.step===n);
  if(!row){ row={step:n}; S.project.steps.push(row); S.project.steps.sort((a,b)=>a.step-b.step); }
  if(row.status!=="confirmed"){ row.status="drafted"; row.ai_draft=draft; }
}
async function runStep(opts){
  if(S.busy) return;
  // Named `refetch`, not `refresh`: a local `refresh` shadowed the refresh()
  // function below, so `await refresh(true)` threw "Cannot read properties of
  // undefined (reading 'title')" after every new project's step 1.
  const refetch = !!(opts && opts.refresh);
  // Pin the step being run. Everything after the await used to read S.current,
  // which the user can change by clicking another step mid-run — so a finished
  // draft could be written onto whatever step they had navigated to, and then
  // confirmed as that step's artifact.
  const step = S.current;
  S.running = step;
  setBusy(true); setMsg(""); statusRun("Running…");
  let failed = null;
  try{
    if(step===1)
      await ensureProject();  // reads the definition form — before it is replaced
    if(S.current===step) renderCanvasLoading(step);  // only if that step is still on screen
    startProgress(step);
    const {ai_draft}=await api(`/hcas/projects/${S.pid}/steps/${step}/run${refetch?"?refresh=true":""}`,{method:"POST"});
    S.running=null;                          // the run is over; re-renders show the result now
    upsertLocalDraft(step, ai_draft);        // survive a failed refresh so nav restores it
    if(S.current===step){                    // only touch the editor if it is still on screen
      S.edited=JSON.parse(JSON.stringify(ai_draft));
      S.draftShownAt=Date.now();
    }
    try{ await refresh(true); }
    catch(_){ renderRail(); renderBar(); renderCanvas(); renderCmd(); }
  }catch(e){ failed = e; }
  finally{
    // Order matters. The failure path used to re-render while S.running was
    // still set, so renderCanvas drew the loading body again — and nothing
    // re-rendered after the flag was cleared, leaving the spinner turning
    // forever on a run that had already failed. And statusRun("") writes to the
    // same element as setMsg, so clearing the "Running…" indicator here erased
    // the only report of what went wrong. Clear the flag first, then render,
    // and never clear the line on a failure.
    S.running=null; stopProgress(); setBusy(false);
    if(failed){ setMsg(failed.message); renderCanvas(); }
    else statusRun("");
  }
  // Hosted, there is a proxy between this browser and a request that can
  // legitimately take minutes, and a cut connection looks exactly like a failed
  // run from here — while on the server the step is still going. Ask before
  // reporting: if it is still running, re-attach to it and keep the progress
  // bar, instead of showing an error the user can do nothing with.
  if(failed && await adoptRunningStep(step, true)) setMsg("");
  return !failed;
}
/* Step 1's Confirm does the quiet work (Prof. Shi 2026-11-13 #9, #10): save the
   definition, work out the study-area facts, then confirm — all in one press, so
   there is no second page that only displays the area. Returns false when the
   caller should stop (an error is on the command line, or nothing more to do). */
async function commitStep1(){
  if(S.busy) return false;
  setMsg("");
  let changed;
  try{ changed = step1Changed(); }
  catch(e){ setMsg(e.message); return false; }
  const row = stepRow(1);
  if(row && !changed){
    if(row.status==="confirmed"){ selectStep(2); return false; }   // nothing to redo
    return true;                                                    // drafted: just confirm it
  }
  if(!(await runStep())) return false;
  const r = stepRow(1);
  return !!r && r.status!=="stale";
}
/* Step 5 (Prof. Shi 2026-11-13): on Confirm, ask "Download and save the database?".
   Yes builds one package (every layer, the user's own data, the project area and a
   metadata table), downloads it and keeps the latest copy on the server. It is only
   asked when the database is new or changed since the last save. In-page dialog, not
   a browser confirm(). Resolves once the analyst has answered; Confirm goes on either way. */
async function askSaveDatabase(){
  let st;
  try{ st = await api(`/hcas/projects/${S.pid}/database/status`); }catch(_){ return; }
  if(!st.ask) return;
  await new Promise(resolve=>{
    modal(`<h3>Download and save the database?</h3>
      <p>Yes downloads the data from the online sources, puts it together with any data you uploaded,
        and saves the whole package for this project, as one file on your computer and a copy with the project.</p>
      <div id="dbMsg" class="subnote" style="min-height:20px;"></div>
      <div class="acts"><button class="cbtn" id="dbNo">No</button>
        <button class="cbtn next" id="dbYes">Yes</button></div>`);
    $("dbNo").onclick = ()=>{ closeModal(); resolve(); };
    $("dbYes").onclick = async ()=>{
      $("dbYes").disabled = true; $("dbNo").disabled = true;
      $("dbMsg").innerHTML = '<span class="spin"></span>Building the package…';
      try{
        const sum = await api(`/hcas/projects/${S.pid}/database/save`, {method:"POST", body:"{}"});
        const r = await fetch(`/hcas/projects/${S.pid}/database.zip`, {headers:{"X-Requested-With":"geoai"}});
        if(!r.ok) throw new Error("The saved package could not be downloaded ("+r.status+").");
        const blob = await r.blob();
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = sum.filename || "database.zip";
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
        closeModal(); setMsg("Database saved: "+(sum.filename||"database.zip")); resolve();
      }catch(e){
        $("dbMsg").innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
        $("dbYes").disabled = false; $("dbYes").textContent = "Try again"; $("dbNo").disabled = false;
        $("dbNo").textContent = "Continue without saving";
      }
    };
  });
}
async function confirmStep(){
  if(step1Form() && !(await commitStep1())) return;
  const row=stepRow(S.current);
  if(!row||S.busy) return;
  if(S.current===5 && S.pid) await askSaveDatabase();
  setBusy(true); setMsg("");
  let autorun=false;
  try{
    const edit_seconds=S.draftShownAt?(Date.now()-S.draftShownAt)/1000:null;
    await api(`/hcas/projects/${S.pid}/steps/${S.current}/confirm`,
      {method:"POST",body:JSON.stringify({human_final:S.edited,edit_seconds})});
    if(S.current<8) S.current+=1;
    S.draftShownAt=null;
    await refresh();
    // Prof. Shi: confirming should flow straight into drafting the next step,
    // not land on an empty canvas waiting for a Run click. The human still
    // confirms every step, so the gate is intact.
    // A *stale* row counts as nothing to show. Confirming this step just
    // invalidated every step below it (the backend flags them), so whatever is
    // sitting on the next canvas was computed from a scope that no longer
    // holds — landing on it is worse than landing on an empty page, because it
    // looks like a current result. Draft it again instead.
    const nextRow = stepRow(S.current);
    autorun = !nextRow || nextRow.status === "stale";
  }catch(e){ setMsg("Confirm failed: "+e.message); }
  finally{ setBusy(false); }
  if(autorun) await runStep();
}

/* ================= assistant ================= */
function renderChat(){
  const opener = S.pid
    ? `Ask about ${STEP_TITLES[S.current-1].toLowerCase()}, or anything you see on this step.`
    : `Ask anything about this system before you start — what the eight steps do, `
      + `what data it uses, or how to define a study area.`;
  const h=S.chats[S.current] || (S.chats[S.current]=[{role:"assistant", content:opener}]);
  $("msgs").innerHTML=h.map(m=>(m.role==='user'||m.err)
    ? `<div class="bub ${m.role==='user'?'u':'err'}">${esc(m.content)}</div>`
    : `<div class="bub a md">${chatMd(m.content)}</div>`).join("");
  $("msgs").scrollTop=$("msgs").scrollHeight;
}
/* The assistant answers in light markdown. It used to reach the bubble raw —
   "**", backticks and "- " on screen (QA 2026-09-29). Everything is escaped
   FIRST, then only these few patterns become tags, so no model output can
   inject HTML: bold, italics, inline code, bullet and numbered lists, line
   breaks, and a heading line shown as bold. */
function chatMd(text){
  const inl = t => t
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_\n]+?)__/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?![*\w])/g, "$1<em>$2</em>")
    .replace(/(^|[^_\w])_(?!\s)([^_\n]+?)_(?![_\w])/g, "$1<em>$2</em>");
  const lines = esc(text).split(/\r?\n/);
  const out = []; let para = [], list = null;
  const flushP = ()=>{ if(para.length){ out.push("<p>"+para.map(inl).join("<br>")+"</p>"); para=[]; } };
  const flushL = ()=>{ if(list){ out.push(`<${list.tag}>`+list.items.map(x=>"<li>"+inl(x)+"</li>").join("")+`</${list.tag}>`); list=null; } };
  for(const raw of lines){
    const l = raw.replace(/\s+$/,"");
    const ul = l.match(/^\s*[-*•]\s+(.*)$/), ol = l.match(/^\s*\d+[.)]\s+(.*)$/);
    if(ul || ol){
      flushP();
      const tag = ul ? "ul" : "ol";
      if(!list || list.tag !== tag){ flushL(); list = {tag, items: []}; }
      list.items.push((ul||ol)[1]); continue;
    }
    flushL();
    if(!l.trim()){ flushP(); continue; }
    const hd = l.match(/^#{1,6}\s+(.*)$/);
    para.push(hd ? "**"+hd[1]+"**" : l);
  }
  flushP(); flushL();
  return out.join("");
}
/* Prof. Shi 2026-08-07 #3: "Allow the user to ask AI questions – even before
   creating a project." Without a project id the question goes to the intake
   assistant, which knows the system but has no project data to invent from. */
async function sendChat(){
  const inp=$("prompt"), text=inp.value.trim();
  if(!text) return;
  inp.value="";
  const h=S.chats[S.current]||(S.chats[S.current]=[]);
  h.push({role:"user",content:text}); renderChat();
  $("msgs").insertAdjacentHTML("beforeend",`<div class="typing" id="typing"><span></span><span></span><span></span></div>`);
  $("msgs").scrollTop=$("msgs").scrollHeight;
  try{
    const hist=[{role:"user",content:"[Guidance] "+S.sys},...h.slice(-8)];
    const res = S.pid
      ? await api(`/hcas/projects/${S.pid}/chat`,
          {method:"POST",body:JSON.stringify({message:text,step:S.current,history:hist})})
      : await api("/hcas/chat",{method:"POST",body:JSON.stringify({message:text,history:hist,step:S.current})});
    relayAi(res);
    h.push({role:"assistant",content:res.reply});
  }catch(e){ h.push({role:"assistant",content:"⚠ "+e.message,err:true}); }
  renderChat();
}
