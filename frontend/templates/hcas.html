<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Healthy Community Assessment System</title>
<link rel="icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Leaflet for the step-1 area picker; the analysis maps load their own copy. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* HCAS — Xun Shi's layout, wired to the gated 8-step backend.
     Direction: a precise cartographic field instrument. Archivo (titles) +
     Hanken Grotesk (text) + JetBrains Mono (data). OKLCH, teal-forward,
     neutrals tinted toward the brand hue. See .impeccable.md. */
  :root{
    --sans:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
    --display:'Archivo','Hanken Grotesk',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --fs-xs:.6875rem; --fs-sm:.8125rem; --fs-base:.875rem; --fs-md:1rem; --fs-lg:1.375rem; --fs-xl:1.75rem;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-12:48px;
    --r-sm:7px; --r:10px; --r-lg:14px;
    --teal:oklch(0.52 0.085 219); --teal-d:oklch(0.43 0.082 221);
    --teal-tint:oklch(0.958 0.019 219); --teal-tint-d:oklch(0.9 0.033 219);
    --ink:oklch(0.30 0.017 226); --muted:oklch(0.505 0.019 224);
    --faint:oklch(0.61 0.017 223); --ghost:oklch(0.71 0.013 222);
    --line:oklch(0.905 0.008 220); --line-d:oklch(0.845 0.012 220);
    --grid:oklch(0.905 0.011 219);
    --bg:oklch(0.955 0.008 221); --surface:oklch(0.996 0.003 220);
    --panel:oklch(0.978 0.006 220); --head:oklch(0.984 0.005 220);
    --amber:oklch(0.55 0.10 64); --amber-tint:oklch(0.95 0.036 74);
    --ok:oklch(0.53 0.085 158); --ok-tint:oklch(0.945 0.032 158);
    --red:oklch(0.54 0.15 26); --red-tint:oklch(0.945 0.04 30);
    --info:oklch(0.5 0.06 244); --info-tint:oklch(0.95 0.028 244);
    --draft:oklch(0.58 0.10 66); --stale:oklch(0.56 0.13 32);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);
       font-size:var(--fs-base);line-height:1.5;overflow:hidden;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  ::selection{background:var(--teal-tint-d);}
  .mono{font-family:var(--mono);font-feature-settings:"tnum" 1;}
  .eyebrow{font:500 var(--fs-xs)/1.3 var(--mono);letter-spacing:.07em;color:var(--faint);text-transform:uppercase;}
  button{font-family:var(--sans);cursor:pointer;}
  a{color:var(--teal-d);text-underline-offset:2px;} a:hover{color:var(--teal);}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px;}

  #app{display:flex;flex-direction:column;height:100vh;padding:var(--sp-4) var(--sp-5);}
  #card{flex:1;display:flex;flex-direction:column;background:var(--surface);
        border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-height:0;
        box-shadow:0 1px 2px oklch(0.4 0.03 220/.05), 0 18px 40px -26px oklch(0.4 0.05 220/.35);}

  /* 1 · Header
     Prof. Shi 2026-09-16 #5: the menu (New, Open, …) comes first, on the left,
     where the eye lands; the system name moves to the right. */
  #hdr{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);height:58px;flex:none;
       border-bottom:1px solid var(--line);background:var(--head);}
  #logo{width:30px;height:30px;border-radius:8px;background:var(--teal);color:var(--surface);display:flex;
        align-items:center;justify-content:center;font:700 16px var(--display);flex:none;
        box-shadow:inset 0 1px 0 oklch(1 0 0/.2);}
  #brand{margin-left:auto;display:flex;align-items:center;gap:var(--sp-3);text-align:right;min-width:0;}
  #hdr .title{font:600 var(--fs-md)/1.1 var(--display);letter-spacing:-.01em;white-space:nowrap;}
  #hdr .sub{font:400 var(--fs-xs)/1 var(--mono);color:var(--faint);margin-top:3px;letter-spacing:.02em;}
  #nav{display:flex;align-items:center;gap:1px;flex-wrap:wrap;}
  .navbtn{border:none;background:none;font:600 var(--fs-base) var(--sans);color:var(--ink);
          padding:7px 11px;border-radius:7px;transition:background .15s,color .15s;}
  .navbtn:hover{background:var(--teal-tint);color:var(--ink);}
  .navbtn.exit{color:var(--red);} .navbtn.exit:hover{background:var(--red-tint);}
  .navsep{color:var(--line-d);font-size:11px;}

  /* 2 · Project bar */
  #pbar{display:flex;align-items:center;min-height:46px;flex:none;padding:7px var(--sp-5);
        border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;column-gap:0;row-gap:4px;}
  #pbar .grp{display:flex;align-items:center;gap:9px;}
  #pbar .divider{width:1px;height:18px;background:var(--line);margin:0 var(--sp-4);}
  #pbar .val{font:600 var(--fs-sm) var(--sans);color:var(--ink);}
  #pbar .val.mono{font:400 var(--fs-sm) var(--mono);color:var(--muted);}
  #sysprompt{font:400 var(--fs-sm) var(--sans);color:var(--muted);max-width:46ch;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-radius:6px;
             padding:2px 6px;cursor:text;transition:border-color .15s,background .15s;}
  #sysprompt:hover{border-color:var(--line);background:var(--panel);}

  #body{flex:1;display:flex;min-height:0;}

  /* 3 · Pipeline rail */
  #rail{width:240px;flex:none;border-right:1px solid var(--line);background:var(--panel);
        padding:var(--sp-4) 0;overflow-y:auto;}
  #rail .hd{padding:0 var(--sp-4) var(--sp-3);}
  .prow{display:flex;align-items:center;gap:11px;padding:9px var(--sp-4);cursor:pointer;
        transition:background .14s;}
  .prow:hover{background:var(--teal-tint);}
  .prow.active{background:var(--teal-tint);}
  .prow.locked{cursor:default;opacity:.5;}
  .prow.locked:hover{background:none;}
  .pdot{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line-d);color:var(--ghost);
        display:inline-flex;align-items:center;justify-content:center;font:500 12px var(--mono);flex:none;
        background:var(--surface);transition:border-color .14s,background .14s,color .14s;}
  .prow.active .pdot{border-color:var(--teal);color:var(--teal-d);}
  .pdot.confirmed{background:var(--ok);border-color:var(--ok);color:var(--surface);}
  .pdot.drafted{border-color:var(--draft);color:var(--draft);background:var(--amber-tint);}
  .pdot.stale{border-color:var(--stale);color:var(--stale);background:var(--red-tint);}
  .pcheck{color:var(--ok);font-weight:700;margin-left:4px;}
  .plabel{font:400 var(--fs-sm)/1.25 var(--sans);color:var(--muted);}
  .prow.active .plabel{color:var(--ink);font-weight:600;}
  .prow.confirmed .plabel{color:var(--ink);}

  /* 4 · Work canvas */
  #canvas{flex:1;min-width:0;background:var(--panel);overflow-y:auto;padding:var(--sp-6) var(--sp-6);}
  .chead{max-width:78ch;}
  .chead .eyebrow{color:var(--teal-d);}
  .chd{display:flex;align-items:baseline;gap:var(--sp-3);margin-top:6px;flex-wrap:wrap;}
  #canvas h2{font:700 var(--fs-xl) var(--display);letter-spacing:-.02em;margin:0;color:var(--ink);}
  #canvas .csub{font:400 var(--fs-base) var(--sans);color:var(--faint);max-width:60ch;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
         padding:var(--sp-4) var(--sp-5);margin-top:var(--sp-4);}
  .panel > .ph{font:500 var(--fs-xs) var(--mono);letter-spacing:.06em;text-transform:uppercase;
               color:var(--faint);margin-bottom:var(--sp-3);}
  .cols{display:flex;gap:var(--sp-4);flex-wrap:wrap;}
  .cols > *{flex:1;min-width:230px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:var(--fs-sm);align-items:baseline;align-content:start;}
  .kv dt{font:500 var(--fs-xs) var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .kv dd{margin:0;color:var(--ink);}
  .tree .grp{margin-bottom:10px;}
  .tree .gname{font:600 var(--fs-sm) var(--sans);color:var(--ink);display:flex;align-items:center;gap:8px;}
  .tree .gname::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--teal);display:inline-block;}
  .tree .leaf{font:400 var(--fs-sm) var(--sans);color:var(--muted);padding:3px 0 3px 16px;display:flex;justify-content:space-between;gap:10px;}
  .tree .leaf .c{font:400 var(--fs-xs) var(--mono);color:var(--ghost);white-space:nowrap;}
  /* Prof. Shi 2026-08-07 #1: "Expand the map view on all pages to have a larger
     size and a similar-to-square (rather than elongated) shape." Aspect-ratio
     drives the height, so the map grows with the panel and stays near-square
     instead of the old fixed 264px letterbox. */
  /* min-width:0 matters: with aspect-ratio, min-height:420px is transferred into
     an automatic min-width of 525px, so in the two-column comparison (QA
     2026-09-29, 1500-1600px wide) each map burst out of its column and the base
     column was cut off at the right. */
  .mapview{aspect-ratio:5/4;min-height:420px;min-width:0;max-width:100%;border-radius:var(--r-sm);border:1px solid var(--line);overflow:hidden;
           background-color:var(--teal-tint);
           background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                            linear-gradient(90deg,var(--grid) 1px,transparent 1px);
           background-size:24px 24px;background-position:-1px -1px;
           display:flex;align-items:center;justify-content:center;text-align:center;}
  .mapview .lab{background:oklch(1 0 0/.82);border:1px solid var(--line);border-radius:var(--r-sm);
                padding:9px 15px;backdrop-filter:blur(1px);}
  table.data{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
  table.data th{font:500 var(--fs-xs) var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--faint);
                text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
  table.data td{padding:7px 8px;border-bottom:1px solid var(--line);}
  table.data td:not(:first-child){font-family:var(--mono);}
  table.data tr:last-child td{border-bottom:none;}
  .above{color:var(--red);font-weight:600;} .below{color:var(--ok);font-weight:600;}

  .tag{font:600 var(--fs-xs)/1 var(--mono);letter-spacing:.03em;text-transform:uppercase;padding:5px 10px;
       border-radius:999px;background:var(--amber-tint);color:var(--amber);white-space:nowrap;}
  .tag.rag{background:var(--info-tint);color:var(--info);}
  .tag.done{background:var(--ok-tint);color:var(--ok);}
  .tag.muted{background:var(--teal-tint-d);color:var(--teal-d);}

  .factor{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);
          border-radius:var(--r-sm);background:var(--surface);margin-bottom:9px;transition:border-color .15s,background .15s,opacity .15s;}
  .factor:hover{border-color:var(--line-d);}
  .factor input{margin-top:2px;width:17px;height:17px;accent-color:var(--teal);flex:none;cursor:pointer;}
  .factor.off{opacity:.52;background:var(--panel);}
  .factor .fname{font:600 var(--fs-base) var(--sans);color:var(--ink);}
  .factor .metric{font:500 var(--fs-xs) var(--mono);color:var(--teal-d);background:var(--teal-tint);
                  border-radius:5px;padding:2px 7px;margin-left:9px;vertical-align:1px;}
  .factor .rat{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin-top:4px;line-height:1.45;}
  .sec{margin-bottom:var(--sp-4);}
  .sec:last-child{margin-bottom:0;}
  .sec h4{font:600 var(--fs-sm) var(--sans);margin:0 0 4px;color:var(--ink);}
  .sec p,.sec li{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin:3px 0;}
  .sec ul{margin:4px 0;padding-left:18px;}
  ul.flow{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;}
  ul.flow li{display:flex;align-items:center;gap:12px;padding:8px 0;font:400 var(--fs-sm) var(--sans);color:var(--ink);}
  ul.flow li .n{width:22px;height:22px;border-radius:6px;background:var(--teal-tint-d);color:var(--teal-d);
                font:500 11px var(--mono);display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .metricgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px;}
  .metric-c{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;background:var(--surface);}
  .metric-c .mn{font:500 var(--fs-xs) var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.02em;line-height:1.35;}
  .metric-c .mv{font:600 var(--fs-lg) var(--mono);color:var(--ink);margin-top:5px;font-feature-settings:"tnum" 1;}
  .iv{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;
      padding-right:76px;margin-bottom:9px;background:var(--surface);}
  .iv .sev{position:absolute;top:11px;right:11px;font:600 9.5px/1 var(--mono);letter-spacing:.05em;
           text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--amber-tint);color:var(--amber);}
  .iv.high .sev{background:var(--red-tint);color:var(--red);}
  .iv.low .sev{background:var(--ok-tint);color:var(--ok);}
  .iv .cat{font:600 var(--fs-base) var(--sans);color:var(--ink);}
  .iv .fin{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin-top:4px;line-height:1.45;}
  #report{width:100%;min-height:320px;font:400 var(--fs-sm)/1.6 var(--mono);padding:15px;border:1px solid var(--line);
          border-radius:var(--r-sm);resize:vertical;background:var(--surface);color:var(--ink);}
  #report:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  .rprev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:20px 24px;overflow-x:auto;}
  .rprev h1{font:700 var(--fs-lg) var(--display);letter-spacing:-.01em;margin:.1em 0 .3em;}
  .rprev h2{font:600 var(--fs-md) var(--display);margin:1.1em 0 .35em;border-bottom:1px solid var(--line);padding-bottom:4px;}
  .rprev h3{font:600 var(--fs-base) var(--sans);margin:.9em 0 .2em;}
  .rprev p,.rprev li{font-size:var(--fs-sm);color:var(--ink);line-height:1.6;}
  .rprev table{border-collapse:collapse;margin:10px 0;} .rprev th,.rprev td{border:1px solid var(--line);padding:5px 10px;font-size:var(--fs-sm);}
  .rprev blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--amber,#c98a1b);background:var(--panel);border-radius:0 var(--r-sm) var(--r-sm) 0;}
  .rprev th{background:var(--panel);font-family:var(--mono);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.03em;}
  details.raw{margin-top:var(--sp-4);}
  details.raw summary{font:500 var(--fs-xs) var(--mono);color:var(--faint);cursor:pointer;letter-spacing:.03em;
                      list-style:none;display:inline-flex;align-items:center;gap:6px;}
  details.raw summary::before{content:"▸";transition:transform .15s;display:inline-block;}
  details.raw[open] summary::before{transform:rotate(90deg);}
  details.raw summary:hover{color:var(--teal-d);}
  .linkbtn{border:none;background:none;font:500 var(--fs-xs) var(--mono);letter-spacing:.03em;
           color:var(--faint);padding:4px 0;border-bottom:1px dashed var(--line-d);}
  .linkbtn:hover{color:var(--teal-d);border-bottom-color:var(--teal);}
  details.raw textarea{width:100%;min-height:220px;margin-top:10px;font:400 var(--fs-xs)/1.55 var(--mono);
                       padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);}
  .subnote{font:400 var(--fs-xs) var(--sans);color:var(--ghost);margin-top:6px;}
  .form{max-width:760px;}
  .form .row{display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-4);}
  .form .fld{flex:1;min-width:220px;}
  .form label{font:500 var(--fs-xs) var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--faint);display:block;margin-bottom:6px;}
  .form input,.form select,.form textarea{width:100%;font:400 var(--fs-base) var(--sans);padding:10px 12px;
       border:1px solid var(--line-d);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);box-sizing:border-box;transition:border-color .15s,box-shadow .15s;}
  .form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  .form input:disabled{background:var(--panel);color:var(--faint);}
  .form textarea{resize:vertical;min-height:74px;}
  .form .hint{font:400 var(--fs-xs) var(--sans);color:var(--ghost);margin-top:6px;line-height:1.5;}
  .empty{text-align:center;color:var(--faint);padding:44px 0;font-size:var(--fs-base);}
  .empty .big{font:600 var(--fs-md) var(--display);color:var(--muted);margin-bottom:4px;}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
           min-height:340px;text-align:center;}
  .loading .lmsg{font:500 var(--fs-base) var(--sans);color:var(--muted);max-width:42ch;}
  /* Shown only on the two steps that fetch from OpenStreetMap. A slow step there
     is nearly always the public Overpass servers shedding load, not a fault in
     the run: measured 2026-08-11 and again 2026-08-13, roughly a third of
     requests are turned away under load and the identical query succeeds
     moments later. Saying so up front stops a normal slow fetch reading as a
     hang — which is exactly how the 2026-08-12 step-3 report was misread. */
  .loading .lnote{font:400 var(--fs-sm) var(--sans);color:var(--faint);
                  max-width:46ch;margin-top:-4px;line-height:1.55;}
  .spin-lg{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--teal);
           border-radius:50%;animation:spin .85s linear infinite;}

  /* 5 · Assistant */
  /* live progress bar in the loading state */
  .pbar{width:min(420px,72%);height:8px;border-radius:99px;background:var(--teal-tint-d);
        overflow:hidden;margin:16px auto 0;}
  .pbar .fill{height:100%;width:0%;background:var(--teal);border-radius:99px;
              transition:width .6s cubic-bezier(.4,0,.2,1);}
  .ppct{font:500 var(--fs-sm) var(--mono);color:var(--teal-d);margin-top:8px;}
  /* live per-layer checklist under the progress bar */
  .pchecklist{margin-top:16px;width:min(440px,80%);display:flex;flex-direction:column;gap:5px;text-align:left;}
  .ck-row{display:flex;align-items:center;gap:9px;font:400 var(--fs-sm) var(--sans);color:var(--muted);
          padding:5px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);}
  .ck-row.done{color:var(--ink);} .ck-row.error{color:var(--red);background:var(--red-tint);}
  .ck-name{flex:1;font-weight:500;} .ck-meta{font:400 var(--fs-xs) var(--mono);color:var(--faint);white-space:nowrap;}
  .ck-row.error .ck-meta{color:var(--red);white-space:normal;}
  .ck-ok{color:var(--ok);font-weight:700;width:14px;text-align:center;flex:none;}
  .ck-err{color:var(--red);font-weight:700;width:14px;text-align:center;flex:none;}
  .ck-run{width:12px;height:12px;flex:none;border:2px solid var(--line-d);border-top-color:var(--teal);
          border-radius:50%;animation:spin .8s linear infinite;}
  /* layer list rows + right-click menu (Prof. Shi 2026-07-27) */
  .lrow{align-items:center;gap:8px;padding:5px 4px 5px 2px;border-radius:6px;cursor:default;}
  .lrow:hover{background:var(--teal-tint);}
  .lvis{width:15px;height:15px;accent-color:var(--teal);flex:none;cursor:pointer;margin:0;}
  .lvis-sp{width:15px;flex:none;display:inline-block;}
  .lname{flex:1;color:var(--ink);font:400 var(--fs-sm) var(--sans);min-width:0;}
  .lmeta{display:block;margin-top:1px;}
  .lsrc{font:400 var(--fs-xs) var(--mono);color:var(--ghost);margin-right:4px;}
  .lkebab{border:none;background:none;color:var(--ghost);font-size:15px;line-height:1;padding:2px 5px;border-radius:5px;
          opacity:0;transition:opacity .12s,background .12s;}
  .lrow:hover .lkebab{opacity:1;} .lkebab:hover{background:var(--line);color:var(--ink);}
  .lmenu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-d);border-radius:var(--r-sm);

  /* drag handle between canvas and assistant (Prof. Shi: panels resizable) */

  .stack{display:flex;flex-direction:column;min-width:0;}
  .stack .panel+.panel{margin-top:0;border-top:0;border-top-left-radius:0;border-top-right-radius:0;}
  .stack .panel:first-child{border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .mapframe{width:100%;height:100%;border:0;display:block;background:#fff;}
  #chat{width:316px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;}
  #chat .chd{padding:14px var(--sp-4);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;margin:0;}
  #chat .chd .t{font:600 var(--fs-base) var(--display);color:var(--ink);}
  #chat .chd .s{font:400 var(--fs-xs) var(--mono);color:var(--faint);margin-top:3px;}
  #chat .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-tint);}
  #msgs{flex:1;overflow-y:auto;padding:var(--sp-4);display:flex;flex-direction:column;gap:10px;}
  .bub{max-width:90%;padding:10px 13px;font:400 var(--fs-sm)/1.5 var(--sans);border-radius:14px;white-space:pre-wrap;word-wrap:break-word;}
  .bub.a{align-self:flex-start;background:var(--teal-tint);color:var(--teal-d);border-bottom-left-radius:4px;}
  .bub.u{align-self:flex-end;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-right-radius:4px;}
  .bub.err{background:var(--red-tint);color:var(--red);}
  .bub.md{white-space:normal;}
  .bub.md p{margin:0 0 6px;} .bub.md p:last-child{margin-bottom:0;}
  .bub.md ul,.bub.md ol{margin:2px 0 6px;padding-left:18px;} .bub.md li{margin:1px 0;}
  .bub.md code{font:400 0.92em var(--mono,monospace);background:rgba(0,0,0,.06);padding:0 3px;border-radius:3px;}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--teal);opacity:.4;animation:blink 1.2s infinite both;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
  #chatform{flex:none;border-top:1px solid var(--line);padding:12px var(--sp-3);display:flex;align-items:center;gap:8px;}
  #chatbox{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line-d);border-radius:20px;
           background:var(--surface);padding:0 5px 0 15px;height:40px;transition:border-color .15s,box-shadow .15s;}
  #chatbox:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  #prompt{flex:1;border:none;outline:none;font:400 var(--fs-sm) var(--sans);background:none;color:var(--ink);}
  #send{border:none;border-radius:50%;width:29px;height:29px;background:var(--teal);color:var(--surface);
        font:600 14px var(--sans);flex:none;cursor:pointer;transition:background .15s;}
  #send:hover{background:var(--teal-d);} #send:disabled{opacity:.5;}

  /* 6 · Command bar */
  #cmd{flex:none;min-height:66px;border-top:1px solid var(--line);background:var(--surface);
       display:flex;align-items:center;gap:var(--sp-3);padding:12px var(--sp-5);flex-wrap:wrap;}
  .cbtn{border:1px solid var(--line-d);border-radius:var(--r-sm);background:var(--surface);color:var(--muted);
        font:500 var(--fs-base) var(--sans);padding:10px 17px;transition:background .15s,border-color .15s,color .15s;}
  .cbtn:hover{background:var(--panel);color:var(--ink);border-color:var(--line-d);}
  .cbtn.run{border-color:color-mix(in oklch,var(--amber) 45%,var(--line-d));color:var(--amber);background:var(--surface);}
  .cbtn.run:hover{background:var(--amber-tint);}
  .cbtn.next{border-color:var(--teal);background:var(--teal);color:var(--surface);font-weight:600;padding:10px 20px;}
  .cbtn.next:hover{background:var(--teal-d);border-color:var(--teal-d);color:var(--surface);}
  .cbtn:disabled{opacity:.42;cursor:default;background:var(--surface);color:var(--muted);}
  .cbtn.next:disabled{background:var(--teal);color:var(--surface);}
  #msgline{font:400 var(--fs-sm) var(--sans);color:var(--red);flex:1;min-width:0;}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-d);border-top-color:var(--teal);
        border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* dialog */
  #veil{position:fixed;inset:0;background:oklch(0.3 0.03 224/.4);display:none;align-items:center;
        justify-content:center;z-index:50;backdrop-filter:blur(2px);}
  #veil.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;
         max-width:460px;width:90%;box-shadow:0 24px 60px -20px oklch(0.3 0.05 224/.45);}
  .modal h3{margin:0 0 8px;font:600 var(--fs-lg) var(--display);letter-spacing:-.01em;color:var(--ink);}
  .modal p{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin:8px 0;line-height:1.55;}
  .modal input,.modal textarea{width:100%;font:400 var(--fs-base) var(--sans);padding:10px 12px;
       border:1px solid var(--line-d);border-radius:var(--r-sm);box-sizing:border-box;margin-top:8px;color:var(--ink);background:var(--surface);}
  .modal input:focus,.modal textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  .modal .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;}
  .modal.wide{max-width:820px;}
  .notesbox{width:100%;font:400 var(--fs-sm)/1.5 var(--sans);padding:9px 11px;border:1px solid var(--line-d);
            border-radius:var(--r-sm);color:var(--ink);background:var(--surface);resize:vertical;box-sizing:border-box;}
  .notesbox.ro{max-height:4.6em;overflow:hidden;color:var(--muted);white-space:pre-wrap;}
  .notesfull{width:100%;min-height:52vh;max-height:70vh;overflow:auto;font:400 var(--fs-base)/1.65 var(--sans);
             padding:14px 16px;border:1px solid var(--line-d);border-radius:var(--r-sm);color:var(--ink);
             background:var(--surface);box-sizing:border-box;white-space:pre-wrap;resize:vertical;margin-top:6px;}

  /* Project area / base area definition (Prof. Shi 2026-09-16 #1, #3). With a
     base area the form splits into two similar panels side by side. */
  .form.wideform{max-width:1180px;}
  .defgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-4);margin-bottom:var(--sp-4);}
  .defgrid.compare{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  @media (max-width:1100px){ .defgrid.compare{grid-template-columns:minmax(0,1fr);} }
  .areapanel{border:1px solid var(--line);border-radius:var(--r);padding:var(--sp-4);background:var(--panel);min-width:0;}
  .areapanel .ph{font:600 var(--fs-sm) var(--sans);color:var(--ink);text-transform:none;letter-spacing:0;margin-bottom:10px;}
  .areapanel.base{border-color:color-mix(in oklch,var(--info) 40%,var(--line));}
  .areapanel .row{gap:var(--sp-3);margin-bottom:var(--sp-3);}
  .areapanel .fld{min-width:160px;}
  /* `.form label` styles field captions (small mono caps); these two are
     sentences a person clicks, so they opt out of it. */
  .chkline,.form label.chkline{display:flex;align-items:center;gap:9px;font:600 var(--fs-sm) var(--sans);color:var(--ink);
           margin:4px 0;cursor:pointer;text-transform:none;letter-spacing:0;}
  .chkline input,.form .chkline input{width:16px;height:16px;accent-color:var(--teal);margin:0;flex:none;padding:0;}
  .radioline,.form label.radioline{display:flex;align-items:flex-start;gap:8px;font:400 var(--fs-sm) var(--sans);color:var(--ink);
             margin:6px 0;cursor:pointer;text-transform:none;letter-spacing:0;}
  .radioline input,.form .radioline input{accent-color:var(--teal);margin:3px 0 0;flex:none;width:auto;padding:0;}
  .areamap{height:600px;border-radius:var(--r-sm);border:1px solid var(--line);overflow:hidden;background:var(--teal-tint);
           display:flex;align-items:center;justify-content:center;color:var(--faint);font:400 var(--fs-sm) var(--sans);margin-top:10px;}
  .areasum{font:500 var(--fs-sm) var(--sans);color:var(--ink);margin-top:8px;}
  .areasum .muted{color:var(--faint);font-weight:400;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:120px;overflow:auto;}
  .chip{display:inline-flex;align-items:center;gap:6px;font:400 var(--fs-xs) var(--sans);color:var(--teal-d);
        background:var(--teal-tint);border:1px solid var(--teal-tint-d);border-radius:999px;padding:3px 4px 3px 10px;}
  .chip button{border:none;background:none;color:var(--teal-d);font-size:13px;line-height:1;padding:0 5px;border-radius:50%;}
  .chip button:hover{background:var(--teal-tint-d);}
  .maprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .maprow .maphint{font:400 var(--fs-sm) var(--sans);color:var(--muted);flex:1;min-width:200px;}
  .aifail{font:500 var(--fs-sm) var(--sans);color:var(--amber);background:var(--amber-tint);border-radius:var(--r-sm);padding:7px 10px;margin:6px 0;}
  .cmpbar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .cmpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--sp-4);align-items:start;}
  .cmpgrid > div{min-width:0;}
  .cmpgrid .cols{flex-wrap:wrap!important;}
  .cmpgrid .panel.tree{width:100%!important;}
  .cmpgrid .mapview{min-height:300px;}
  .cmpgrid .panel,.cmpgrid .cols > *{min-width:0;}
  .cmpgrid table.data{table-layout:auto;}
  .cmpgrid .data td{overflow-wrap:anywhere;}
  .cmphead{font:600 var(--fs-sm) var(--sans);color:var(--ink);margin:var(--sp-4) 0 -6px;display:flex;gap:8px;align-items:center;}
  .cmphead .tag{font-size:10px;}
  .tag.base{background:var(--info-tint);color:var(--info);}
  .tag.wait{background:var(--amber-tint);color:var(--amber);}
  .metric-c .ml{font:400 var(--fs-xs) var(--sans);color:var(--faint);margin-top:3px;line-height:1.35;}
  table.data td.num{text-align:right;}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important;} }
</style>
</head>
<body>
<div id="app"><div id="card">

  <!-- 1 · Header -->
  <div id="hdr">
    <div id="nav">
      <button class="navbtn" onclick="newProject()">New</button><span class="navsep">·</span>
      <button class="navbtn" onclick="openProject()">Open</button><span class="navsep">·</span>
      <button class="navbtn" onclick="saveProject()" title="Download this project as a file">Save</button><span class="navsep">·</span>
      <button class="navbtn" onclick="saveProjectAs()" title="Start a new project from this one">Save as</button><span class="navsep">·</span>
      <button class="navbtn" onclick="exportProject()" title="Download the settings, every step and the AI history as one JSON file">Export</button><span class="navsep">·</span>
      <button class="navbtn" onclick="showAiHistory()" title="Every interaction with the AI in this project">AI history</button><span class="navsep">·</span>
      <button class="navbtn" onclick="openSettings()">Settings</button><span class="navsep">·</span>
      <button class="navbtn" onclick="showAbout()">About</button>
      <button class="navbtn exit" onclick="exitApp()">Exit</button>
    </div>
    <div id="brand">
      <div><div class="title">Healthy Community Assessment System</div><div class="sub">Community health · spatial analysis</div></div>
      <div id="logo">H</div>
    </div>
  </div>

  <!-- 2 · Project bar -->
  <div id="pbar">
    <div class="grp"><span class="eyebrow">Project</span><span class="val" id="pb_title">No project</span></div>
    <span class="divider"></span>
    <div class="grp"><span class="eyebrow">Modified</span><span class="val mono" id="pb_mod">—</span></div>
    <span class="divider"></span>
    <div class="grp" style="flex:1;min-width:0;"><span class="eyebrow">Guidance</span>
      <span id="sysprompt" title="Click to edit — shapes how the assistant responds" onclick="openSettings()"></span></div>
  </div>

  <!-- body -->
  <div id="body">
    <!-- 3 · Pipeline rail -->
    <div id="rail">
      <div class="hd"><span class="eyebrow">Assessment steps</span></div>
      <div id="steps"></div>
    </div>

    <!-- 4 · Work canvas -->
    <div id="canvas"></div>

    <div id="dragbar" title="Drag to resize the assistant panel"></div>

    <!-- 5 · Assistant -->
    <div id="chat">
      <div class="chd"><span class="dot"></span><div><div class="t">Assistant</div><div class="s">Ask about any step</div></div></div>
      <div id="msgs"></div>
      <div id="chatform"><div id="chatbox">
        <input id="prompt" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')sendChat()">
        <button id="send" onclick="sendChat()" title="Send">↑</button>
      </div></div>
    </div>
  </div>

  <!-- 6 · Command bar -->
  <div id="cmd">
    <div id="msgline"></div>
    <button class="cbtn" id="prevbtn" onclick="prevStep()">← Back</button>
    <button class="cbtn run" id="runbtn" onclick="runStep()">Run step</button>
    <button class="cbtn next" id="nextbtn" onclick="confirmStep()">Confirm →</button>
  </div>

</div></div>

<div id="veil"><div class="modal" id="modal"></div></div>

<script>
const HDRS = { "X-Requested-With": "geoai", "Content-Type": "application/json" };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STEP_TITLES = ["Define project","Choose factors","Gather data","Set methodology",
  "Build database","Plan workflow","Run analysis","Write report"];
const PHASE = ["Preparation","Preparation","Preparation",
  "Methodology","Methodology","Analysis","Analysis","Report"];
const SUBTITLE = [
  "Set the task and study area for the assessment.",
  "Suggested factors and metrics — keep the ones that apply, then confirm.",
  "Data for each factor, gathered and previewed for inspection.",
  "The methodology, with the models and metrics to apply.",
  "The project's spatial database — extent, projection, and layers.",
  "A step-by-step workflow that carries out the chosen methodology.",
  "Runs the workflow to compute metrics and produce results.",
  "An editable report built from the inputs, data, and results."];
const RUN_HINTS = {
  1:"Locating the study-area county…",
  2:"Selecting factors and metrics — about a minute…",
  3:"Gathering map layers and county health outcomes…",
  4:"Preparing the methodology — about a minute…",
  5:"Assembling the spatial database…",
  6:"Building the workflow from the confirmed metrics…",
  7:"Gathering layers, computing metrics, building the map…",
  8:"Preparing the report…"};
/* Steps 3 and 7 are the only ones that query OpenStreetMap. They can be slow for
   reasons that have nothing to do with this run, so say so before the wait
   rather than after it. */
const FETCH_NOTE = "Can take a few minutes — public map servers get busy. "
  + "Anything already fetched is saved, so re-running only retries what failed.";
const FETCH_STEPS = new Set([3, 7]);
const DEFAULT_SYS = "Focus on spatial analysis for community-health assessment. Be concise and specific.";

const S = { pid:null, current:1, project:null, edited:null, draftShownAt:null,
            chats:{}, sys:DEFAULT_SYS, busy:false, redefining:false, running:null, pendingAi:[] };

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// "1 source", "2 sources" (QA 2026-09-29 saw "1 sources" on a badge).
const plural = (n, one, many) => `${(+n||0).toLocaleString()} ${(+n)===1 ? one : (many||one+"s")}`;

/* Map View helpers (Prof. Shi 2026-07-27: a base map from step 1). The locator
   map is FIPS-scoped so it works from step 1 onward; meta carries the FIPS. */
function basemapUrl(){
  const m = S.project?.meta;
  return m && m.state_fips && m.county_fips ? `/hcas/basemap/${m.state_fips}/${m.county_fips}` : "";
}
function baseMapFrame(which){
  // The project's own area (county, or the selected sub-areas), or its base area.
  const u = S.pid && S.project?.steps?.some(s=>s.step===1)
    ? `/hcas/projects/${S.pid}/basemap?which=${which==="base"?"base":"project"}`
    : basemapUrl();
  return u
    ? `<iframe class="mapframe" src="${u}" title="${which==="base"?"Base area":"Study area"} map"></iframe>`
    : `<div class="lab"><div class="eyebrow">Map view</div>
        <div class="mono" style="color:var(--faint);font-size:12px;margin-top:5px;">Run step 1 to locate the study area.</div></div>`;
}
/* Folium FeatureGroup names in render_assessment_map / render_base_map — the
   left-list visibility toggle drives these by clicking the matching overlay in
   the map's own layer control (same-origin iframe). */
const FOLIUM_LABEL = { buildings:"Buildings", greenspace:"Greenspace", roads:"Roads",
  parking:"Parking", sidewalks:"Sidewalks", transit_stops:"Transit Stops", facilities:"Facilities" };
/* Display names for map layers — mirrors LAYER_META in hcas.py (a test pins
   the two together). Raw ids ("from greenspace", "transit_stops") reached the
   step-6 workflow and the upload notice (QA 2026-09-29). */
const LAYER_NAMES = { buildings:"Building footprints", greenspace:"Parks & green space",
  roads:"Road network", parking:"Parking areas", sidewalks:"Sidewalks & paths",
  transit_stops:"Transit stops", facilities:"Community facilities", landuse:"Land use" };
function layerName(id){ return LAYER_NAMES[id] || String(id||"").replace(/_/g," "); }
// Plain names for the step-1 "Not available" list, which used to print the
// internal key ("acs not available…", QA 2026-09-29).
const UNAVAILABLE_NAMES = { acs:"Income, home value and age", area:"Area", population:"Population",
  profile:"Census profile", median_household_income_usd:"Median household income",
  median_home_value_usd:"Median home value", median_age:"Median age" };
const byStep = () => Object.fromEntries((S.project?.steps||[]).map(s=>[s.step,s]));
const stepRow = n => (S.project?.steps||[]).find(s=>s.step===n) || null;

async function api(path, opts={}){
  const r = await fetch(path,{headers:HDRS,...opts});
  const body = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(body.detail || (r.status+" "+r.statusText));
  return body;
}

/* ---- pipeline rail ---- */
/* Prof. Shi 2026-11-13 #2/#3: no jumping forward. A step is open only once every
   step before it is confirmed, and a confirmed step that has been changed on
   screen (and not yet re-confirmed) locks everything after it. */
function sortKeys(v){
  if(Array.isArray(v)) return v.map(sortKeys);
  if(v && typeof v==="object") return Object.keys(v).sort().reduce((o,k)=>(o[k]=sortKeys(v[k]),o),{});
  return v;
}
function stepDirty(n){
  const row = stepRow(n);
  if(!row || row.status!=="confirmed" || S.current!==n || S.running===n || S.busy) return false;
  try{
    if(n===1) return step1Form() && !!$("f_title") && step1Changed();
    if(S.edited==null) return false;
    return JSON.stringify(sortKeys(S.edited)) !== JSON.stringify(sortKeys(row.human_final ?? row.ai_draft));
  }catch(_){ return false; }
}
function reachable(n){
  if(!S.pid) return n===1;
  if(n===1 || n===S.current) return true;
  const bs = byStep();
  for(let k=1;k<n;k++){
    if(!bs[k] || bs[k].status!=="confirmed" || stepDirty(k)) return false;
  }
  return true;
}
function railClick(n){ if(reachable(n)) selectStep(n); }
let RAIL_SIG = "";
function railSig(){ return [1,2,3,4,5,6,7,8].map(n=>reachable(n)?1:0).join("")+S.current; }
setInterval(()=>{ const g=railSig(); if(g!==RAIL_SIG) renderRail(); }, 400);
function renderRail(){
  const bs = byStep();
  RAIL_SIG = railSig();
  $("steps").innerHTML = [1,2,3,4,5,6,7,8].map(n=>{
    const st = bs[n]?.status || "pending";
    const ok = reachable(n);
    // Prof. Shi 2026-11-13 #1: a finished step keeps its number; the check goes at the end of the name.
    const tick = st==="confirmed" ? `<span class="pcheck" title="Confirmed">✓</span>` : "";
    return `<div class="prow ${st} ${n===S.current?"active":""} ${!ok?"locked":""}" ${ok?"":'aria-disabled="true"'} onclick="railClick(${n})">
      <span class="pdot ${st}">${n}</span><span class="plabel">${STEP_TITLES[n-1]}${tick}</span></div>`;
  }).join("");
}

/* ---- project bar ---- */
function renderBar(){
  $("pb_title").textContent = S.project ? S.project.meta.title : "No project";
  const t = S.project ? new Date((S.project.meta.created_at||0)*1000) : null;
  $("pb_mod").textContent = t ? t.toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
  $("sysprompt").textContent = S.sys;
}

/* ---- selection / working copy ---- */
function selectStep(n){
  if(n<1||n>8) return;
  S.current = n;
  const row = stepRow(n);
  // A step that is mid-run has no row yet; keep its working copy null rather
  // than inheriting the previous step's, and let renderCanvas draw progress.
  S.edited = row ? JSON.parse(JSON.stringify(row.human_final ?? row.ai_draft)) : null;
  S.draftShownAt = row && row.status==="drafted" ? Date.now() : null;
  renderRail(); renderCanvas(); renderChat(); renderCmd();
}

/* Step 1 is always the definition form (Prof. Shi 2026-11-13 #10: no separate
   page that only shows the study area — confirming happens here). The only
   exception is while the step is running, when its progress is shown. */
function step1Form(){ return S.current===1 && S.running!==1; }

/* ---- command bar state ----
   Prof. Shi 2026-08-07: #8 Back works on step 1's result page (it re-opens the
   definition form); #9 Re-run is deactivated there, because re-running step 1
   only re-derives the same county — the useful action is Back. */
function renderCmd(){
  const row = stepRow(S.current);
  const confirmed = new Set((S.project?.steps||[]).filter(s=>s.status==="confirmed").map(s=>s.step));
  const prevOk = S.current===1 || confirmed.has(S.current-1);
  const form = step1Form();
  $("runbtn").disabled = S.busy || (!prevOk && !row);
  // Step 1: the work happens when Confirm is pressed, so it can always be pressed.
  $("nextbtn").disabled = S.busy || (!row && !form);
  $("prevbtn").disabled = S.busy || S.current===1;
  $("nextbtn").textContent = S.current===8 ? "Save report" : "Confirm →";
  $("runbtn").textContent = row ? "Re-run" : "Run step";
  $("prevbtn").textContent = "← Back";
  $("runbtn").title = "";
  // Step 1's "Run step" now lives on its map as "Update map"; step 2's "Re-run"
  // lives under its Notes box (Prof. Shi 2026-11-13 #9, #13).
  const hideRun = form || (S.current===2 && !!row && S.running!==2);
  $("runbtn").style.display = hideRun ? "none" : "";
  const rr = $("f_rerun"); if(rr) rr.disabled = S.busy;
}

/* ================= CANVAS ================= */
function canvasHead(n){
  const defining = n===1 && S.running!==1;
  return `<div class="chead">
    <div class="chd"><h2>${esc(STEP_TITLES[n-1])}</h2>${stepTag(n)}</div>
    <div class="csub">${esc(SUBTITLE[n-1])}</div>
    ${defining ? "" : compareToggle()}
    ${!defining && compareOn() && SHARED_STEP_NOTE[n] ? `<div class="subnote" style="margin-top:4px;">${esc(SHARED_STEP_NOTE[n])}</div>` : ""}</div>`;
}
function loadingBody(n){
  return `<div class="loading"><div class="spin-lg"></div>
       <div class="pbar"><div class="fill" id="pfill"></div></div>
       <div class="ppct" id="ppct">0%</div>
       <div class="lmsg" id="plabel">${esc(RUN_HINTS[n]||"Working…")}</div>
       ${FETCH_STEPS.has(n) ? `<div class="lnote">${esc(FETCH_NOTE)}</div>` : ""}
       <div class="pchecklist" id="pdetail"></div></div>`;
}
/* `n` is the step being RUN, which is not necessarily the one on screen: the
   caller awaits before painting, and the user can click another step in that
   gap. Passing it explicitly keeps the loading body from being drawn under a
   heading it does not belong to. */
function renderCanvasLoading(n){
  n = n || S.current;
  $("canvas").innerHTML = canvasHead(n) + loadingBody(n);
}
/* Live per-layer checklist (Prof. Shi 2026-07-27: show what is being fetched
   from where, rather than a bar that sits still then jumps). */
function renderChecklist(detail){
  const box = $("pdetail"); if(!box || !Array.isArray(detail)) return;
  box.innerHTML = detail.map(d=>{
    const mark = d.status==="done" ? '<span class="ck-ok">✓</span>'
      : d.status==="error" ? '<span class="ck-err">⚠</span>'
      : '<span class="ck-run"></span>';
    const meta = d.status==="done" && d.count!=null ? plural(d.count, "feature")
      : d.status==="error" ? esc(d.note||"unavailable")
      : esc(d.source||"fetching…");
    return `<div class="ck-row ${esc(d.status||"")}">${mark}
      <span class="ck-name">${esc(d.name||d.layer||"")}</span>
      <span class="ck-meta">${meta}</span></div>`;
  }).join("");
}

/* Live progress while a step runs. Steps 3 & 7 report real per-layer numbers
   from the backend; the LLM steps (2 & 4) can't, so a time-based estimate
   keeps the bar honest-ish and moving. Capped at 97% until the run returns. */
let PROG = null, CLOCK = null;
const STEP_ETA = {1:6, 2:60, 3:180, 4:60, 5:3, 6:3, 7:240, 8:4};  // seconds, typical
function mmss(s){ return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); }
function startProgress(step, elapsed0){
  stopProgress();
  step = step || S.current;   // the step being run — see renderCanvasLoading
  // `elapsed0` is how long the SERVER says this run has been going. Re-attaching
  // after a reload used to restart the clock at 0:00 on a run minutes old.
  let t0 = Date.now() - (+elapsed0||0)*1000;
  let pct = 0;

  // The clock ticks on its own timer and never awaits anything. It used to be
  // written at the END of the poll callback, after `await api(...)`, so the
  // displayed time advanced only when a poll came back: it froze while a poll
  // was slow and then jumped by however long that poll took. Worse, setInterval
  // does not wait for an async callback, so polls stacked — and an earlier one
  // resolving late would repaint an OLDER elapsed value, stepping the clock
  // backwards. Both are invisible against localhost and obvious over the
  // internet, which is how the hosted deploy surfaced it (2026-08-12).
  const paint = ()=>{
    const el = $("ppct");
    if(el) el.textContent = Math.round(pct)+"%  ·  "+mmss((Date.now()-t0)/1000)+" elapsed";
  };
  paint();
  CLOCK = setInterval(paint, 250);

  let inFlight = false;
  PROG = setInterval(async ()=>{
    if(inFlight) return;   // one poll at a time; a slow one must not queue more
    inFlight = true;
    let b = {pct:0, label:""};
    try{ b = await api(`/hcas/projects/${S.pid}/steps/${step}/progress`); }
    catch(_){}
    finally{ inFlight = false; }
    // The server's start time wins when it is further back than ours (a run we
    // re-attached to). Never pull the clock forward: that would step it back.
    if(b.elapsed_s != null && b.elapsed_s*1000 > Date.now()-t0 + 1500) t0 = Date.now() - b.elapsed_s*1000;
    const secs = (Date.now()-t0)/1000;
    // Steps 3 and 7 report REAL per-layer progress; steps 2 and 4 are one
    // blocking model call and can report none, which is what the time estimate
    // is for. Blending the two let the estimate overtake the truth: measured
    // 2026-08-09 on a slow Overpass, the bar sat at 90% while the backend had
    // finished 1 of 6 layers — contradicting the checklist directly beneath it.
    // Where there is a real number, use it alone.
    const measured = Array.isArray(b.detail) && b.detail.length > 0;
    const est = Math.min(90, secs / (STEP_ETA[step]||10) * 90);
    pct = Math.min(97, measured ? (b.pct||0) : Math.max(b.pct||0, est));
    // Elapsed time next to the percentage: a big county's OpenStreetMap query
    // legitimately takes minutes, and a bar alone cannot tell "working" from
    // "stuck" (Prof. Shi 2026-08-07). The step also stops itself — see
    // HCAS_LAYER_BUDGET_S — so this clock always ends.
    paint();
    const f = $("pfill");
    if(!f) return;
    f.style.width = pct+"%";
    if(b.label) $("plabel").textContent = b.label;
    if(b.detail) renderChecklist(b.detail);
  }, 700);
}
function stopProgress(){
  if(PROG){ clearInterval(PROG); PROG = null; }
  if(CLOCK){ clearInterval(CLOCK); CLOCK = null; }
}
function renderCanvas(){
  const n = S.current, row = stepRow(n), a = S.edited;
  const head = canvasHead(n);
  let body;
  const defining = n===1 && S.running!==1;
  if(defining) body = defineForm();
  // Coming back to a step that is still running shows its progress again. This
  // covers a re-run too, where an artifact row already exists — you pressed Run,
  // so you should see the run, not the previous result.
  else if(S.running === n) body = loadingBody(n);
  else if(!row){
    body = `<div class="empty"><div class="big">Nothing here yet</div>
      <div>Run this step to generate it.</div></div>`;
    // Uploading before the first run means this step never fetches the layers
    // you've supplied yourself — not just a faster re-run.
    if(n===3 && S.pid) body += dataUploadPanel();
  }
  else body = ({1:viewIntake,2:viewFactors,3:viewData,4:viewSolution,5:viewDatabase,
                6:viewWorkflow,7:viewExecution,8:viewReport}[n] || viewRaw)(a);
  // A stale artifact was drafted from an earlier version of an upstream step.
  // The confirm flow re-drafts it automatically, but you can also reach one by
  // clicking the rail — and on screen it is indistinguishable from a current
  // result. Say so, and offer the re-run rather than doing it behind your back
  // (any edit you made to this step is still here until you press it).
  if(row && row.status==="stale" && !defining && S.running!==n)
    body = `<div class="warnbar" style="background:var(--amber-tint);color:var(--amber)">⚠<div>
      <b>Out of date.</b> This was prepared before an earlier step changed, so it does not
      reflect the current study area. Re-run this step to bring it up to date.</div></div>` + body;
  $("canvas").innerHTML = head + body;
  if(defining) loadStates();
  if(n===2 && row) wireFactors();
  if(n===7 && row) wireMapCheck();
  if(n===8 && row) wireReport();
  if(!REDUCED && $("canvas").animate)
    $("canvas").animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],
      {duration:240,easing:"cubic-bezier(.22,.68,.24,1)"});
}
function stepTag(n){
  const row = stepRow(n);
  if(n===2) return `<span class="tag">Suggested · review to continue</span>`;
  if(n===4){
    // This badge used to key off the step NUMBER alone, so a run that had
    // degraded to the built-in theory list still announced "Knowledge base" —
    // the one thing on screen asserting something untrue. Grounding is provable
    // from the payload: `knowledgebase` is attached only when the corpus
    // actually answered, and is absent entirely otherwise.
    if(!row) return `<span class="tag rag">Knowledge base</span>`;
    const kb = (row.human_final||row.ai_draft||{}).knowledgebase;
    const n_src = kb && (kb.source_documents||[]).length;
    return kb ? `<span class="tag rag">Knowledge base · ${plural(n_src, "source")}</span>`
              : `<span class="tag muted">Built-in theory list</span>`;
  }
  if(n===6) return `<span class="tag muted">Derived from metrics</span>`;
  if(n===7 && row) return `<span class="tag done">Complete</span>`;
  if(n===8) return `<span class="tag muted">Editable draft</span>`;
  return "";
}

/* step 1 — create form.
   Prof. Shi 2026-08-07: #4 a free-text location box resolved by AI, #5 a real
   areal-unit choice, #6 no Mode option (confirmation is always on), #7 no
   coordinate-system box (the system determines it).

   Prof. Shi and Prof. Wang 2026-09-16:
   #1 the area can be smaller than a county — a town, ZIP code, tracts, block
      groups, or a "Customized" community built from block groups the AI
      recommends and the analyst adds to or removes from on the map;
   #3 an optional base area, defined in a second, similar panel beside the
      first, that every later step is also run for. */
const AREA = { project: null, base: null, compare: false };
let STATES = [];

function newAreaState(src){
  src = src || {};
  const geoids = (src.area_geoids||[]).slice();
  // "Customized" is retired (#15): a saved project that used it opens as block groups.
  const unit = src.areal_unit==="custom" ? "block_group" : (src.areal_unit||"");
  return { state_fips: src.state_fips||"", county_fips: src.county_fips||"",
           unit, geoids, name: src.area_name||"", suggestNote: "",
           polygon: src.area_polygon ? {type:"Feature", properties:{name:src.area_polygon_name||""}, geometry:src.area_polygon} : null,
           outline: null,
           mode: geoids.length ? "selected" : "all",
           features:null, featuresKey:"", map:null, layer:null, loading:null,
           suggestedText:null, suggesting:false, aiFailed:false };
}

function defineForm(){
  return `<div class="panel form wideform">
    <div class="row">
      <div class="fld"><label>Project title</label><input id="f_title" placeholder="e.g. Riverside County · Health Equity 2026"></div>
    </div>
    <div class="fld" style="margin-bottom:var(--sp-4);"><label>Project task</label>
      <textarea id="f_tasks" placeholder="e.g. calculate a neighborhood health index; identify priority areas…"></textarea>
    </div>
    <div class="defgrid" id="f_defgrid">
      <div class="areapanel" id="ap_project">${areaEditorHtml("project")}</div>
      <div class="areapanel base" id="ap_base" style="display:none">${areaEditorHtml("base")}</div>
    </div>
  </div>`;
}

function areaEditorHtml(w){
  // Prof. Shi 2026-11-13: the "describe the location" box sits at the top of the
  // project-area panel, and "compare with a base area" at its bottom.
  const where = w==="base" ? "" : `<div class="fld" style="margin-bottom:var(--sp-3);">
      <label>Describe the location (optional)</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input id="f_where" style="flex:1;min-width:240px;"
               placeholder="e.g. 03755 · Hanover, NH · the Short North in Columbus · around Dartmouth-Hitchcock"
               onkeydown="if(event.key==='Enter'){event.preventDefault();resolveArea();}">
        <button class="cbtn" id="f_findbtn" onclick="resolveArea()">Find with AI</button>
      </div>
      <div class="hint" id="f_wherehint">A ZIP code, town, community, landmark or description — the assistant
        finds the county and, for a ZIP code, town or neighborhood, sets up that area below. You can change everything it fills in.</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;">
        <button class="cbtn" id="f_uploadbtn" onclick="$('f_uploadfile').click()">Upload study area</button>
        <input type="file" id="f_uploadfile" accept=".zip,.geojson,.json" style="display:none" onchange="uploadArea(this)">
        <button class="linkbtn" id="f_uploadclear" style="display:none" onclick="clearUploadedArea()">remove uploaded outline</button>
      </div>
      <div class="hint" id="f_uploadmsg">Your own boundary: a zipped shapefile (.zip with the .shp, .shx, .dbf and .prj files) or a
        GeoJSON file, up to 20 MB. It is drawn as a dashed outline and the block groups mostly inside it are selected.</div>
    </div>`;
  const updateBtn = w==="base" ? "" : `<button class="cbtn run" id="f_updatemap" onclick="updateMap()"
        title="Redraw the map from the settings above">Update map</button>`;
  const compare = w==="base" ? "" : `<label class="chkline" style="margin-top:var(--sp-3);"><input type="checkbox" id="f_compare" onchange="toggleCompare(this.checked)">
      Compare with a base area</label>
    <div class="hint" style="margin:0 0 0 25px;">A larger area for context (such as the whole county) or a similar
      community to compare with. Every later step is then also run for the base area and shown side by side.</div>`;
  return `<div class="ph">${w==="base" ? "Base area" : "Project area"}</div>
    ${where}
    <div class="row">
      <div class="fld"><label>State</label><select id="${w}_state"></select></div>
      <div class="fld"><label>County</label><select id="${w}_county"></select></div>
    </div>
    <div class="fld"><label>Reporting unit</label><select id="${w}_unit"></select>
      <div class="hint">The building block of your project area. Results are reported for each one.</div></div>
    <div id="${w}_scope" style="margin-top:8px;"></div>
    <div class="maprow"><div class="maphint" id="${w}_maphint"></div>${updateBtn}</div>
    <div class="areamap" id="${w}_map">Select a county to see it on the map.</div>
    <div class="areasum" id="${w}_sum"></div>
    ${compare}`;
}

/* "Update map" (Prof. Shi 2026-11-13 #9): the old step-1 Run step button, now on the
   map. To the analyst it only redraws the map from the current settings; the
   project is created and its facts worked out quietly when they press Confirm. */
async function updateMap(){
  const ws = AREA.compare ? ["project","base"] : ["project"];
  for(const w of ws){ await refreshArea(w); }
}

function toggleCompare(on){
  AREA.compare = !!on;
  const grid=$("f_defgrid"), bp=$("ap_base"), cb=$("f_compare");
  if(cb) cb.checked = AREA.compare;
  if(grid) grid.classList.toggle("compare", AREA.compare);
  if(bp) bp.style.display = AREA.compare ? "" : "none";
  if(AREA.compare && !AREA.base.state_fips){
    // Start the base area where the project is: the county around it is the
    // most common "larger area for context".
    const p = AREA.project;
    AREA.base = newAreaState({state_fips:p.state_fips, county_fips:p.county_fips, areal_unit:"county"});
    fillAreaSelects("base");
  }
  // Both maps changed size.
  setTimeout(()=>["project","base"].forEach(w=>{ const a=AREA[w]; if(a&&a.map) a.map.invalidateSize(); }), 60);
}

let LEAFLET = null;
function ensureLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(LEAFLET) return LEAFLET;
  LEAFLET = new Promise((res, rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js";
    s.onload=()=>res(window.L); s.onerror=()=>{ LEAFLET=null; rej(new Error("map library blocked")); };
    document.head.appendChild(s);
  });
  return LEAFLET;
}

function unitWord(unit, plural){
  const w = {county_subdivision:["town or township","towns and townships"], zcta:["ZIP code area","ZIP code areas"],
    tract:["census tract","census tracts"], block_group:["block group","block groups"],
    custom:["block group","block groups"], county:["county","counties"]}[unit] || [unit, unit];
  return plural ? w[1] : w[0];
}

async function loadStates(){
  try{
    if(!STATES.length) STATES = (await api("/states")).states;
    if(!AREAL_UNITS.length) await loadUnits();
    // Read the project only after the awaits: opening a project while the first
    // draw of the form is still loading used to build the form from the project
    // that was current BEFORE the open (#4a: blank title, default county).
    const m = S.project?.meta;           // re-defining an existing project
    if(!$("f_title")) return;            // the form is no longer on screen
    if(S.pid && !m) return;              // project still loading: refresh() will redraw the form
    if(S.pid && m && m.project_id && m.project_id !== S.pid) return;
    // The form is re-drawn whenever the canvas is (a failed run, a click on the
    // rail). Keep what the analyst has chosen so far instead of resetting it.
    const key = S.pid || "new";
    if(AREA.key !== key || !AREA.project){
      AREA.key = key;
      AREA.project = newAreaState(m ? m : {state_fips:"39", county_fips:"", areal_unit:"county"});
      AREA.base = newAreaState(m?.base || {});
      AREA.compare = !!m?.base;
      AREA.fields = {title:m?.title||"", notes:m?.notes||"", where:m?.location_query||"", ai_note:m?.ai_note||""};
      restoreAiNote();
    }else{
      for(const w of ["project","base"]){ const a=AREA[w]; if(a){ a.map=null; a.layer=null; } }
    }
    const f = AREA.fields || {};
    $("f_title").value = f.title||""; $("f_tasks").value = f.notes||""; $("f_where").value = f.where||"";
    if(f.ai_note && !$("f_wherehint").dataset.restored){ $("f_wherehint").dataset.restored="1"; $("f_wherehint").textContent = f.ai_note.split("\n")[0]; }
    $("f_title").oninput = e=>{ AREA.fields.title = e.target.value; };
    $("f_tasks").oninput = e=>{ AREA.fields.notes = e.target.value; };
    $("f_where").oninput = e=>{ AREA.fields.where = e.target.value; };
    await fillAreaSelects("project");
    if(AREA.compare){ await fillAreaSelects("base"); }
    toggleCompare(AREA.compare);
    restoreUploadMsg();
  }catch(e){ setMsg(e.message); }
}

async function fillAreaSelects(w){
  const a = AREA[w]; if(!a) return;
  const st=$(`${w}_state`), co=$(`${w}_county`), un=$(`${w}_unit`);
  if(!st||!co||!un) return;
  // Opening a project draws the form twice in a row (refresh, then selectStep).
  // Two overlapping fills used to overwrite each other's county with the first
  // one in the list (#4a: the area came back as the wrong county). Only the
  // latest fill may touch the selects or the saved values.
  const seq = a.fillSeq = (a.fillSeq||0) + 1;
  st.innerHTML = STATES.map(s=>`<option value="${s.state_fips}">${esc(s.state_name)}</option>`).join("");
  st.value = a.state_fips || "39"; a.state_fips = st.value;
  await loadCountiesFor(w);
  if(a.fillSeq !== seq || $(`${w}_county`) !== co) return;
  if(a.county_fips) co.value = a.county_fips;
  a.county_fips = co.value;
  un.innerHTML = AREAL_UNITS.map(u=>`<option value="${esc(u.id)}">${esc(u.label)}</option>`).join("");
  un.value = a.unit || "county"; a.unit = un.value;
  st.onchange = async ()=>{ a.state_fips=st.value; await loadCountiesFor(w); a.county_fips=co.value;
                            a.geoids=[]; a.suggestedText=null; a.aiFailed=false; a.mode="all"; refreshArea(w); };
  co.onchange = ()=>{ a.county_fips=co.value; a.geoids=[]; a.suggestedText=null; a.aiFailed=false; a.mode="all"; refreshArea(w); };
  un.onchange = ()=>{ a.unit=un.value; a.geoids=[]; a.suggestedText=null; a.aiFailed=false; a.mode="all"; refreshArea(w); };
  refreshArea(w);
}

async function loadCountiesFor(w){
  const sel = $(`${w}_county`);          // the element this call was made for
  const {counties} = await api(`/counties/${$(`${w}_state`).value}`);
  if(sel) sel.innerHTML = counties.map(c=>`<option value="${c.county_fips}">${esc(c.county_name)}</option>`).join("");
}

/* Re-draw one area's controls, map and summary after anything about it changed. */
async function refreshArea(w){
  renderScope(w);
  renderAreaSum(w);
  const a = AREA[w];
  if(!a.state_fips || !a.county_fips) return;
  const key = `${a.state_fips}/${a.county_fips}/${a.unit}`;
  if(a.featuresKey === key && !a.features && a.loading){
    // Already being fetched by an earlier call — wait for it rather than
    // drawing (or matching a ZIP code or town against) nothing.
    try{ await a.loading; }catch(_){}
  }
  if(a.featuresKey !== key){
    a.features = null; a.featuresKey = key;
    const box = $(`${w}_map`);
    if(box && !a.map) box.innerHTML = `<span class="spin"></span>Loading ${esc(unitWord(a.unit, true))}…`;
    try{
      a.loading = api(`/hcas/units/${key}`);
      const fc = await a.loading;
      if(a.featuresKey !== key) return;                // the user moved on meanwhile
      a.features = fc;
    }catch(e){
      if(a.featuresKey !== key) return;
      a.features = null;
      if(box){ if(a.map){ a.map.remove(); a.map=null; }
        box.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
      return;
    }
    renderScope(w); renderAreaSum(w);
  }
  drawAreaMap(w);
}

function featureIndex(a){
  const idx = {};
  (a.features?.features||[]).forEach(f=>{ idx[f.properties.GEOID] = f.properties; });
  return idx;
}

/* The suggestion button is live only when there is something new to ask: the
   AI has not yet suggested for this exact text (Prof. Shi 2026-11-13 #11). */
function suggestIsStale(a){
  return !a.suggestedText || a.suggestedText !== (a.name||"").trim();
}
function updateSuggestBtn(w){
  const a = AREA[w], b = $(`${w}_suggestbtn`); if(!a || !b) return;
  b.disabled = !!a.suggesting || !suggestIsStale(a);
  b.textContent = a.suggesting ? "Suggesting…" : SUGGEST_LABEL;
}
const SUGGEST_LABEL = "Generate/Update AI's suggestion";

function renderScope(w){
  const a = AREA[w], box = $(`${w}_scope`); if(!box) return;
  const one = unitWord(a.unit), many = unitWord(a.unit, true);
  const mh = $(`${w}_maphint`);
  if(mh) mh.textContent = a.unit === "county" ? ""
    : `Click to add or remove a ${one} to modify the ${w==="base"?"base":"project"} area`;
  if(a.unit === "county"){
    box.innerHTML = (a.aiFailed ? `<div class="aifail">AI could not define the specified area. Please manually define it on the map.</div>` : "")
      + `<div class="hint">The whole county is the ${w==="base"?"base":"project"} area.</div>`;
    return;
  }
  const idx = featureIndex(a);
  const chips = a.geoids.length ? `<div class="chips">${a.geoids.map(g=>
      `<span class="chip">${esc(idx[g]?.name || g)}<button title="Remove" onclick="toggleUnit('${w}','${esc(g)}')">×</button></span>`).join("")}</div>` : "";
  // A neighbourhood is described in words and the AI picks its block groups (#15,
  // formerly the "Customized" unit): block groups are the building block.
  const nb = a.unit === "block_group" ? `<div class="fld" style="margin-bottom:10px;">
        <label>Neighborhood or community (optional)</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input id="${w}_name" style="flex:1;min-width:180px;" value="${esc(a.name)}"
                 placeholder="e.g. Short North · German Village · Hanover downtown"
                 oninput="AREA['${w}'].name=this.value;updateSuggestBtn('${w}')"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();suggestBlockGroups('${w}');}">
          <button class="cbtn" id="${w}_suggestbtn" onclick="suggestBlockGroups('${w}')" ${a.suggesting||!suggestIsStale(a)?"disabled":""}>${a.suggesting?"Suggesting…":SUGGEST_LABEL}</button>
        </div>
        <div class="hint" id="${w}_suggesthint">${a.suggestNote || "The AI recommends the block groups that make up the neighborhood. Click block groups on the map to add or remove them."}</div></div>` : "";
  const opts = (a.features?.features||[]).map(f=>f.properties)
    .filter(p=>!a.geoids.includes(p.GEOID))
    .sort((x,y)=>String(x.name).localeCompare(String(y.name), undefined, {numeric:true}))
    .map(p=>`<option value="${esc(p.GEOID)}">${esc(p.name)}</option>`).join("");
  box.innerHTML = nb + (a.aiFailed ? `<div class="aifail">AI could not define the specified area. Please manually define it on the map.</div>` : "") + `
    <label class="radioline"><input type="radio" name="${w}_mode" ${a.mode==="all"?"checked":""}
        onchange="setMode('${w}','all')">
      <span>Whole county — results broken down by each ${esc(one)}</span></label>
    <label class="radioline"><input type="radio" name="${w}_mode" ${a.mode==="selected"?"checked":""}
        onchange="setMode('${w}','selected')">
      <span>Only the ${esc(many)} I choose</span></label>
    ${a.mode==="selected" ? `<div style="margin:6px 0 0 24px;">
        <select id="${w}_add" onchange="if(this.value){toggleUnit('${w}',this.value);}" style="max-width:100%;">
          <option value="">${a.features ? `Add a ${esc(one)}…` : "Loading…"}</option>${opts}</select>
        <div class="hint">Or click them on the map.</div>${chips}</div>` : ""}`;
}

function setMode(w, mode){
  const a = AREA[w]; a.mode = mode;
  if(mode === "all") a.geoids = [];
  renderScope(w); renderAreaSum(w); styleAreaMap(w);
}
function clearUnits(w){ AREA[w].geoids = []; renderScope(w); renderAreaSum(w); styleAreaMap(w); }
function toggleUnit(w, geoid){
  const a = AREA[w];
  if(a.unit === "county") return;
  if(a.mode !== "selected") a.mode = "selected";
  const i = a.geoids.indexOf(geoid);
  if(i >= 0) a.geoids.splice(i, 1); else a.geoids.push(geoid);
  renderScope(w); renderAreaSum(w); styleAreaMap(w);
}

function renderAreaSum(w){
  const a = AREA[w], box = $(`${w}_sum`); if(!box) return;
  if(!a.features){ box.innerHTML = ""; return; }
  if(a.unit === "county" || a.mode === "all"){
    const n = (a.features.features||[]).length;
    box.innerHTML = a.unit === "county" ? `Whole county`
      : `Whole county <span class="muted">· ${n.toLocaleString()} ${esc(unitWord(a.unit, n!==1))} in the breakdown</span>`;
    return;
  }
  const idx = featureIndex(a);
  const sel = a.geoids.map(g=>idx[g]).filter(Boolean);
  if(!sel.length){
    box.innerHTML = `<span class="muted">No ${esc(unitWord(a.unit, true))} selected yet.</span>`;
    return;
  }
  const km2 = sel.reduce((t,p)=>t+(+p.area_km2||0), 0);
  const pops = sel.map(p=>p.population);
  const pop = pops.every(v=>v!=null) ? pops.reduce((t,v)=>t+v,0) : null;
  box.innerHTML = `${sel.length} ${esc(unitWord(a.unit, sel.length!==1))} · ${km2.toLocaleString(undefined,{maximumFractionDigits:2})} km²`
    + (pop!=null ? ` · ${pop.toLocaleString()} people <span class="muted">(2020 Census)</span>` : "");
}

async function drawAreaMap(w){
  const a = AREA[w], box = $(`${w}_map`);
  if(!box || !a.features) return;
  let L;
  try{ L = await ensureLeaflet(); }
  catch(_){
    box.innerHTML = `<span>The map library could not load (cdn.jsdelivr.net blocked) — choose areas from the list instead.</span>`;
    return;
  }
  if(!a.map || a.map.getContainer() !== box){
    box.innerHTML = ""; box.style.display = "block";
    a.map = L.map(box, {zoomControl:true, attributionControl:true});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:19, attribution:"© OpenStreetMap contributors"}).addTo(a.map);
  }
  if(a.layer){ a.layer.remove(); a.layer = null; }
  const selectable = a.unit !== "county";
  a.layer = L.geoJSON(a.features, {
    style: f=>unitStyle(a, f.properties.GEOID),
    onEachFeature: (f, lyr)=>{
      const p = f.properties;
      lyr.bindTooltip(`${esc(p.name)}${p.population!=null?` · ${(+p.population).toLocaleString()} people`:""}`, {sticky:true});
      if(selectable){
        lyr.on("click", ()=>toggleUnit(w, p.GEOID));
        lyr.on("mouseover", ()=>lyr.setStyle({weight:2.5}));
        lyr.on("mouseout", ()=>lyr.setStyle(unitStyle(a, p.GEOID)));
      }
    },
  }).addTo(a.map);
  // Zoom to the selected area when there is one (coming back to a step shows the
  // confirmed area, not the whole county around it).
  if(a.outline){ a.outline.remove(); a.outline = null; }
  if(a.polygon){
    a.outline = L.geoJSON(a.polygon, {style:{color:"#b45309", weight:3, dashArray:"8 6", fill:false},
      interactive:false}).addTo(a.map);
  }
  let fitTo = a.layer;
  if(a.outline){ fitTo = a.outline; }
  else if(a.geoids.length){
    const sel = []; a.layer.eachLayer(l=>{ if(a.geoids.includes(l.feature.properties.GEOID)) sel.push(l); });
    if(sel.length) fitTo = L.featureGroup(sel);
  }
  try{ a.map.fitBounds(fitTo.getBounds(), {padding:[8,8], maxZoom:16}); }catch(_){}
  setTimeout(()=>a.map && a.map.invalidateSize(), 50);
}
function unitStyle(a, geoid){
  if(a.unit === "county")
    return {color:"#0f766e", weight:2, fillColor:"#0d9488", fillOpacity:0.08};
  const on = a.geoids.includes(geoid);
  const whole = a.mode === "all";
  return on ? {color:"#0f766e", weight:1.6, fillColor:"#0d9488", fillOpacity:0.45}
    : {color: whole ? "#0f766e" : "#64748b", weight: whole ? 0.8 : 0.6,
       fillColor:"#0d9488", fillOpacity: whole ? 0.10 : 0.02};
}
function styleAreaMap(w){
  const a = AREA[w]; if(!a.layer) return;
  a.layer.eachLayer(l=>l.setStyle(unitStyle(a, l.feature.properties.GEOID)));
}

async function suggestBlockGroups(w, textOverride, asPlace){
  const a = AREA[w];
  const text = (textOverride || $(`${w}_name`)?.value || a.name || "").trim();
  const hint = $(`${w}_suggesthint`), btn = $(`${w}_suggestbtn`);
  if(!text){ if(hint) hint.textContent = "Type the neighborhood or community name first."; return; }
  a.name = text;
  a.suggesting = true; updateSuggestBtn(w);
  if(hint) hint.innerHTML = '<span class="spin"></span>Asking the AI which block groups make up this community…';
  try{
    // A city or town has a Census boundary of its own: select the block groups inside it.
    const r = asPlace
      ? await api("/hcas/place-area", {method:"POST",
          body: JSON.stringify({name:text, state_fips:a.state_fips, county_fips:a.county_fips, project_id:S.pid})})
      : await api("/hcas/suggest-area", {method:"POST",
          body: JSON.stringify({text, state_fips:a.state_fips, county_fips:a.county_fips, project_id:S.pid})});
    relayAi(r);
    a.mode = "selected";
    a.geoids = r.geoids || [];
    if(r.place && (!textOverride || asPlace)) a.name = r.place;
    a.suggestedText = (r.geoids||[]).length ? (a.name||"").trim() : null;
    a.suggesting = false;
    renderScope(w); renderAreaSum(w); styleAreaMap(w);
    const h = $(`${w}_suggesthint`);
    a.suggestNote = r.geoids?.length
      ? `<b>${r.geoids.length} block group${r.geoids.length===1?"":"s"} suggested</b> — ${esc(r.method_text||"")}.`
        + (r.caveat ? ` <span style="color:var(--amber)">${esc(r.caveat)}</span>` : "")
        + `<br>Click block groups on the map to add or remove them.`
      : `<span style="color:var(--red)">${esc(r.caveat || "No block groups could be suggested.")}</span>`;
    if(h) h.innerHTML = a.suggestNote;
    if(w==="project") captureAiNote();
    if(a.layer && r.geoids?.length){
      const sel = []; a.layer.eachLayer(l=>{ if(a.geoids.includes(l.feature.properties.GEOID)) sel.push(l); });
      if(sel.length) try{ a.map.fitBounds(L.featureGroup(sel).getBounds(), {padding:[30,30], maxZoom:15}); }catch(_){}
    }
  }catch(e){
    const h = $(`${w}_suggesthint`);
    if(h) h.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`;
  }finally{
    a.suggesting = false; updateSuggestBtn(w);
  }
}

/* Upload study area (Prof. Shi 2026-11-13 #12). The server reads the zipped shapefile
   or GeoJSON, reprojects it, finds the county and the units mostly inside it. */
function setUploadMsg(html, bad){
  const m = $("f_uploadmsg"); if(!m) return;
  m.innerHTML = html; m.style.color = bad ? "var(--red)" : "";
  const c = $("f_uploadclear"); if(c) c.style.display = AREA.project?.polygon ? "" : "none";
}
async function uploadArea(inp){
  const file = inp.files && inp.files[0]; inp.value = "";
  if(!file) return;
  const a = AREA.project;
  if(file.size > 20*1024*1024){
    setUploadMsg(`<b>${esc(file.name)}</b> is ${(file.size/1048576).toFixed(0)} MB; the limit is 20 MB. Simplify the polygon or upload a smaller extract.`, true);
    return;
  }
  const btn = $("f_uploadbtn"); btn.disabled = true;
  setUploadMsg('<span class="spin"></span>Reading '+esc(file.name)+'…');
  try{
    const unit = (a.unit && a.unit !== "county") ? a.unit : "block_group";
    const resp = await fetch(`/hcas/upload-area?filename=${encodeURIComponent(file.name)}&unit=${unit}`,
      {method:"POST", headers:{"X-Requested-With":"geoai","Content-Type":"application/octet-stream"}, body:file});
    const r = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(r.detail || (resp.status+" "+resp.statusText));
    a.polygon = r.polygon; a.state_fips = r.state_fips; a.county_fips = r.county_fips;
    a.unit = r.unit; a.geoids = (r.geoids||[]).slice(); a.mode = "selected";
    a.featuresKey = ""; a.aiFailed = false; a.suggestNote = ""; a.name = "";
    await fillAreaSelects("project");
    await refreshArea("project");
    const n = a.geoids.length;
    setUploadMsg(`<b>${esc(file.name)}</b> — ${esc(r.county_name)}, ${esc(r.state_name)} · ${num(r.area_km2,1)} km². `
      + (n ? `${n} ${esc(unitWord(a.unit, n!==1))} with more than half of their area inside the outline selected. Click units on the map to add or remove them.` : "")
      + (r.notes||[]).map(t=>" "+esc(t)).join("")
      + (r.caveat ? ` <span style="color:var(--amber)">${esc(r.caveat)}</span>` : ""));
  }catch(e){
    setUploadMsg(esc(e.message), true);
  }finally{ btn.disabled = false; }
}
function clearUploadedArea(){
  const a = AREA.project; if(!a) return;
  a.polygon = null;
  if(a.outline){ a.outline.remove(); a.outline = null; }
  setUploadMsg("The uploaded outline was removed. The selected units stay as they are.");
}
function restoreUploadMsg(){
  const a = AREA.project; if(!a || !a.polygon) return;
  setUploadMsg(`Uploaded outline: <b>${esc(a.polygon.properties?.name || "study area")}</b> — shown as the dashed outline on the map.`);
}

/* Free-text location -> county, and for a ZIP code, town or community the
   matching kind of area (Prof. Shi 2026-08-07 #4, 2026-09-16 #1). Everything
   it fills in stays visible and editable in the project-area panel. */
async function resolveArea(){
  const box=$("f_where"), hint=$("f_wherehint"), btn=$("f_findbtn");
  const text=(box?.value||"").trim();
  if(!text){ hint.textContent="Type a place first — ZIP code, town, community, landmark…"; return; }
  btn.disabled=true; btn.textContent="Finding…";
  hint.innerHTML='<span class="spin"></span>Asking the assistant…';
  try{
    const r=await api("/hcas/resolve-area",{method:"POST",body:JSON.stringify({text, project_id:S.pid})});
    relayAi(r);
    if(r.resolved){
      const wb=document.getElementById('f_where'); if(wb) wb.style.borderColor="";
      const a = AREA.project;
      a.aiFailed = false; a.suggestedText = null;
      a.state_fips=r.state_fips; a.county_fips=r.county_fips; a.geoids=[];
      a.unit = {zip:"zcta", town:"county_subdivision", place:"block_group", community:"block_group"}[r.scale] || "county";
      a.mode = a.unit==="county" ? "all" : "selected";
      const community = r.scale === "community", cityPlace = r.scale === "place";
      a.featuresKey="";
      await fillAreaSelects("project");
      await refreshArea("project");
      let what = "";
      if(a.unit==="zcta"){
        const hit = (a.features?.features||[]).find(f=>f.properties.GEOID===r.zip);
        if(hit){ a.geoids=[r.zip]; what = ` Project area set to ZIP code ${esc(r.zip)}.`; }
        else{ a.aiFailed = true; what = ` ZIP code ${esc(r.zip||"")} was not found near this county — pick the ZIP area on the map.`; }
      }else if(a.unit==="county_subdivision"){
        const norm = s=>String(s||"").toLowerCase().replace(/\b(town|city|township|village|borough|cdp|plantation|charter)\b/g,"").replace(/[^a-z]/g,"");
        const hit = (a.features?.features||[]).find(f=>norm(f.properties.name)===norm(r.town));
        if(hit){ a.geoids=[hit.properties.GEOID]; what = ` Project area set to ${esc(hit.properties.name)}.`; }
        else{ a.aiFailed = true; what = ` Pick ${esc(r.town||"the town")} on the map.`; }
      }else if(cityPlace){
        what = " Selecting the block groups inside the city boundary…";
      }else if(community){
        what = " Suggesting the block groups for this community…";
      }
      renderScope("project"); renderAreaSum("project"); styleAreaMap("project");
      hint.innerHTML=`<b>${esc(r.county_name)}, ${esc(r.state_name)}</b> — ${esc(String(r.interpretation||"resolved").replace(/\.?\s*$/,"."))}`
        + (r.caveat?` <span style="color:var(--amber)">${esc(r.caveat)}</span>`:"")
        + what + `<br>Not right? Change the project area below.`;
      if(cityPlace) await suggestBlockGroups("project", r.town || text, true);
      else if(community) await suggestBlockGroups("project", text);
      captureAiNote();
    }else{
      resolveFailed(hint, r.caveat||"Could not place that.");
    }
  }catch(e){ resolveFailed(hint, e.message); }
