      <input id="m_pid" placeholder="e.g. a1b2c3d4e5f6" style="margin-top:8px;"></details>
    <div class="acts"><button class="cbtn" onclick="closeModal()">Cancel</button>
      <button class="cbtn next" onclick="doOpen()">Open</button></div>`);
  try{
    const {projects} = await api("/hcas/projects");
    const box = $("m_list"); if(!box) return;
    if(!projects.length){ box.innerHTML = `<div class="subnote">No saved projects yet.</div>`; return; }
    box.innerHTML = projects.map(p=>{
      const when = p.last_activity ? new Date(p.last_activity*1000)
        .toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
      return `<div class="lrow" style="padding:8px 6px;cursor:pointer;" onclick="doOpen('${esc(p.project_id)}')">
        <span class="lname"><b>${esc(p.title)}</b>
          <span class="lmeta"><span class="lsrc">${esc(p.place_name||"not yet located")}</span>
          <span class="lsrc">· ${p.confirmed_steps}/8 steps · ${esc(when)}</span></span></span></div>`;
    }).join("");
  }catch(e){ const b=$("m_list"); if(b) b.innerHTML = `<div class="subnote" style="color:var(--red)">${esc(e.message)}</div>`; }
}
/* A run keeps going on the SERVER even if the browser goes away — but S.running
   is browser state, so reopening a project mid-run used to show "Nothing here
   yet" over work that was actively happening, and the step only appeared once
   you happened to reload again after it finished. Ask the server whether the
   step is in flight and, if so, re-attach: draw its live progress and pick the
   result up when it lands. */
// Returns the progress body when step `n` is in flight on the server, else null.
// `running` is set for every step for the whole run (steps 1, 5, 6 and 8 never
// report a percentage, so pct alone missed them).
async function stepInFlight(n){
  try{
    const b = await api(`/hcas/projects/${S.pid}/steps/${n}/progress`);
    const on = b.running || (b.pct||0) > 0 || (Array.isArray(b.detail) && b.detail.length > 0);
    return on ? b : null;
  }catch(_){ return null; }
}
async function isStepRunning(n){ return !!(await stepInFlight(n)); }
// Which step, if any, is running on the server right now. Every step is asked,
// not only the one after the furthest: a RE-run of step 4 on a project whose
// steps 5-8 exist was invisible after a reload.
async function findRunningStep(){
  const bodies = await Promise.all([1,2,3,4,5,6,7,8].map(n=>stepInFlight(n)));
  const i = bodies.findIndex(b=>b);
  return i < 0 ? null : {step: i+1, body: bodies[i]};
}
// `force` is for the re-attach after a dropped connection: that step may well
// already have an artifact row from an earlier run (you pressed Re-run), and
// the row is exactly what the open-a-project caller uses to decide there is
// nothing in flight. The server is asked either way, so forcing only skips a
// guard that would be wrong here, never invents a run.
async function adoptRunningStep(n, force){
  if((!force && stepRow(n)) || S.running !== null) return false;
  const b = await stepInFlight(n);
  if(!b) return false;
  S.running = n; setBusy(true); statusRun("Running…");
  if(S.current === n) renderCanvasLoading(n);
  startProgress(n, b.elapsed_s);
  // The server clears a step's progress when the run ends — that is the signal.
  const watch = setInterval(async ()=>{
    if(S.running !== n){ clearInterval(watch); return; }
    if(await isStepRunning(n)) return;
    clearInterval(watch);
    S.running = null; stopProgress(); setBusy(false); statusRun("");
    try{ await refresh(); }catch(_){ renderCanvas(); }
  }, 2000);
  return true;
}
async function doOpen(id){
  id = (typeof id === "string" && id) ? id : ($("m_pid")?.value||"").trim();
  if(!id) return;
  try{
    S.pid=id; S.redefining=false; AREA.key=null; await refresh();
    // A message about the project we just left ("Saved as …") is not about this one.
    setMsg(""); dropResumeBar();
    localStorage.setItem("hcas_last_project", id);
    // Land on the step that is running on the server, if any — it may be a
    // re-run of an earlier step that already has a row — else on the furthest
    // step that exists, not back at step 1.
    const steps=(S.project?.steps||[]).map(s=>s.step);
    const furthest = steps.length?Math.max(...steps):1;
    const inflight = await findRunningStep();
    const land = inflight ? inflight.step : furthest;
    selectStep(land);
    closeModal();
    if(inflight) adoptRunningStep(land, true);
  }
  catch(e){
    S.pid=null;
    const box=$("m_list")||$("m_pid");
    if(box) box.insertAdjacentHTML("afterend",`<p style="color:var(--red)">${esc(e.message)}</p>`);
  }
}
/* The project saves its AI interactions (Prof. Shi 2026-11-13 #4). Before the project
   exists the server hands each record back with the reply; hold it and send it in once
   the project has been created. */
function relayAi(r){ if(r && r.ai_record) S.pendingAi.push(r.ai_record); }
async function flushPendingAi(){
  if(!S.pid || !S.pendingAi.length) return;
  const records = S.pendingAi.splice(0);
  try{ await api(`/hcas/projects/${S.pid}/ai-history`,{method:"POST",body:JSON.stringify({records})}); }
  catch(_){ S.pendingAi.unshift(...records); }
}
function exportProject(){
  if(!S.pid){ setMsg("Nothing to export yet."); return; }
  const a = document.createElement("a"); a.href = `/hcas/projects/${S.pid}/export.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function aiBrief(v, max){
  if(v==null) return "";
  let t = typeof v === "string" ? v : JSON.stringify(v);
  return t.length > (max||400) ? t.slice(0, max||400) + "…" : t;
}
function aiInputText(h){
  const u = h.user_input || {};
  if(h.kind==="chat") return u.message || "";
  if(h.kind==="find_area") return u.text || "";
  if(h.kind==="suggest_area") return u.text || "";
  if(h.kind==="place_area") return u.name || "";
  if(h.kind==="revise_factors") return u.instruction || "";
  if(h.kind==="step_draft") return u.refresh ? "Run again, fetching the data fresh" : "Draft this step";
  return aiBrief(u);
}
function aiOutputText(h){
  const o = h.ai_output || {};
  if(h.kind==="chat") return o.reply || "";
  if(h.kind==="find_area") return [o.county_name && (o.county_name+", "+(o.state_name||"")), o.interpretation, o.caveat].filter(Boolean).join(" — ") || aiBrief(o);
  if(h.kind==="suggest_area" || h.kind==="place_area") return `${(o.geoids||[]).length} block groups${o.place?" — "+o.place:""}${o.caveat?" — "+o.caveat:""}`;
  if(h.kind==="revise_factors") return [(o.added||[]).length?"added "+o.added.join(", "):"", (o.removed||[]).length?"removed "+o.removed.join(", "):"", o.note].filter(Boolean).join(" · ") || "no change";
  if(h.kind==="step_draft") return o.summary ? aiBrief(o.summary, 300) : (o.draft && (o.draft.notes || aiBrief(o.draft, 300))) || "";
  return aiBrief(o);
}
async function showAiHistory(){
  if(!S.pid){ modal(`<h3>AI history</h3><p>Nothing yet: the history belongs to a project. Create one by confirming step 1.</p>
    <div class="acts"><button class="cbtn" onclick="closeModal()">Close</button></div>`); return; }
  modal(`<h3>AI history</h3><div id="aihist" class="subnote"><span class="spin"></span>Loading…</div>
    <div class="acts"><button class="cbtn" onclick="exportProject()">Export project</button>
      <button class="cbtn next" onclick="closeModal()">Close</button></div>`, {wide:true});
  try{
    const {history} = await api(`/hcas/projects/${S.pid}/ai-history`);
    const box = $("aihist"); if(!box) return;
    if(!history.length){ box.innerHTML = "No AI interactions have been recorded for this project yet."; return; }
    const byStep = {};
    history.forEach(h=>{ (byStep[h.step||0] = byStep[h.step||0] || []).push(h); });
    box.innerHTML = Object.keys(byStep).sort((a,b)=>a-b).map(st=>`<div style="margin:0 0 14px;">
      <div class="ph">${+st ? `Step ${st} · ${esc(STEP_TITLES[st-1]||"")}` : "General"}</div>
      ${byStep[st].map(h=>`<div class="aih" style="border-top:1px solid var(--line);padding:8px 0;font-size:var(--fs-sm);">
        <div class="mono" style="color:var(--faint);font-size:11px;">${esc(new Date(h.created_at*1000).toLocaleString())} · ${esc(h.label)}</div>
        <div><b>You / system:</b> ${esc(aiBrief(aiInputText(h), 300))}</div>
        <div><b>AI:</b> ${esc(aiBrief(aiOutputText(h), 600))}</div></div>`).join("")}</div>`).join("");
  }catch(e){ const b=$("aihist"); if(b) b.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
}
async function saveProject(){
  if(!S.pid){ setMsg("Nothing to save yet."); return; }
  try{ const p=await api(`/hcas/projects/${S.pid}`);
    dl(JSON.stringify(p,null,2),(p.meta.title||"project")+".json","application/json"); }
  catch(e){ setMsg(e.message); }
}
/* Save as (Prof. Shi 2026-09-16 #4): start a new project from the current one.
   Everything confirmed so far — steps, maps and fetched data — is copied, so the
   new project can change one thing (the area, a factor) without redoing the
   rest. The original is left exactly as it was. */
function saveProjectAs(){
  if(!S.pid){ setMsg("Nothing to save yet — define a project first."); return; }
  const base = S.project?.meta?.title || "Untitled assessment";
  modal(`<h3>Save as a new project</h3>
    <p>Creates a copy of this project — every step, map and dataset so far — under a new name.
    The original project is not changed.</p>
    <input id="m_saveas" value="${esc(base+" (copy)")}">
    <div id="m_saveas_err" style="color:var(--red);font-size:var(--fs-sm);min-height:18px;margin-top:6px;"></div>
    <div class="acts"><button class="cbtn" onclick="closeModal()">Cancel</button>
      <button class="cbtn next" id="m_saveas_btn" onclick="doSaveAs()">Save as new project</button></div>`);
  const inp=$("m_saveas"); if(inp){ inp.select(); inp.onkeydown=e=>{ if(e.key==="Enter") doSaveAs(); }; }
}
async function doSaveAs(){
  const title=($("m_saveas")?.value||"").trim(), btn=$("m_saveas_btn");
  if(!title){ $("m_saveas_err").textContent="Give the new project a name."; return; }
  if(btn){ btn.disabled=true; btn.textContent="Copying…"; }
  try{
    const r=await api(`/hcas/projects/${S.pid}/copy`,{method:"POST",body:JSON.stringify({title})});
    const keepStep=S.current;
    S.pid=r.project_id; S.redefining=false; S.chats={}; dropResumeBar();
    try{ localStorage.setItem("hcas_last_project", S.pid); }catch(_){}
    await refresh();
    selectStep(keepStep);
    closeModal();
    statusRun(""); $("msgline").style.color="var(--ok)";
    $("msgline").textContent=`Saved as “${title}”. You are now working in the new project.`;
  }catch(e){
    $("m_saveas_err").textContent=e.message;
    if(btn){ btn.disabled=false; btn.textContent="Save as new project"; }
  }
}
function openSettings(){
  modal(`<h3>Settings</h3>
    <p>Guidance — shapes how the assistant responds.</p>
    <textarea id="m_sys" style="min-height:92px;">${esc(S.sys)}</textarea>
    <p style="margin-top:14px;">Research data</p>
    <div class="acts" style="justify-content:flex-start;"><a class="cbtn" href="/hcas/audit.csv" target="_blank" style="text-decoration:none;">Audit CSV ↧</a></div>
    <div class="acts"><button class="cbtn" onclick="closeModal()">Cancel</button>
      <button class="cbtn next" onclick="saveSettings()">Save</button></div>`);
}
function saveSettings(){ S.sys=$("m_sys").value||DEFAULT_SYS; renderBar(); closeModal(); }
function showAbout(){
  modal(`<h3>Healthy Community Assessment System</h3>
    <p>A step-by-step assessment of community health for a US county or a community within one — optionally
    compared with a base area — combining public data,
    spatial analysis, and modeling. Each step is prepared for you and confirmed before the next
    begins — you can edit anything along the way. The panel on the right answers questions as you work.</p>
    <p class="mono" style="font-size:12px;color:var(--faint);">Xun Shi (Dartmouth) · Wang's team (Tongji)</p>
    <div class="acts"><button class="cbtn next" onclick="closeModal()">Close</button></div>`);
}
function exitApp(){
  modal(`<h3>Exit assessment?</h3><p>This returns to a new project. Your work is saved under the project id — use <b>Save</b> first if you want a local copy.</p>
    <div class="acts"><button class="cbtn" onclick="closeModal()">Cancel</button>
      <button class="cbtn next" onclick="closeModal();newProject();">Exit</button></div>`);
}

/* ================= helpers ================= */
function setBusy(b){ S.busy=b; renderCmd(); }
function statusRun(t){ $("msgline").innerHTML = t?`<span class="spin"></span>${esc(t)}`:""; $("msgline").style.color=t?"var(--muted)":"var(--red)"; }
function setMsg(t){ $("msgline").textContent=t; $("msgline").style.color="var(--red)"; }
function modal(html, o){ $("modal").innerHTML=html; $("modal").classList.toggle("wide", !!(o&&o.wide)); $("veil").classList.add("show");
  const f=$("modal").querySelector("input,textarea"); if(f) setTimeout(()=>f.focus(),30); }
function closeModal(){ $("veil").classList.remove("show"); }
$("veil").onclick=e=>{ if(e.target===$("veil")) closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("veil").classList.contains("show")) closeModal(); });
function dl(text,name,type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }

function mdToHtml(md){
  const lines=String(md||"").split(/\r?\n/); let out=[],i=0;
  // `_…_` italics and `> ` quotes used to reach the step-8 preview raw (QA
  // 2026-09-29). An underscore inside a word (snake_case, a URL) is left alone.
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/(^|[^\w])_(?!\s)(.+?)_(?![\w])/g,"$1<em>$2</em>");
  while(i<lines.length){
    let l=lines[i];
    if(/^>\s?/.test(l)){ const q=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,"")); i++; }
      out.push("<blockquote>"+q.filter(x=>x.trim()).map(x=>"<p>"+inl(x)+"</p>").join("")+"</blockquote>"); continue; }
    if(/^###\s/.test(l)){ out.push("<h3>"+inl(l.replace(/^###\s/,""))+"</h3>"); i++; continue; }
    if(/^##\s/.test(l)){ out.push("<h2>"+inl(l.replace(/^##\s/,""))+"</h2>"); i++; continue; }
    if(/^#\s/.test(l)){ out.push("<h1>"+inl(l.replace(/^#\s/,""))+"</h1>"); i++; continue; }
    if(/^---+\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^\|/.test(l)){
      const tbl=[]; while(i<lines.length && /^\|/.test(lines[i])){ tbl.push(lines[i]); i++; }
      const rows=tbl.filter(r=>!/^\|[\s:|-]+\|?\s*$/.test(r));
      out.push("<table>"+rows.map((r,ri)=>{ const cells=r.split("|").slice(1,-1);
        const tag=ri===0?"th":"td"; return "<tr>"+cells.map(c=>`<${tag}>${inl(c.trim())}</${tag}>`).join("")+"</tr>";
      }).join("")+"</table>"); continue;
    }
    if(/^[-*]\s/.test(l)){ const items=[]; while(i<lines.length && /^[-*]\s/.test(lines[i])){ items.push("<li>"+inl(lines[i].replace(/^[-*]\s/,""))+"</li>"); i++; }
      out.push("<ul>"+items.join("")+"</ul>"); continue; }
    if(l.trim()===""){ i++; continue; }
    out.push("<p>"+inl(l)+"</p>"); i++;
  }
  return out.join("");
}

/* ============ resizable assistant panel (Prof. Shi request) ============ */
(function(){
  const bar=$("dragbar"), chat=$("chat");
  const saved=+localStorage.getItem("hcas_chatw");
  if(saved>=240&&saved<=560) chat.style.width=saved+"px";
  let drag=null;
  bar.addEventListener("mousedown",e=>{
    drag={x:e.clientX,w:chat.offsetWidth}; bar.classList.add("on");
    document.body.style.userSelect="none";
    document.querySelectorAll("iframe").forEach(f=>f.style.pointerEvents="none");
    e.preventDefault();
  });
  window.addEventListener("mousemove",e=>{
    if(!drag) return;
    chat.style.width=Math.min(560,Math.max(240,drag.w+(drag.x-e.clientX)))+"px";
  });
  window.addEventListener("mouseup",()=>{
    if(!drag) return;
    localStorage.setItem("hcas_chatw",chat.offsetWidth); drag=null;
    bar.classList.remove("on");
    document.body.style.userSelect="";
    document.querySelectorAll("iframe").forEach(f=>f.style.pointerEvents="");
  });
})();

/* ================= boot ================= */
newProject();
// Unit labels are needed by the step-1 view too (e.g. after Open project), not
// only by the create form, so fetch the list once at start.
loadUnits();
loadMeasures().then(()=>{ if(S.pid) renderCanvas(); });

/* Offer to pick up the last project. Closing the tab never lost work — every
   confirmed step is on disk — but you had to know the 12-character id to get
   back in, so in practice an accidental close did lose it. */
/* The bar is built from the CURRENT project list, not from a copy fetched once:
   it used to name a project the tester had since left, with a step count from
   whenever the page loaded. It goes away the moment any project is opened or
   created (dropResumeBar), so it can never sit stale above other work. */
function dropResumeBar(){ const b=$("resumebar"); if(b) b.remove(); }
(async function offerResume(){
  let last;
  try{ last = localStorage.getItem("hcas_last_project"); }catch(_){ return; }
  if(!last) return;
  try{
    const {projects} = await api("/hcas/projects");
    if(S.pid) return;                           // the user already opened one
    const p = (projects||[]).find(x=>x.project_id===last);
    if(!p){ try{ localStorage.removeItem("hcas_last_project"); }catch(_){} return; }
    const done = p.confirmed_steps||0;
    p.meta = {title: p.title};
    const bar = document.createElement("div");
    bar.id = "resumebar";
    bar.style.cssText = "display:flex;align-items:center;gap:10px;padding:8px var(--sp-5);"
      + "background:var(--teal-tint);border-bottom:1px solid var(--line);font-size:var(--fs-sm);";
    bar.innerHTML = `<span>Pick up where you left off — <b>${esc(p.meta.title||"your last project")}</b>`
      + ` (${done}/8 steps confirmed)</span>`
      + `<button class="cbtn next" style="padding:4px 12px;" id="resumebtn">Resume</button>`
      + `<button class="cbtn" style="padding:4px 10px;" id="dismissresume">Not now</button>`;
    $("pbar").insertAdjacentElement("afterend", bar);
    $("resumebtn").onclick = ()=>{ bar.remove(); doOpen(last); };
    $("dismissresume").onclick = ()=>{ bar.remove(); try{ localStorage.removeItem("hcas_last_project"); }catch(_){} };
  }catch(_){ /* project deleted or server restarted with a fresh db: stay quiet */ }
})();
// /hcas?project=<id> opens that project straight away (a shareable link; also what the QA scripts use).
(function deepLink(){
  let id = null;
  try{ id = new URLSearchParams(location.search).get("project"); }catch(_){}
  if(id) doOpen(id);
})();
