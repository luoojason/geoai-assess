<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Healthy Community Assessment System</title>
<link rel="icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* HCAS — Xun Shi's layout, wired to the gated 8-step backend.
     Direction: a precise cartographic field instrument. Archivo (titles) +
     Hanken Grotesk (text) + JetBrains Mono (data). OKLCH, teal-forward,
     neutrals tinted toward the brand hue. See .impeccable.md. */
  :root{
    --sans:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
    --display:'Archivo','Hanken Grotesk',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --fs-xs:.6875rem; --fs-sm:.8125rem; --fs-base:.875rem; --fs-md:1rem; --fs-lg:1.375rem; --fs-xl:1.75rem;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-12:48px;
    --r-sm:7px; --r:10px; --r-lg:14px;
    --teal:oklch(0.52 0.085 219); --teal-d:oklch(0.43 0.082 221);
    --teal-tint:oklch(0.958 0.019 219); --teal-tint-d:oklch(0.9 0.033 219);
    --ink:oklch(0.30 0.017 226); --muted:oklch(0.505 0.019 224);
    --faint:oklch(0.61 0.017 223); --ghost:oklch(0.71 0.013 222);
    --line:oklch(0.905 0.008 220); --line-d:oklch(0.845 0.012 220);
    --grid:oklch(0.905 0.011 219);
    --bg:oklch(0.955 0.008 221); --surface:oklch(0.996 0.003 220);
    --panel:oklch(0.978 0.006 220); --head:oklch(0.984 0.005 220);
    --amber:oklch(0.55 0.10 64); --amber-tint:oklch(0.95 0.036 74);
    --ok:oklch(0.53 0.085 158); --ok-tint:oklch(0.945 0.032 158);
    --red:oklch(0.54 0.15 26); --red-tint:oklch(0.945 0.04 30);
    --info:oklch(0.5 0.06 244); --info-tint:oklch(0.95 0.028 244);
    --draft:oklch(0.58 0.10 66); --stale:oklch(0.56 0.13 32);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);
       font-size:var(--fs-base);line-height:1.5;overflow:hidden;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  ::selection{background:var(--teal-tint-d);}
  .mono{font-family:var(--mono);font-feature-settings:"tnum" 1;}
  .eyebrow{font:500 var(--fs-xs)/1.3 var(--mono);letter-spacing:.07em;color:var(--faint);text-transform:uppercase;}
  button{font-family:var(--sans);cursor:pointer;}
  a{color:var(--teal-d);text-underline-offset:2px;} a:hover{color:var(--teal);}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px;}

  #app{display:flex;flex-direction:column;height:100vh;padding:var(--sp-4) var(--sp-5);}
  #card{flex:1;display:flex;flex-direction:column;background:var(--surface);
        border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-height:0;
        box-shadow:0 1px 2px oklch(0.4 0.03 220/.05), 0 18px 40px -26px oklch(0.4 0.05 220/.35);}

  /* 1 · Header */
  #hdr{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5);height:58px;flex:none;
       border-bottom:1px solid var(--line);background:var(--head);}
  #logo{width:30px;height:30px;border-radius:8px;background:var(--teal);color:var(--surface);display:flex;
        align-items:center;justify-content:center;font:700 16px var(--display);flex:none;
        box-shadow:inset 0 1px 0 oklch(1 0 0/.2);}
  #hdr .title{font:600 var(--fs-md)/1.1 var(--display);letter-spacing:-.01em;}
  #hdr .sub{font:400 var(--fs-xs)/1 var(--mono);color:var(--faint);margin-top:3px;letter-spacing:.02em;}
  #nav{margin-left:auto;display:flex;align-items:center;gap:1px;}
  .navbtn{border:none;background:none;font:500 var(--fs-sm) var(--sans);color:var(--muted);
          padding:6px 10px;border-radius:7px;transition:background .15s,color .15s;}
  .navbtn:hover{background:var(--teal-tint);color:var(--ink);}
  .navbtn.exit{color:var(--red);} .navbtn.exit:hover{background:var(--red-tint);}
  .navsep{color:var(--line-d);font-size:11px;}

  /* 2 · Project bar */
  #pbar{display:flex;align-items:center;min-height:46px;flex:none;padding:7px var(--sp-5);
        border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;column-gap:0;row-gap:4px;}
  #pbar .grp{display:flex;align-items:center;gap:9px;}
  #pbar .divider{width:1px;height:18px;background:var(--line);margin:0 var(--sp-4);}
  #pbar .val{font:600 var(--fs-sm) var(--sans);color:var(--ink);}
  #pbar .val.mono{font:400 var(--fs-sm) var(--mono);color:var(--muted);}
  #sysprompt{font:400 var(--fs-sm) var(--sans);color:var(--muted);max-width:46ch;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-radius:6px;
             padding:2px 6px;cursor:text;transition:border-color .15s,background .15s;}
  #sysprompt:hover{border-color:var(--line);background:var(--panel);}

  #body{flex:1;display:flex;min-height:0;}

  /* 3 · Pipeline rail */
  #rail{width:240px;flex:none;border-right:1px solid var(--line);background:var(--panel);
        padding:var(--sp-4) 0;overflow-y:auto;}
  #rail .hd{padding:0 var(--sp-4) var(--sp-3);}
  .prow{display:flex;align-items:center;gap:11px;padding:9px var(--sp-4);cursor:pointer;
        transition:background .14s;}
  .prow:hover{background:var(--teal-tint);}
  .prow.active{background:var(--teal-tint);}
  .prow.locked{cursor:default;opacity:.5;}
  .prow.locked:hover{background:none;}
  .pdot{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line-d);color:var(--ghost);
        display:inline-flex;align-items:center;justify-content:center;font:500 12px var(--mono);flex:none;
        background:var(--surface);transition:border-color .14s,background .14s,color .14s;}
  .prow.active .pdot{border-color:var(--teal);color:var(--teal-d);}
  .pdot.confirmed{background:var(--ok);border-color:var(--ok);color:var(--surface);}
  .pdot.drafted{border-color:var(--draft);color:var(--draft);background:var(--amber-tint);}
  .pdot.stale{border-color:var(--stale);color:var(--stale);background:var(--red-tint);}
  .plabel{font:400 var(--fs-sm)/1.25 var(--sans);color:var(--muted);}
  .prow.active .plabel{color:var(--ink);font-weight:600;}
  .prow.confirmed .plabel{color:var(--ink);}

  /* 4 · Work canvas */
  #canvas{flex:1;min-width:0;background:var(--panel);overflow-y:auto;padding:var(--sp-6) var(--sp-6);}
  .chead{max-width:78ch;}
  .chead .eyebrow{color:var(--teal-d);}
  .chd{display:flex;align-items:baseline;gap:var(--sp-3);margin-top:6px;flex-wrap:wrap;}
  #canvas h2{font:700 var(--fs-xl) var(--display);letter-spacing:-.02em;margin:0;color:var(--ink);}
  #canvas .csub{font:400 var(--fs-base) var(--sans);color:var(--faint);max-width:60ch;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
         padding:var(--sp-4) var(--sp-5);margin-top:var(--sp-4);}
  .panel > .ph{font:500 var(--fs-xs) var(--mono);letter-spacing:.06em;text-transform:uppercase;
               color:var(--faint);margin-bottom:var(--sp-3);}
  .cols{display:flex;gap:var(--sp-4);flex-wrap:wrap;}
  .cols > *{flex:1;min-width:230px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:var(--fs-sm);align-items:baseline;align-content:start;}
  .kv dt{font:500 var(--fs-xs) var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .kv dd{margin:0;color:var(--ink);}
  .tree .grp{margin-bottom:10px;}
  .tree .gname{font:600 var(--fs-sm) var(--sans);color:var(--ink);display:flex;align-items:center;gap:8px;}
  .tree .gname::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--teal);display:inline-block;}
  .tree .leaf{font:400 var(--fs-sm) var(--sans);color:var(--muted);padding:3px 0 3px 16px;display:flex;justify-content:space-between;gap:10px;}
  .tree .leaf .c{font:400 var(--fs-xs) var(--mono);color:var(--ghost);white-space:nowrap;}
  /* Prof. Shi 2026-08-07 #1: "Expand the map view on all pages to have a larger
     size and a similar-to-square (rather than elongated) shape." Aspect-ratio
     drives the height, so the map grows with the panel and stays near-square
     instead of the old fixed 264px letterbox. */
  .mapview{aspect-ratio:5/4;min-height:420px;border-radius:var(--r-sm);border:1px solid var(--line);overflow:hidden;
           background-color:var(--teal-tint);
           background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                            linear-gradient(90deg,var(--grid) 1px,transparent 1px);
           background-size:24px 24px;background-position:-1px -1px;
           display:flex;align-items:center;justify-content:center;text-align:center;}
  .mapview .lab{background:oklch(1 0 0/.82);border:1px solid var(--line);border-radius:var(--r-sm);
                padding:9px 15px;backdrop-filter:blur(1px);}
  table.data{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
  table.data th{font:500 var(--fs-xs) var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--faint);
                text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
  table.data td{padding:7px 8px;border-bottom:1px solid var(--line);}
  table.data td:not(:first-child){font-family:var(--mono);}
  table.data tr:last-child td{border-bottom:none;}
  .above{color:var(--red);font-weight:600;} .below{color:var(--ok);font-weight:600;}

  .tag{font:600 var(--fs-xs)/1 var(--mono);letter-spacing:.03em;text-transform:uppercase;padding:5px 10px;
       border-radius:999px;background:var(--amber-tint);color:var(--amber);white-space:nowrap;}
  .tag.rag{background:var(--info-tint);color:var(--info);}
  .tag.done{background:var(--ok-tint);color:var(--ok);}
  .tag.muted{background:var(--teal-tint-d);color:var(--teal-d);}

  .factor{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);
          border-radius:var(--r-sm);background:var(--surface);margin-bottom:9px;transition:border-color .15s,background .15s,opacity .15s;}
  .factor:hover{border-color:var(--line-d);}
  .factor input{margin-top:2px;width:17px;height:17px;accent-color:var(--teal);flex:none;cursor:pointer;}
  .factor.off{opacity:.52;background:var(--panel);}
  .factor .fname{font:600 var(--fs-base) var(--sans);color:var(--ink);}
  .factor .metric{font:500 var(--fs-xs) var(--mono);color:var(--teal-d);background:var(--teal-tint);
                  border-radius:5px;padding:2px 7px;margin-left:9px;vertical-align:1px;}
  .factor .rat{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin-top:4px;line-height:1.45;}
  .sec{margin-bottom:var(--sp-4);}
  .sec:last-child{margin-bottom:0;}
  .sec h4{font:600 var(--fs-sm) var(--sans);margin:0 0 4px;color:var(--ink);}
  .sec p,.sec li{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin:3px 0;}
  .sec ul{margin:4px 0;padding-left:18px;}
  ul.flow{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;}
  ul.flow li{display:flex;align-items:center;gap:12px;padding:8px 0;font:400 var(--fs-sm) var(--sans);color:var(--ink);}
  ul.flow li .n{width:22px;height:22px;border-radius:6px;background:var(--teal-tint-d);color:var(--teal-d);
                font:500 11px var(--mono);display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .metricgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px;}
  .metric-c{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;background:var(--surface);}
  .metric-c .mn{font:500 var(--fs-xs) var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.02em;line-height:1.35;}
  .metric-c .mv{font:600 var(--fs-lg) var(--mono);color:var(--ink);margin-top:5px;font-feature-settings:"tnum" 1;}
  .iv{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;
      padding-right:76px;margin-bottom:9px;background:var(--surface);}
  .iv .sev{position:absolute;top:11px;right:11px;font:600 9.5px/1 var(--mono);letter-spacing:.05em;
           text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--amber-tint);color:var(--amber);}
  .iv.high .sev{background:var(--red-tint);color:var(--red);}
  .iv.low .sev{background:var(--ok-tint);color:var(--ok);}
  .iv .cat{font:600 var(--fs-base) var(--sans);color:var(--ink);}
  .iv .fin{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin-top:4px;line-height:1.45;}
  #report{width:100%;min-height:320px;font:400 var(--fs-sm)/1.6 var(--mono);padding:15px;border:1px solid var(--line);
          border-radius:var(--r-sm);resize:vertical;background:var(--surface);color:var(--ink);}
  #report:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  .rprev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:20px 24px;overflow-x:auto;}
  .rprev h1{font:700 var(--fs-lg) var(--display);letter-spacing:-.01em;margin:.1em 0 .3em;}
  .rprev h2{font:600 var(--fs-md) var(--display);margin:1.1em 0 .35em;border-bottom:1px solid var(--line);padding-bottom:4px;}
  .rprev h3{font:600 var(--fs-base) var(--sans);margin:.9em 0 .2em;}
  .rprev p,.rprev li{font-size:var(--fs-sm);color:var(--ink);line-height:1.6;}
  .rprev table{border-collapse:collapse;margin:10px 0;} .rprev th,.rprev td{border:1px solid var(--line);padding:5px 10px;font-size:var(--fs-sm);}
  .rprev th{background:var(--panel);font-family:var(--mono);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.03em;}
  details.raw{margin-top:var(--sp-4);}
  details.raw summary{font:500 var(--fs-xs) var(--mono);color:var(--faint);cursor:pointer;letter-spacing:.03em;
                      list-style:none;display:inline-flex;align-items:center;gap:6px;}
  details.raw summary::before{content:"▸";transition:transform .15s;display:inline-block;}
  details.raw[open] summary::before{transform:rotate(90deg);}
  details.raw summary:hover{color:var(--teal-d);}
  .linkbtn{border:none;background:none;font:500 var(--fs-xs) var(--mono);letter-spacing:.03em;
           color:var(--faint);padding:4px 0;border-bottom:1px dashed var(--line-d);}
  .linkbtn:hover{color:var(--teal-d);border-bottom-color:var(--teal);}
  details.raw textarea{width:100%;min-height:220px;margin-top:10px;font:400 var(--fs-xs)/1.55 var(--mono);
                       padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);}
  .subnote{font:400 var(--fs-xs) var(--sans);color:var(--ghost);margin-top:6px;}
  .form{max-width:760px;}
  .form .row{display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-4);}
  .form .fld{flex:1;min-width:220px;}
  .form label{font:500 var(--fs-xs) var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--faint);display:block;margin-bottom:6px;}
  .form input,.form select,.form textarea{width:100%;font:400 var(--fs-base) var(--sans);padding:10px 12px;
       border:1px solid var(--line-d);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);box-sizing:border-box;transition:border-color .15s,box-shadow .15s;}
  .form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  .form input:disabled{background:var(--panel);color:var(--faint);}
  .form textarea{resize:vertical;min-height:74px;}
  .form .hint{font:400 var(--fs-xs) var(--sans);color:var(--ghost);margin-top:6px;line-height:1.5;}
  .empty{text-align:center;color:var(--faint);padding:44px 0;font-size:var(--fs-base);}
  .empty .big{font:600 var(--fs-md) var(--display);color:var(--muted);margin-bottom:4px;}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
           min-height:340px;text-align:center;}
  .loading .lmsg{font:500 var(--fs-base) var(--sans);color:var(--muted);max-width:42ch;}
  .spin-lg{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--teal);
           border-radius:50%;animation:spin .85s linear infinite;}

  /* 5 · Assistant */
  /* live progress bar in the loading state */
  .pbar{width:min(420px,72%);height:8px;border-radius:99px;background:var(--teal-tint-d);
        overflow:hidden;margin:16px auto 0;}
  .pbar .fill{height:100%;width:0%;background:var(--teal);border-radius:99px;
              transition:width .6s cubic-bezier(.4,0,.2,1);}
  .ppct{font:500 var(--fs-sm) var(--mono);color:var(--teal-d);margin-top:8px;}
  /* live per-layer checklist under the progress bar */
  .pchecklist{margin-top:16px;width:min(440px,80%);display:flex;flex-direction:column;gap:5px;text-align:left;}
  .ck-row{display:flex;align-items:center;gap:9px;font:400 var(--fs-sm) var(--sans);color:var(--muted);
          padding:5px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);}
  .ck-row.done{color:var(--ink);} .ck-row.error{color:var(--red);background:var(--red-tint);}
  .ck-name{flex:1;font-weight:500;} .ck-meta{font:400 var(--fs-xs) var(--mono);color:var(--faint);white-space:nowrap;}
  .ck-row.error .ck-meta{color:var(--red);white-space:normal;}
  .ck-ok{color:var(--ok);font-weight:700;width:14px;text-align:center;flex:none;}
  .ck-err{color:var(--red);font-weight:700;width:14px;text-align:center;flex:none;}
  .ck-run{width:12px;height:12px;flex:none;border:2px solid var(--line-d);border-top-color:var(--teal);
          border-radius:50%;animation:spin .8s linear infinite;}
  /* layer list rows + right-click menu (Prof. Shi 2026-07-27) */
  .lrow{align-items:center;gap:8px;padding:5px 4px 5px 2px;border-radius:6px;cursor:default;}
  .lrow:hover{background:var(--teal-tint);}
  .lvis{width:15px;height:15px;accent-color:var(--teal);flex:none;cursor:pointer;margin:0;}
  .lvis-sp{width:15px;flex:none;display:inline-block;}
  .lname{flex:1;color:var(--ink);font:400 var(--fs-sm) var(--sans);min-width:0;}
  .lmeta{display:block;margin-top:1px;}
  .lsrc{font:400 var(--fs-xs) var(--mono);color:var(--ghost);margin-right:4px;}
  .lkebab{border:none;background:none;color:var(--ghost);font-size:15px;line-height:1;padding:2px 5px;border-radius:5px;
          opacity:0;transition:opacity .12s,background .12s;}
  .lrow:hover .lkebab{opacity:1;} .lkebab:hover{background:var(--line);color:var(--ink);}
  .lmenu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-d);border-radius:var(--r-sm);
         box-shadow:0 10px 30px -12px oklch(0.3 0.05 224/.5);padding:5px;min-width:186px;display:flex;flex-direction:column;}
  .lmenu button{border:none;background:none;text-align:left;font:400 var(--fs-sm) var(--sans);color:var(--ink);
                padding:8px 11px;border-radius:6px;}
  .lmenu button:hover{background:var(--teal-tint);color:var(--teal-d);}
  /* drag handle between canvas and assistant (Prof. Shi: panels resizable) */
  #dragbar{width:6px;flex:none;cursor:col-resize;background:transparent;}
  #dragbar:hover,#dragbar.on{background:var(--teal-tint);}
  .warnbar{display:flex;gap:9px;align-items:flex-start;background:var(--red-tint);color:var(--red);
           border-radius:var(--r-sm);padding:10px 13px;font-size:var(--fs-sm);margin-top:var(--sp-4);}
  .stack{display:flex;flex-direction:column;min-width:0;}
  .stack .panel+.panel{margin-top:0;border-top:0;border-top-left-radius:0;border-top-right-radius:0;}
  .stack .panel:first-child{border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .mapframe{width:100%;height:100%;border:0;display:block;background:#fff;}
  #chat{width:316px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;}
  #chat .chd{padding:14px var(--sp-4);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;margin:0;}
  #chat .chd .t{font:600 var(--fs-base) var(--display);color:var(--ink);}
  #chat .chd .s{font:400 var(--fs-xs) var(--mono);color:var(--faint);margin-top:3px;}
  #chat .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-tint);}
  #msgs{flex:1;overflow-y:auto;padding:var(--sp-4);display:flex;flex-direction:column;gap:10px;}
  .bub{max-width:90%;padding:10px 13px;font:400 var(--fs-sm)/1.5 var(--sans);border-radius:14px;white-space:pre-wrap;word-wrap:break-word;}
  .bub.a{align-self:flex-start;background:var(--teal-tint);color:var(--teal-d);border-bottom-left-radius:4px;}
  .bub.u{align-self:flex-end;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-right-radius:4px;}
  .bub.err{background:var(--red-tint);color:var(--red);}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--teal);opacity:.4;animation:blink 1.2s infinite both;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
  #chatform{flex:none;border-top:1px solid var(--line);padding:12px var(--sp-3);display:flex;align-items:center;gap:8px;}
  #chatbox{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line-d);border-radius:20px;
           background:var(--surface);padding:0 5px 0 15px;height:40px;transition:border-color .15s,box-shadow .15s;}
  #chatbox:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  #prompt{flex:1;border:none;outline:none;font:400 var(--fs-sm) var(--sans);background:none;color:var(--ink);}
  #send{border:none;border-radius:50%;width:29px;height:29px;background:var(--teal);color:var(--surface);
        font:600 14px var(--sans);flex:none;cursor:pointer;transition:background .15s;}
  #send:hover{background:var(--teal-d);} #send:disabled{opacity:.5;}

  /* 6 · Command bar */
  #cmd{flex:none;min-height:66px;border-top:1px solid var(--line);background:var(--surface);
       display:flex;align-items:center;gap:var(--sp-3);padding:12px var(--sp-5);flex-wrap:wrap;}
  .cbtn{border:1px solid var(--line-d);border-radius:var(--r-sm);background:var(--surface);color:var(--muted);
        font:500 var(--fs-base) var(--sans);padding:10px 17px;transition:background .15s,border-color .15s,color .15s;}
  .cbtn:hover{background:var(--panel);color:var(--ink);border-color:var(--line-d);}
  .cbtn.run{border-color:color-mix(in oklch,var(--amber) 45%,var(--line-d));color:var(--amber);background:var(--surface);}
  .cbtn.run:hover{background:var(--amber-tint);}
  .cbtn.next{border-color:var(--teal);background:var(--teal);color:var(--surface);font-weight:600;padding:10px 20px;}
  .cbtn.next:hover{background:var(--teal-d);border-color:var(--teal-d);color:var(--surface);}
  .cbtn:disabled{opacity:.42;cursor:default;background:var(--surface);color:var(--muted);}
  .cbtn.next:disabled{background:var(--teal);color:var(--surface);}
  #msgline{font:400 var(--fs-sm) var(--sans);color:var(--red);flex:1;min-width:0;}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-d);border-top-color:var(--teal);
        border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* dialog */
  #veil{position:fixed;inset:0;background:oklch(0.3 0.03 224/.4);display:none;align-items:center;
        justify-content:center;z-index:50;backdrop-filter:blur(2px);}
  #veil.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;
         max-width:460px;width:90%;box-shadow:0 24px 60px -20px oklch(0.3 0.05 224/.45);}
  .modal h3{margin:0 0 8px;font:600 var(--fs-lg) var(--display);letter-spacing:-.01em;color:var(--ink);}
  .modal p{font:400 var(--fs-sm) var(--sans);color:var(--muted);margin:8px 0;line-height:1.55;}
  .modal input,.modal textarea{width:100%;font:400 var(--fs-base) var(--sans);padding:10px 12px;
       border:1px solid var(--line-d);border-radius:var(--r-sm);box-sizing:border-box;margin-top:8px;color:var(--ink);background:var(--surface);}
  .modal input:focus,.modal textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint-d);}
  .modal .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important;} }
</style>
</head>
<body>
<div id="app"><div id="card">

  <!-- 1 · Header -->
  <div id="hdr">
    <div id="logo">H</div>
    <div><div class="title">Healthy Community Assessment System</div><div class="sub">Community health · spatial analysis</div></div>
    <div id="nav">
      <button class="navbtn" onclick="newProject()">New</button><span class="navsep">·</span>
      <button class="navbtn" onclick="openProject()">Open</button><span class="navsep">·</span>
      <button class="navbtn" onclick="saveProject()">Save</button><span class="navsep">·</span>
      <button class="navbtn" onclick="openSettings()">Settings</button><span class="navsep">·</span>
      <button class="navbtn" onclick="showAbout()">About</button>
      <button class="navbtn exit" onclick="exitApp()">Exit</button>
    </div>
  </div>

  <!-- 2 · Project bar -->
  <div id="pbar">
    <div class="grp"><span class="eyebrow">Project</span><span class="val" id="pb_title">No project</span></div>
    <span class="divider"></span>
    <div class="grp"><span class="eyebrow">Modified</span><span class="val mono" id="pb_mod">—</span></div>
    <span class="divider"></span>
    <div class="grp" style="flex:1;min-width:0;"><span class="eyebrow">Guidance</span>
      <span id="sysprompt" title="Click to edit — shapes how the assistant responds" onclick="openSettings()"></span></div>
  </div>

  <!-- body -->
  <div id="body">
    <!-- 3 · Pipeline rail -->
    <div id="rail">
      <div class="hd"><span class="eyebrow">Assessment steps</span></div>
      <div id="steps"></div>
    </div>

    <!-- 4 · Work canvas -->
    <div id="canvas"></div>

    <div id="dragbar" title="Drag to resize the assistant panel"></div>

    <!-- 5 · Assistant -->
    <div id="chat">
      <div class="chd"><span class="dot"></span><div><div class="t">Assistant</div><div class="s">Ask about any step</div></div></div>
      <div id="msgs"></div>
      <div id="chatform"><div id="chatbox">
        <input id="prompt" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')sendChat()">
        <button id="send" onclick="sendChat()" title="Send">↑</button>
      </div></div>
    </div>
  </div>

  <!-- 6 · Command bar -->
  <div id="cmd">
    <div id="msgline"></div>
    <button class="cbtn" id="prevbtn" onclick="prevStep()">← Back</button>
    <button class="cbtn run" id="runbtn" onclick="runStep()">Run step</button>
    <button class="cbtn next" id="nextbtn" onclick="confirmStep()">Confirm →</button>
  </div>

</div></div>

<div id="veil"><div class="modal" id="modal"></div></div>

<script>
const HDRS = { "X-Requested-With": "geoai", "Content-Type": "application/json" };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STEP_TITLES = ["Define project","Choose factors","Gather data","Set methodology",
  "Build database","Plan workflow","Run analysis","Write report"];
const PHASE = ["Preparation","Preparation","Preparation",
  "Methodology","Methodology","Analysis","Analysis","Report"];
const SUBTITLE = [
  "Set the scope and study area for the assessment.",
  "Suggested factors and metrics — keep the ones that apply, then confirm.",
  "Data for each factor, gathered and previewed for inspection.",
  "A methodology from the knowledge base, with the models and metrics to apply.",
  "The project's spatial database — extent, projection, and layers.",
  "A step-by-step workflow that carries out the chosen methodology.",
  "Runs the workflow to compute metrics and produce results.",
  "An editable report built from the inputs, data, and results."];
const RUN_HINTS = {
  1:"Locating the study-area county…",
  2:"Selecting factors and metrics — about a minute…",
  3:"Gathering map layers and county health outcomes…",
  4:"Preparing the methodology — about a minute…",
  5:"Assembling the spatial database…",
  6:"Building the workflow from the confirmed metrics…",
  7:"Gathering layers, computing metrics, building the map…",
  8:"Preparing the report…"};
const DEFAULT_SYS = "Focus on spatial analysis for community-health assessment. Be concise and specific.";

const S = { pid:null, current:1, project:null, edited:null, draftShownAt:null,
            chats:{}, sys:DEFAULT_SYS, busy:false, redefining:false, running:null };

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Map View helpers (Prof. Shi 2026-07-27: a base map from step 1). The locator
   map is FIPS-scoped so it works from step 1 onward; meta carries the FIPS. */
function basemapUrl(){
  const m = S.project?.meta;
  return m && m.state_fips && m.county_fips ? `/hcas/basemap/${m.state_fips}/${m.county_fips}` : "";
}
function baseMapFrame(){
  const u = basemapUrl();
  return u
    ? `<iframe class="mapframe" src="${u}" title="Study area base map"></iframe>`
    : `<div class="lab"><div class="eyebrow">Map view</div>
        <div class="mono" style="color:var(--faint);font-size:12px;margin-top:5px;">Run step 1 to locate the study area.</div></div>`;
}
/* Folium FeatureGroup names in render_assessment_map / render_base_map — the
   left-list visibility toggle drives these by clicking the matching overlay in
   the map's own layer control (same-origin iframe). */
const FOLIUM_LABEL = { buildings:"Buildings", greenspace:"Greenspace", roads:"Roads",
  parking:"Parking", sidewalks:"Sidewalks", transit_stops:"Transit Stops", facilities:"Facilities" };
const byStep = () => Object.fromEntries((S.project?.steps||[]).map(s=>[s.step,s]));
const stepRow = n => (S.project?.steps||[]).find(s=>s.step===n) || null;

async function api(path, opts={}){
  const r = await fetch(path,{headers:HDRS,...opts});
  const body = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(body.detail || (r.status+" "+r.statusText));
  return body;
}

/* ---- pipeline rail ---- */
function renderRail(){
  const bs = byStep();
  const confirmed = new Set(Object.values(bs).filter(s=>s.status==="confirmed").map(s=>s.step));
  $("steps").innerHTML = [1,2,3,4,5,6,7,8].map(n=>{
    const st = bs[n]?.status || "pending";
    const locked = !S.pid || (!bs[n] && [...Array(n-1).keys()].some(i=>!confirmed.has(i+1)));
    const mark = st==="confirmed" ? "✓" : n;
    return `<div class="prow ${st} ${n===S.current?"active":""} ${locked&&n!==S.current?"locked":""}" onclick="selectStep(${n})">
      <span class="pdot ${st}">${mark}</span><span class="plabel">${STEP_TITLES[n-1]}</span></div>`;
  }).join("");
}

/* ---- project bar ---- */
function renderBar(){
  $("pb_title").textContent = S.project ? S.project.meta.title : "No project";
  const t = S.project ? new Date((S.project.meta.created_at||0)*1000) : null;
  $("pb_mod").textContent = t ? t.toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
  $("sysprompt").textContent = S.sys;
}

/* ---- selection / working copy ---- */
function selectStep(n){
  if(n<1||n>8) return;
  S.current = n;
  const row = stepRow(n);
  // A step that is mid-run has no row yet; keep its working copy null rather
  // than inheriting the previous step's, and let renderCanvas draw progress.
  S.edited = row ? JSON.parse(JSON.stringify(row.human_final ?? row.ai_draft)) : null;
  S.draftShownAt = row && row.status==="drafted" ? Date.now() : null;
  renderRail(); renderCanvas(); renderChat(); renderCmd();
}

/* ---- command bar state ----
   Prof. Shi 2026-08-07: #8 Back works on step 1's result page (it re-opens the
   definition form); #9 Re-run is deactivated there, because re-running step 1
   only re-derives the same county — the useful action is Back. */
function renderCmd(){
  const row = stepRow(S.current);
  const confirmed = new Set((S.project?.steps||[]).filter(s=>s.status==="confirmed").map(s=>s.step));
  const prevOk = S.current===1 || confirmed.has(S.current-1);
  const onStep1Result = S.current===1 && !!row && !S.redefining;
  $("runbtn").disabled = S.busy || (!prevOk && !row) || onStep1Result;
  $("nextbtn").disabled = S.busy || !row || S.redefining;
  $("prevbtn").disabled = S.busy || (S.current===1 && !onStep1Result);
  $("nextbtn").textContent = S.current===8 ? "Save report" : "Confirm →";
  $("runbtn").textContent = S.redefining ? "Apply & re-run" : (row ? "Re-run" : "Run step");
  $("prevbtn").textContent = onStep1Result ? "← Re-define" : "← Back";
  $("runbtn").title = onStep1Result
    ? "Step 1 only re-derives the same county — use Re-define to change the study area."
    : "";
}

/* ================= CANVAS ================= */
function canvasHead(n){
  return `<div class="chead"><span class="eyebrow">Step ${n} of 8 · ${esc(PHASE[n-1])}</span>
    <div class="chd"><h2>${esc(STEP_TITLES[n-1])}</h2>${stepTag(n)}</div>
    <div class="csub">${esc(SUBTITLE[n-1])}</div></div>`;
}
function loadingBody(n){
  return `<div class="loading"><div class="spin-lg"></div>
       <div class="pbar"><div class="fill" id="pfill"></div></div>
       <div class="ppct" id="ppct">0%</div>
       <div class="lmsg" id="plabel">${esc(RUN_HINTS[n]||"Working…")}</div>
       <div class="pchecklist" id="pdetail"></div></div>`;
}
/* `n` is the step being RUN, which is not necessarily the one on screen: the
   caller awaits before painting, and the user can click another step in that
   gap. Passing it explicitly keeps the loading body from being drawn under a
   heading it does not belong to. */
function renderCanvasLoading(n){
  n = n || S.current;
  $("canvas").innerHTML = canvasHead(n) + loadingBody(n);
}
/* Live per-layer checklist (Prof. Shi 2026-07-27: show what is being fetched
   from where, rather than a bar that sits still then jumps). */
function renderChecklist(detail){
  const box = $("pdetail"); if(!box || !Array.isArray(detail)) return;
  box.innerHTML = detail.map(d=>{
    const mark = d.status==="done" ? '<span class="ck-ok">✓</span>'
      : d.status==="error" ? '<span class="ck-err">⚠</span>'
      : '<span class="ck-run"></span>';
    const meta = d.status==="done" && d.count!=null ? `${(+d.count).toLocaleString()} features`
      : d.status==="error" ? esc(d.note||"unavailable")
      : esc(d.source||"fetching…");
    return `<div class="ck-row ${esc(d.status||"")}">${mark}
      <span class="ck-name">${esc(d.name||d.layer||"")}</span>
      <span class="ck-meta">${meta}</span></div>`;
  }).join("");
}

/* Live progress while a step runs. Steps 3 & 7 report real per-layer numbers
   from the backend; the LLM steps (2 & 4) can't, so a time-based estimate
   keeps the bar honest-ish and moving. Capped at 97% until the run returns. */
let PROG = null;
const STEP_ETA = {1:6, 2:60, 3:180, 4:60, 5:3, 6:3, 7:240, 8:4};  // seconds, typical
function mmss(s){ return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); }
function startProgress(step){
  stopProgress();
  step = step || S.current;   // the step being run — see renderCanvasLoading
  const t0 = Date.now();
  PROG = setInterval(async ()=>{
    let b = {pct:0, label:""};
    try{ b = await api(`/hcas/projects/${S.pid}/steps/${step}/progress`); }catch(_){}
    const secs = (Date.now()-t0)/1000;
    // Steps 3 and 7 report REAL per-layer progress; steps 2 and 4 are one
    // blocking model call and can report none, which is what the time estimate
    // is for. Blending the two let the estimate overtake the truth: measured
    // 2026-08-09 on a slow Overpass, the bar sat at 90% while the backend had
    // finished 1 of 6 layers — contradicting the checklist directly beneath it.
    // Where there is a real number, use it alone.
    const measured = Array.isArray(b.detail) && b.detail.length > 0;
    const est = Math.min(90, secs / (STEP_ETA[step]||10) * 90);
    const pct = Math.min(97, measured ? (b.pct||0) : Math.max(b.pct||0, est));
    const f = $("pfill");
    if(!f) return;
    f.style.width = pct+"%";
    // Elapsed time next to the percentage: a big county's OpenStreetMap query
    // legitimately takes minutes, and a bar alone cannot tell "working" from
    // "stuck" (Prof. Shi 2026-08-07). The step also stops itself — see
    // HCAS_LAYER_BUDGET_S — so this clock always ends.
    $("ppct").textContent = Math.round(pct)+"%  ·  "+mmss(secs)+" elapsed";
    if(b.label) $("plabel").textContent = b.label;
    if(b.detail) renderChecklist(b.detail);
  }, 700);
}
function stopProgress(){ if(PROG){ clearInterval(PROG); PROG = null; } }
function renderCanvas(){
  const n = S.current, row = stepRow(n), a = S.edited;
  const head = canvasHead(n);
  let body;
  const defining = n===1 && (!S.pid || S.redefining);
  if(defining) body = defineForm();
  // Coming back to a step that is still running shows its progress again. This
  // covers a re-run too, where an artifact row already exists — you pressed Run,
  // so you should see the run, not the previous result.
  else if(S.running === n) body = loadingBody(n);
  else if(!row) body = `<div class="empty"><div class="big">Nothing here yet</div>
      <div>Run this step to generate it.</div></div>`;
  else body = ({1:viewIntake,2:viewFactors,3:viewData,4:viewSolution,5:viewDatabase,
                6:viewWorkflow,7:viewExecution,8:viewReport}[n] || viewRaw)(a);
  // A stale artifact was drafted from an earlier version of an upstream step.
  // The confirm flow re-drafts it automatically, but you can also reach one by
  // clicking the rail — and on screen it is indistinguishable from a current
  // result. Say so, and offer the re-run rather than doing it behind your back
  // (any edit you made to this step is still here until you press it).
  if(row && row.status==="stale" && !defining && S.running!==n)
    body = `<div class="warnbar" style="background:var(--amber-tint);color:var(--amber)">⚠<div>
      <b>Out of date.</b> This was prepared before an earlier step changed, so it does not
      reflect the current study area. Re-run this step to bring it up to date.</div></div>` + body;
  $("canvas").innerHTML = head + body + (row && !defining && n!==8 ? rawEditor() : "");
  if(defining) loadStates();
  if(n===2 && row) wireFactors();
  if(n===7 && row) wireMapCheck();
  if(n===8 && row) wireReport();
  wireRaw();
  if(!REDUCED && $("canvas").animate)
    $("canvas").animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],
      {duration:240,easing:"cubic-bezier(.22,.68,.24,1)"});
}
function stepTag(n){
  const row = stepRow(n);
  if(n===2) return `<span class="tag">Suggested · review to continue</span>`;
  if(n===4) return `<span class="tag rag">Knowledge base</span>`;
  if(n===6) return `<span class="tag muted">Derived from metrics</span>`;
  if(n===7 && row) return `<span class="tag done">Complete</span>`;
  if(n===8) return `<span class="tag muted">Editable draft</span>`;
  return "";
}

/* step 1 — create form.
   Prof. Shi 2026-08-07: #4 a free-text location box resolved by AI, #5 a real
   areal-unit choice, #6 no Mode option (confirmation is always on), #7 no
   coordinate-system box (the system determines it). */
function defineForm(){
  return `<div class="panel form"><div class="ph">Project setup</div>
    <div class="row">
      <div class="fld"><label>Project title</label><input id="f_title" placeholder="e.g. Riverside County · Health Equity 2026"></div>
      <div class="fld"><label>Reporting unit</label><select id="f_unit"></select>
        <div class="hint">Searched for at step 3; if Census publishes none for this area, the system says so.</div></div>
    </div>
    <div class="fld" style="margin-bottom:var(--sp-4);">
      <label>Describe the location (optional)</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input id="f_where" style="flex:1;min-width:240px;"
               placeholder="e.g. 03755 · the neighborhood around Dartmouth-Hitchcock · west of Lake Champlain"
               onkeydown="if(event.key==='Enter'){event.preventDefault();resolveArea();}">
        <button class="cbtn" id="f_findbtn" onclick="resolveArea()">Find with AI</button>
      </div>
      <div class="hint" id="f_wherehint">A ZIP code, community, landmark or description — the assistant
        works out which county contains it and fills in the two boxes below, which you can always override.</div>
    </div>
    <div class="row">
      <div class="fld"><label>State</label><select id="f_state"></select></div>
      <div class="fld"><label>County (study area)</label><select id="f_county"></select></div>
    </div>
    <div class="fld"><label>Notes</label>
      <textarea id="f_tasks" placeholder="e.g. calculate a neighborhood health index; identify priority areas…"></textarea>
      <div class="hint">The study area is the entire county boundary. Run this step to create the project and locate it.</div>
    </div>
    <div class="fld"><label>Study area preview</label>
      <div class="mapview" id="f_mappreview" style="min-height:340px;">
        <div class="lab"><div class="eyebrow">Map view</div>
          <div class="mono" style="color:var(--faint);font-size:12px;margin-top:5px;">Select a county to preview its boundary.</div></div>
      </div></div>
    </div>`;
}
/* Free-text location -> county (Prof. Shi 2026-08-07 #4). The resolved county is
   written into the same two selects the analyst can edit, so the AI never picks
   a study area that is not visible and overridable on screen. */
async function resolveArea(){
  const box=$("f_where"), hint=$("f_wherehint"), btn=$("f_findbtn");
  const text=(box?.value||"").trim();
  if(!text){ hint.textContent="Type a place first — ZIP code, community, landmark…"; return; }
  btn.disabled=true; btn.textContent="Finding…";
  hint.innerHTML='<span class="spin"></span>Asking the assistant…';
  try{
    const r=await api("/hcas/resolve-area",{method:"POST",body:JSON.stringify({text})});
    if(r.resolved){
      const wb=document.getElementById('f_where'); if(wb) wb.style.borderColor="";
      $("f_state").value=r.state_fips;
      await loadCounties();
      $("f_county").value=r.county_fips;
      updateFormPreview();
      hint.innerHTML=`<b>${esc(r.county_name)}, ${esc(r.state_name)}</b> — ${esc(r.interpretation||"resolved")}`
        + (r.caveat?` <span style="color:var(--amber)">${esc(r.caveat)}</span>`:"")
        + `<br>Not right? Change the State and County boxes below.`;
    }else{
      resolveFailed(hint, r.caveat||"Could not place that.");
    }
  }catch(e){ resolveFailed(hint, e.message); }
  finally{ btn.disabled=false; btn.textContent="Find with AI"; }
}
/* A failed lookup must never be quiet. The State/County boxes keep whatever they
   were showing — which is a default nobody chose — so saying only "could not
   place that" in small grey text let a run start against the wrong county. Seen
   in the 2026-08-09 sweep: the resolver errored, the form stayed on Ohio/Adams,
   and the project was created there. */
function resolveFailed(hint, why){
  hint.innerHTML = `<span style="color:var(--red);font-weight:600;">Could not place that location.</span>`
    + ` ${esc(why)}<br><b>The State and County boxes below were not changed</b> —`
    + ` they still show <b>${esc(document.getElementById('f_state')?.selectedOptions[0]?.textContent||'')},`
    + ` ${esc(document.getElementById('f_county')?.selectedOptions[0]?.textContent||'')}</b>.`
    + ` Set them yourself, or try describing the location differently.`;
  const box = document.getElementById('f_where');
  if(box) box.style.borderColor = "var(--red)";
}

async function loadUnits(sel){
  try{
    const {units, default:def} = await api("/hcas/areal-units");
    AREAL_UNITS = units;
    const el=$("f_unit"); if(!el) return;
    el.innerHTML = units.map(u=>`<option value="${esc(u.id)}">${esc(u.label)}</option>`).join("");
    el.value = sel || def;
  }catch(e){ /* selects stay empty; create falls back to the server default */ }
}
let AREAL_UNITS = [];
function updateFormPreview(){
  const s=$("f_state"), c=$("f_county"), box=$("f_mappreview");
  if(!box || !s || !c || !s.value || !c.value) return;
  box.innerHTML = `<iframe class="mapframe" src="/hcas/basemap/${s.value}/${c.value}" title="County boundary preview"></iframe>`;
}
async function loadStates(){
  try{
    const m = S.project?.meta;           // re-defining an existing project
    const {states} = await api("/states");
    $("f_state").innerHTML = states.map(s=>`<option value="${s.state_fips}">${esc(s.state_name)}</option>`).join("");
    $("f_state").value = m?.state_fips || "39";
    await loadCounties();
    if(m?.county_fips) $("f_county").value = m.county_fips;
    if(m?.title) $("f_title").value = m.title;
    if(m?.notes) $("f_tasks").value = m.notes;
    if(m?.location_query) $("f_where").value = m.location_query;
    await loadUnits(m?.areal_unit);
    $("f_state").onchange = async ()=>{ await loadCounties(); updateFormPreview(); };
    $("f_county").onchange = updateFormPreview;
    updateFormPreview();
  }catch(e){ setMsg(e.message); }
}
async function loadCounties(){
  const {counties} = await api(`/counties/${$("f_state").value}`);
  $("f_county").innerHTML = counties.map(c=>`<option value="${c.county_fips}">${esc(c.county_name)}</option>`).join("");
}

/* step 1 — study area (live base map since 2026-07-27).
   Prof. Shi 2026-08-07 #10: FIPS codes out, descriptive Census figures in.
   Anything the Census could not give us is listed as missing with the reason,
   never filled in with a plausible number. */
function num(v, digits){ return v==null?null:(+v).toLocaleString(undefined,{maximumFractionDigits:digits==null?0:digits}); }
function viewIntake(a){
  const p = a.profile||{};
  const rows = [
    ["Place", esc(a.place_name||"—")],
    ["Total area", p.total_area_km2!=null?`${num(p.total_area_km2)} km² (land ${num(p.land_area_km2)} km²)`:null],
    ["Total population", num(p.population)],
    ["Population density", p.population_density_per_km2_of_land!=null?`${num(p.population_density_per_km2_of_land,1)} / km² of land`:null],
    ["Median household income", p.median_household_income_usd!=null?`$${num(p.median_household_income_usd)}`:null],
    ["Median home value", p.median_home_value_usd!=null?`$${num(p.median_home_value_usd)}`:null],
    ["Median age", num(p.median_age,1)],
    ["Reporting unit", esc(unitLabel(a.areal_unit))],
    ["Extent", "Entire county boundary"],
  ].filter(r=>r[1]!=null);
  const missing = Object.entries(p.unavailable||{});
  const sources = [p.source_boundary, p.source_acs, p.source_population]
    .filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i);
  return `<div class="panel"><div class="ph">Study area</div>
    <div class="cols" style="align-items:stretch;">
      <div style="flex:none;width:320px;">
        <dl class="kv">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
        ${sources.length?`<div class="subnote">Source: ${esc(sources.join(" · "))}</div>`:""}
        ${missing.length?`<div class="subnote" style="margin-top:10px;">Not available:<ul style="margin:4px 0;padding-left:16px;">
          ${missing.map(([k,v])=>`<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join("")}</ul></div>`:""}
      </div>
      <div class="mapview" style="flex:1;">${baseMapFrame()}</div>
    </div></div>`;
}
function unitLabel(id){
  const u = AREAL_UNITS.find(u=>u.id===id);
  return u ? u.label : (id||"Census tract");
}

/* step 2 — factors (editable toggles).
   The rows are the CURRENT list (checked, in order) followed by any factor from
   the AI draft the analyst has since dropped (unchecked), so a factor added by
   a revision appears and an un-checked one can be restored. */
function factorRows(a){
  const key = f => f.factor+"|"+f.metric;
  const rows = (a.factors||[]).map(f=>({f, on:true}));
  const have = new Set(rows.map(r=>key(r.f)));
  ((stepRow(2)?.ai_draft?.factors)||[]).forEach(f=>{
    if(!have.has(key(f))){ have.add(key(f)); rows.push({f, on:false}); }
  });
  return rows;
}
function viewFactors(a){
  const rows = factorRows(a);
  const items = rows.map((r,i)=>{
    const f = r.f;
    return `<label class="factor ${r.on?'':'off'}" data-i="${i}">
      <input type="checkbox" ${r.on?'checked':''} data-i="${i}">
      <div><span class="fname">${esc(f.factor)}</span><span class="metric">${esc(f.metric)}</span>
        <div class="rat">${esc(f.rationale||"")}</div></div>
    </label>`;
  }).join("");
  // Prof. Shi 2026-08-07 #11: asking for a change used to re-run the whole step
  // and return a different list in a different order. This box sends ONE
  // instruction and applies it as a diff — kept factors stay put, in order.
  return `<div class="panel"><div class="ph">Suggested factors — keep the ones that apply</div>
    ${items||'<div class="empty">No factors suggested.</div>'}
    <div class="sec" style="margin-top:14px;"><h4>Change the list</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input id="f_revise" style="flex:1;min-width:260px;font:400 var(--fs-sm) var(--sans);padding:9px 11px;border:1px solid var(--line-d);border-radius:var(--r-sm);color:var(--ink);"
               placeholder="e.g. add pollution data · drop parking"
               onkeydown="if(event.key==='Enter'){event.preventDefault();reviseFactors();}">
        <button class="cbtn" id="revisebtn" onclick="reviseFactors()">Apply change</button>
      </div>
      <div class="hint" id="revisehint">Only what you ask for changes — the factors you keep stay in place,
        in this order. Un-check a factor to drop it.</div>
    </div>
    <div class="sec" style="margin-top:14px;"><h4>Notes</h4>
      <input id="f_notes" style="width:100%;font:400 var(--fs-sm) var(--sans);padding:9px 11px;border:1px solid var(--line-d);border-radius:var(--r-sm);color:var(--ink);"
             value="${esc(a.notes||"")}"></div></div>`;
}
function wireFactors(){
  // Same row order the view just rendered, so index -> factor stays aligned.
  const base = factorRows(S.edited||{}).map(r=>r.f);
  const sync = ()=>{
    const keep=[...document.querySelectorAll('.factor input:checked')].map(c=>+c.dataset.i);
    S.edited.factors = keep.map(i=>base[i]);
    document.querySelectorAll('.factor').forEach(l=>l.classList.toggle('off',!l.querySelector('input').checked));
  };
  document.querySelectorAll('.factor input').forEach(c=>c.onchange=sync);
  const nt=$("f_notes"); if(nt) nt.oninput=()=>{ S.edited.notes=nt.value; };
}
async function reviseFactors(){
  const box=$("f_revise"), hint=$("revisehint"), btn=$("revisebtn");
  const instruction=(box?.value||"").trim();
  if(!instruction){ hint.textContent="Type what to change first."; return; }
  btn.disabled=true; hint.innerHTML='<span class="spin"></span>Applying your change…';
  try{
    const place=(stepRow(1)?.human_final||stepRow(1)?.ai_draft||{}).place_name||"the study area";
    const r=await api("/hcas/revise-factors",{method:"POST",
      body:JSON.stringify({artifact:S.edited, instruction, place})});
    S.edited=r.artifact;
    renderCanvas();
    const bits=[];
    if(r.added?.length) bits.push(`added ${r.added.map(esc).join(", ")}`);
    if(r.removed?.length) bits.push(`removed ${r.removed.map(esc).join(", ")}`);
    if(!bits.length) bits.push("no change was needed");
    $("revisehint").innerHTML = `<b>${bits.join(" · ")}.</b> `
      + (r.note?esc(r.note)+" ":"") + "Everything else kept its place.";
  }catch(e){ hint.innerHTML=`<span style="color:var(--red)">${esc(e.message)}</span>`; }
  finally{ const b=$("revisebtn"); if(b) b.disabled=false; }
}

/* ---- layer list (Prof. Shi 2026-07-27): names only, per-layer visibility
   toggle, and a right-click menu → Attribute Table / Properties beneath the
   map. Layer data is stashed so the menu can render without re-threading. ---- */
let LAYER_DATA = {};    // key -> inventory entry (or study-area block)
let STUDY_DATA = null;  // study-area block for shared extent/crs

/* Prof. Shi 2026-08-07 #12: "On the data list, always show the data sources."
   The source rides under the layer name (still no EPSG column — his 2026-07-27
   note); it stays in Properties too. */
function layerRow(key, name, o){
  o = o||{};
  const cb = (o.toggle && o.foliumLabel)
    ? `<input type="checkbox" class="lvis" checked title="Show / hide on map"
         onclick="event.stopPropagation()" onchange="toggleMapLayer('${esc(o.foliumLabel)}',this.checked)">`
    : `<span class="lvis-sp"></span>`;
  const src = o.source ? `<span class="lsrc">${esc(o.source)}</span>` : "";
  const count = (o.count!=null) ? `<span class="lsrc">· ${(+o.count).toLocaleString()} features</span>` : "";
  return `<div class="leaf lrow" oncontextmenu="return layerMenu(event,'${esc(key)}')"
       title="Right-click for Attribute Table &amp; Properties">
    ${cb}<span class="lname">${esc(name)}${o.hasError?' <span style="color:var(--red)" title="fetch error">⚠</span>':''}
      <span class="lmeta">${src}${count}</span></span>
    <button class="lkebab" onclick="layerMenu(event,'${esc(key)}')" title="Layer options">⋯</button></div>`;
}
function layerListPanel(layers, studyArea, o){
  o = o||{};
  LAYER_DATA = {}; STUDY_DATA = studyArea || null;
  let rows = "";
  if(studyArea){
    LAYER_DATA["__study__"] = studyArea;
    rows += layerRow("__study__", studyArea.name||"Study area",
      {toggle:o.toggles, foliumLabel:"Study Area", source:studyArea.source});
  }
  (layers||[]).forEach(l=>{
    LAYER_DATA[l.layer] = l;
    rows += layerRow(l.layer, l.name||l.layer, {toggle:o.toggles, foliumLabel:FOLIUM_LABEL[l.layer],
      hasError:!!l.error, source:l.source, count:l.error?null:l.feature_count});
  });
  return `<div class="grp"><div class="gname">Layers</div>${rows||'<div class="empty" style="padding:10px;">No layers.</div>'}</div>`;
}
function layerMenu(ev, key){
  ev.preventDefault(); ev.stopPropagation(); closeLayerMenu();
  const m = document.createElement("div"); m.id = "lmenu"; m.className = "lmenu";
  m.innerHTML = `<button onclick="layerInfo('attr','${esc(key)}')">Open Attribute Table</button>
    <button onclick="layerInfo('props','${esc(key)}')">Properties</button>`;
  document.body.appendChild(m);
  m.style.left = Math.min(ev.clientX, innerWidth-200)+"px";
  m.style.top  = Math.min(ev.clientY, innerHeight-90)+"px";
  // Close on the NEXT click. Deferred so this event doesn't self-close it, and
  // on `click` (not `mousedown`) so a menu item's own click still lands first.
  setTimeout(()=>document.addEventListener("click", closeLayerMenu, {once:true}), 0);
  return false;
}
function closeLayerMenu(){ const m=$("lmenu"); if(m) m.remove(); }
function kvTable(rows){
  return `<table class="data"><tbody>${rows.map(([k,v])=>
    `<tr><td style="font-family:var(--mono);color:var(--faint);white-space:nowrap;">${esc(k)}</td><td>${esc(v)}</td></tr>`
  ).join("")}</tbody></table>`;
}
function layerInfo(kind, key){
  closeLayerMenu();
  const box = $("layerinfo"); if(!box) return;
  const d = LAYER_DATA[key]; if(!d){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="panel">${kind==="attr" ? attrTableHtml(key,d) : propsHtml(key,d)}
    <div style="margin-top:8px;"><button class="cbtn" style="padding:5px 11px;font-size:var(--fs-xs)" onclick="$('layerinfo').innerHTML=''">Close ✕</button></div></div>`;
  box.scrollIntoView({behavior:REDUCED?"auto":"smooth", block:"nearest"});
}
function attrTableHtml(key,d){
  let rows, note="";
  if(key==="__study__"){
    rows = [["FIPS", d.fips||"—"], ["Name", d.name||"Study area"]];
    if(d.area_km2!=null)   rows.push(["Area (km²)", (+d.area_km2).toLocaleString()]);
    if(d.population!=null)  rows.push(["Population", (+d.population).toLocaleString()]);
    if(d.radius_m!=null)    rows.push(["Radius (m)", d.radius_m]);
  } else {
    rows = [["Layer", d.name||d.layer],
            ["Feature count", d.feature_count!=null?(+d.feature_count).toLocaleString():"—"],
            ["Geometry type", d.geom_type||"vector"]];
    if(d.error) rows.push(["Fetch status", d.error]);
    note = `<div class="subnote">Per-feature attributes (individual polygons) aren't stored in the audit record; the analysis map (step 7) draws every feature.</div>`;
  }
  return `<div class="ph">Attribute table · ${esc(d.name||d.layer||"layer")}</div>${kvTable(rows)}${note}`;
}
function propsHtml(key,d){
  const ext = key==="__study__" ? d.extent_4326 : (STUDY_DATA && STUDY_DATA.extent_4326);
  const rows = [
    ["Source / origin", d.source||"—"],
    ["Coordinate system", d.crs||"EPSG:5070"],
    ["Geometry type", d.geom_type||"vector"],
    ["Spatial extent (WGS84)", (ext&&ext.length===4) ? ext.map(x=>(+x).toFixed(3)).join(", ") : "—"],
  ];
  if(key!=="__study__") rows.push(["Feature count", d.feature_count!=null?(+d.feature_count).toLocaleString():"—"]);
  if(d.area_km2!=null)  rows.push(["Area (km²)", (+d.area_km2).toLocaleString()]);
  rows.push(["Cell size / resolution", "— (vector layer)"]);
  return `<div class="ph">Properties · ${esc(d.name||d.layer||"layer")}</div>${kvTable(rows)}`;
}
/* Drive the map's own layer control from the left list. The folium map is a
   nested srcdoc iframe (same origin), so we click the matching overlay input. */
function toggleMapLayer(label, visible){
  const f = document.querySelector(".mapframe"); if(!f) return;
  try{
    const outer = f.contentWindow;
    const inner = outer.document.querySelector("iframe");
    const doc = (inner && inner.contentWindow.document) || outer.document;
    for(const lb of doc.querySelectorAll(".leaflet-control-layers-overlays label")){
      if(lb.textContent.trim() === label){
        const cb = lb.querySelector('input[type=checkbox]');
        if(cb && cb.checked !== visible) cb.click();
        return;
      }
    }
  }catch(_){}
}

/* step 3 — data */
function viewData(a){
  const list = layerListPanel(a.layers||[], a.study_area, {toggles:false});
  const ho = a.health_outcomes||{};
  const errs = (a.layers||[]).filter(l=>l.error);
  const warn = errs.length?`<div class="warnbar">⚠<div><b>${errs.length} data source${errs.length>1?"s":""} could not be reached</b> —
    the flagged layers are empty. Any metric that needs one is reported as <i>not measured</i> rather than as zero,
    and no recommendation is derived from it. ${esc(errs[0].error)}
    <br><b>Re-running is cheap</b> — every layer that already arrived is cached and returns instantly, so each attempt gets further. You can also confirm and continue with what you have.</div></div>`:"";
  const rows = (ho.measures||[]).map(m=>{
    const flag = m.county_pct>m.us_pct ? '<span class="above">above US</span>' : '<span class="below">below US</span>';
    return `<tr><td>${esc(m.label)}</td><td>${m.county_pct}% ${flag}</td><td>${m.us_pct}%</td></tr>`;
  }).join("");
  // Prof. Shi 2026-08-07 #5: report the outcome of the reporting-unit search,
  // whether or not the data exists.
  // Stale-mirror warning: the layers arrived, but they are old. Amber, above
  // everything, because every figure downstream inherits the age.
  const stale = a.data_freshness_warning
    ? `<div class="warnbar" style="background:var(--amber-tint);color:var(--amber)">⚠<div>
        <b>These map features are out of date.</b> ${esc(a.data_freshness_warning)}</div></div>` : "";
  const au = a.areal_unit;
  const unitbar = au ? `<div class="warnbar" style="${au.available
      ? "background:var(--ok-tint);color:var(--ok)" : "background:var(--amber-tint);color:var(--amber)"}">
      ${au.available?"✓":"⚠"}<div><b>Reporting unit — ${esc(au.label||au.unit)}:</b> ${esc(au.note||"")}</div></div>` : "";
  // Prof. Shi's layout: layers left · map upper-right · tables beneath the map
  return `${stale}${warn}${unitbar}<div class="cols" style="align-items:stretch;flex-wrap:nowrap;">
    <div class="panel tree" style="width:280px;flex:none;"><div class="ph">Data layers</div>${list}
      <div class="subnote">Right-click a layer for its attribute table &amp; properties.</div></div>
    <div class="stack" style="flex:1;">
      <div class="panel"><div class="ph">Study area map</div>
        <div class="mapview">${baseMapFrame()}</div></div>
      <div id="layerinfo"></div>
      <div class="panel"><div class="ph">${esc(ho.source||"Health outcomes")}</div>
        ${rows?`<table class="data"><thead><tr><th>Measure</th><th>County</th><th>US</th></tr></thead><tbody>${rows}</tbody></table>`
              :`<div class="empty" style="padding:14px;">${esc(ho.note||"No outcomes this run.")}</div>`}</div>
    </div></div>`;
}

/* step 4 — methodology */
function viewSolution(a){

/* step 5 — database */
function viewDatabase(a){
  const list = layerListPanel(a.layers||[], a.study_area_detail, {toggles:false});
  // Prof. Shi's map-step layout: layers left · map upper-right · details beneath
  return `<div class="cols" style="align-items:stretch;flex-wrap:nowrap;">
    <div class="panel tree" style="width:280px;flex:none;"><div class="ph">Database layers</div>${list}
      <div class="subnote">Right-click a layer for its attribute table &amp; properties.</div></div>

      <div class="panel"><div class="ph">Study area map</div>

/* step 6 — workflow */
function viewWorkflow(a){
  const steps = (a.steps||[]).map((s,i)=>{
    const lbl = s.action==="compute" ? `compute <b>${esc(s.metric)}</b>`
      : s.action==="generate_interventions" ? "generate interventions"
      : s.action==="assemble_report" ? "assemble report" : esc(s.action);
    return `<li><span class="n">${i+1}</span><span>${lbl}${s.layers?` · ${esc((s.layers||[]).join(", "))}`:""}</span></li>`;
  }).join("");
  return `<div class="panel"><div class="ph">Workflow</div>
    <ul class="flow">${steps||"<li>—</li>"}</ul></div>`;
}

/* step 7 — analysis results */
function viewExecution(a){
  // null = the layer this metric needs failed to fetch. Never render it as a
  // number; "not measured" and 0 are different claims about a community.
  const metrics = Object.entries(a.metrics||{}).map(([k,v])=>`
    <div class="metric-c"><div class="mn">${esc(k)}</div>
      <div class="mv"${v===null||v===undefined?' style="color:var(--warn,#dd6b20);font-style:italic;font-size:12px;"':''}>${
        v===null||v===undefined?"not measured"
        :typeof v==="number"?(+v).toLocaleString(undefined,{maximumFractionDigits:3}):esc(v)}</div></div>`).join("");
  const ivs = (a.interventions||[]).map(iv=>`
    <div class="iv ${esc(iv.severity||"")}"><span class="sev">${esc(iv.severity||"")}</span>
      <div class="cat">${esc(iv.category)}</div>
      <div class="fin">${esc(iv.finding)}</div>
      <div class="fin"><b>→</b> ${esc(iv.recommendation)} <span style="color:var(--ghost)">(${esc(iv.standard||"")})</span></div></div>`).join("");
  const errs = a.fetch_errors||{};
  const errKeys = Object.keys(errs);
  const warn = errKeys.length?`<div class="warnbar">⚠<div><b>Data sources failed during this run:</b> ${errKeys.map(esc).join(", ")} — ${esc(errs[errKeys[0]])}</div></div>`:"";
  const note = a.map_note?`<div class="warnbar">⚠<div>${esc(a.map_note)}</div></div>`:"";

  // no map layer, so it shows without a toggle.
  const s3 = stepRow(3);
  const inv = s3 ? (s3.human_final||s3.ai_draft||{}) : {};
  const list = layerListPanel(inv.layers||[], inv.study_area, {toggles:!!a.map_available});
  // Prof. Shi's layout: layer list left · map upper-right · metrics + recs beneath
  return `${warn}${note}${unmeasured}<div class="cols" style="align-items:stretch;flex-wrap:nowrap;">
    <div class="panel tree" style="width:280px;flex:none;"><div class="ph">Layers</div>${list}
      <div class="subnote">Toggle a layer's checkbox to show/hide it; right-click for attributes &amp; properties.</div></div>
    <div class="stack" style="flex:1;">

        <div class="mapview">${map}</div></div>

}

/* Per-unit table (Prof. Shi 2026-08-07 #5). Always renders something: either the
   rows or the stated reason there are none, so an absent table never has to be
   guessed at. */
function byUnitPanel(bu){
  if(!bu) return "";
  const rows = bu.rows||[];
  const head = `<div class="ph">By ${esc((bu.label||bu.unit||"unit").toLowerCase())}${
    rows.length?` · ${rows.length} ${rows.length===1?"area":"areas"}`:""}</div>`;
  if(!rows.length)
    return `<div class="panel">${head}<div class="empty" style="padding:14px;">${esc(bu.note||"Not tabulated.")}</div></div>`;
  // Column set = union of the metric keys actually present, in first-row order.
  const cols = [];
  rows.forEach(r=>Object.keys(r.metrics||{}).forEach(k=>{ if(!cols.includes(k)) cols.push(k); }));
  const fmt = v => v==null ? '<span style="color:var(--faint)">—</span>'
    : (typeof v==="number" ? (+v).toLocaleString(undefined,{maximumFractionDigits:3}) : esc(v));
  const body = rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${(+r.area_km2).toLocaleString(undefined,{maximumFractionDigits:2})}</td>${
    cols.map(c=>`<td>${fmt((r.metrics||{})[c])}</td>`).join("")}</tr>`).join("");
  return `<div class="panel">${head}
    ${bu.note?`<div class="subnote" style="margin-bottom:8px;">${esc(bu.note)}</div>`:""}
    <div style="overflow-x:auto;max-height:340px;overflow-y:auto;">
      <table class="data"><thead><tr><th>${esc(bu.label||"Unit")}</th><th>km²</th>${
        cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="subnote">Computed with the same metric code as the county figures, clipped to each
      boundary. Source: ${esc(bu.source||"US Census TIGERweb")}.</div></div>`;
}

/* The embedded map is same-origin, so we can see inside it: if its document
   finished loading but Leaflet (global L) never appeared, the drawing library's
   CDN is blocked — data is fine, the browser just can't draw. Say so. */
function wireMapCheck(){
  const f = document.querySelector(".mapframe");
  if(!f) return;
  const check = ()=>{
    try{
      // folium wraps the map in a nested srcdoc iframe — Leaflet lives there
      const outer = f.contentWindow;
      if(!outer || !outer.document || outer.document.readyState === "loading") return;
      const inner = outer.document.querySelector("iframe");
      const w = (inner && inner.contentWindow) || outer;
      if(!w.document || w.document.readyState === "loading") return;
      if(typeof w.L !== "undefined" || $("mapcdnwarn")) return;
      f.closest(".stack").insertAdjacentHTML("afterbegin",
        `<div class="warnbar" id="mapcdnwarn">⚠<div><b>The map data loaded but the map cannot draw</b> —
         the browser could not download the map-drawing library from its content network
         (cdn.jsdelivr.net appears blocked). The metrics and report are unaffected.</div></div>`);
    }catch(_){}
  };
  f.addEventListener("load", ()=>setTimeout(check, 4000));
  setTimeout(check, 15000);
}

/* Reads the definition form. Creates the project, or — when the analyst came
   back to re-define it (Prof. Shi 2026-08-07 #8) — updates it in place, which
   marks everything drafted from the old scope stale. */
async function ensureProject(){
  const form={ title:($("f_title").value||"Untitled assessment"),
               state_fips:$("f_state").value, county_fips:$("f_county").value,
               areal_unit:($("f_unit")?.value||null),
               location_query:($("f_where")?.value||""), notes:($("f_tasks")?.value||"") };
  if(S.pid){
    if(S.redefining){
      await api(`/hcas/projects/${S.pid}`,{method:"PATCH",body:JSON.stringify(form)});
      S.redefining=false;
    }
    return;
  }
  // gate_mode is always "gated": Prof. Shi 2026-08-07 #6 removed the choice —
  // "always do the user-confirmation". The auto arm stays available to the
  // research ablation through the API, not through the wizard.
  S.pid=(await api("/hcas/projects",{method:"POST",
        body:JSON.stringify({...form, gate_mode:"gated"})})).project_id;
  try{ localStorage.setItem("hcas_last_project", S.pid); }catch(_){}
}
async function refresh(keep){
  S.project=await api(`/hcas/projects/${S.pid}`);
  // `keep` means a run just finished; if the user has since moved to a different
  // step, adopt THAT step's artifact rather than leaving the finished one in the
  // editor under the wrong heading.
  if(keep && !S.edited){ const r=stepRow(S.current); if(r) S.edited=JSON.parse(JSON.stringify(r.human_final??r.ai_draft)); }
  if(!keep){ const row=stepRow(S.current); S.edited=row?JSON.parse(JSON.stringify(row.human_final??row.ai_draft)):null; }
  renderRail(); renderBar(); renderCanvas(); renderChat(); renderCmd();
}
// Keep a freshly-drafted step in local project state so navigating away and
// back restores it even if the server refresh below fails (e.g. a transient
// error or rate-limit). Without this, a failed GET /projects left S.project
// stale and the step re-rendered as "Nothing here yet".
function upsertLocalDraft(n, draft){
  if(!S.project || !Array.isArray(S.project.steps)) S.project = {...(S.project||{}), steps: []};
  let row = S.project.steps.find(s=>s.step===n);
  if(!row){ row={step:n}; S.project.steps.push(row); S.project.steps.sort((a,b)=>a.step-b.step); }
  if(row.status!=="confirmed"){ row.status="drafted"; row.ai_draft=draft; }
}
async function runStep(){
  if(S.busy) return;
  // Pin the step being run. Everything after the await used to read S.current,
  // which the user can change by clicking another step mid-run — so a finished
  // draft could be written onto whatever step they had navigated to, and then
  // confirmed as that step's artifact.
  const step = S.current;
  S.running = step;
  setBusy(true); setMsg(""); statusRun("Running…");
  let failed = null;
  try{
    if(step===1 && (!S.pid || S.redefining))
      await ensureProject();  // reads the definition form — before it is replaced
    if(S.current===step) renderCanvasLoading(step);  // only if that step is still on screen
    startProgress(step);
    const {ai_draft}=await api(`/hcas/projects/${S.pid}/steps/${step}/run`,{method:"POST"});
    S.running=null;                          // the run is over; re-renders show the result now
    upsertLocalDraft(step, ai_draft);        // survive a failed refresh so nav restores it
    if(S.current===step){                    // only touch the editor if it is still on screen
      S.edited=JSON.parse(JSON.stringify(ai_draft));
      S.draftShownAt=Date.now();
    }
    try{ await refresh(true); }
    catch(_){ renderRail(); renderBar(); renderCanvas(); renderCmd(); }
  }catch(e){ failed = e; }
  finally{
    // Order matters. The failure path used to re-render while S.running was
    // still set, so renderCanvas drew the loading body again — and nothing
    // re-rendered after the flag was cleared, leaving the spinner turning
    // forever on a run that had already failed. And statusRun("") writes to the
    // same element as setMsg, so clearing the "Running…" indicator here erased
    // the only report of what went wrong. Clear the flag first, then render,
    // and never clear the line on a failure.
    S.running=null; stopProgress(); setBusy(false);
    if(failed){ setMsg(failed.message); renderCanvas(); }
    else statusRun("");
  }
}
async function confirmStep(){
  const row=stepRow(S.current);
  if(!row||S.busy) return;
  setBusy(true); setMsg("");
  let autorun=false;
  try{
    const edit_seconds=S.draftShownAt?(Date.now()-S.draftShownAt)/1000:null;
    await api(`/hcas/projects/${S.pid}/steps/${S.current}/confirm`,
      {method:"POST",body:JSON.stringify({human_final:S.edited,edit_seconds})});
    if(S.current<8) S.current+=1;
    S.draftShownAt=null;
    await refresh();
    // Prof. Shi: confirming should flow straight into drafting the next step,
    // not land on an empty canvas waiting for a Run click. The human still
    // confirms every step, so the gate is intact.
    // A *stale* row counts as nothing to show. Confirming this step just
    // invalidated every step below it (the backend flags them), so whatever is
    // sitting on the next canvas was computed from a scope that no longer
    // holds — landing on it is worse than landing on an empty page, because it
    // looks like a current result. Draft it again instead.
    const nextRow = stepRow(S.current);
    autorun = !nextRow || nextRow.status === "stale";
  }catch(e){ setMsg("Confirm failed: "+e.message); }
  finally{ setBusy(false); }
  if(autorun) await runStep();
}
function prevStep(){
  // On step 1's result page, Back re-opens the definition form for the SAME
  // project (Prof. Shi 2026-08-07 #8) rather than stepping to a step 0.
  if(S.current===1){
    if(!stepRow(1)) return;
    S.redefining=true; setMsg("");
    renderCanvas(); renderCmd();
    return;
  }
  selectStep(S.current-1);
}

/* A run keeps going on the SERVER even if the browser goes away — but S.running
   is browser state, so reopening a project mid-run used to show "Nothing here
   yet" over work that was actively happening, and the step only appeared once
   you happened to reload again after it finished. Ask the server whether the
   step is in flight and, if so, re-attach: draw its live progress and pick the
   result up when it lands. */
async function isStepRunning(n){
  try{
    const b = await api(`/hcas/projects/${S.pid}/steps/${n}/progress`);
    return (b.pct||0) > 0 || (Array.isArray(b.detail) && b.detail.length > 0);
  }catch(_){ return false; }
}
async function adoptRunningStep(n){
  if(stepRow(n) || S.running !== null) return false;
  if(!await isStepRunning(n)) return false;
  S.running = n; setBusy(true); statusRun("Running…");
  if(S.current === n) renderCanvasLoading(n);
  startProgress(n);
  // The server clears a step's progress when the run ends — that is the signal.
  const watch = setInterval(async ()=>{
    if(S.running !== n){ clearInterval(watch); return; }
    if(await isStepRunning(n)) return;
    clearInterval(watch);
    S.running = null; stopProgress(); setBusy(false); statusRun("");
    try{ await refresh(); }catch(_){ renderCanvas(); }
  }, 2000);
  return true;
}
async function doOpen(id){
  id = (typeof id === "string" && id) ? id : ($("m_pid")?.value||"").trim();
  if(!id) return;
  try{
    S.pid=id; S.redefining=false; await refresh();
    localStorage.setItem("hcas_last_project", id);
    // Land on the furthest step that exists, not back at step 1.
    const steps=(S.project?.steps||[]).map(s=>s.step);
    const furthest = steps.length?Math.max(...steps):1;
    // A step that is mid-run has no artifact row yet, so it is not in `steps` —
    // land on IT rather than on the finished step before it.
    const running = (furthest < 8 && await isStepRunning(furthest+1)) ? furthest+1 : furthest;
    selectStep(running);
    closeModal();
    adoptRunningStep(running);
  }
  catch(e){
    S.pid=null;
    const box=$("m_list")||$("m_pid");
    if(box) box.insertAdjacentHTML("afterend",`<p style="color:var(--red)">${esc(e.message)}</p>`);
  }
}

    <div class="acts"><button class="cbtn next" onclick="closeModal()">Close</button></div>`);
}

/* ================= helpers ================= */
function setBusy(b){ S.busy=b; renderCmd(); }
function statusRun(t){ $("msgline").innerHTML = t?`<span class="spin"></span>${esc(t)}`:""; $("msgline").style.color=t?"var(--muted)":"var(--red)"; }
function setMsg(t){ $("msgline").textContent=t; $("msgline").style.color="var(--red)"; }
function modal(html){ $("modal").innerHTML=html; $("veil").classList.add("show");
  const f=$("modal").querySelector("input,textarea"); if(f) setTimeout(()=>f.focus(),30); }
function closeModal(){ $("veil").classList.remove("show"); }
$("veil").onclick=e=>{ if(e.target===$("veil")) closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("veil").classList.contains("show")) closeModal(); });
function dl(text,name,type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }

function mdToHtml(md){
  const lines=String(md||"").split(/\r?\n/); let out=[],i=0;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
  while(i<lines.length){
    let l=lines[i];
    if(/^###\s/.test(l)){ out.push("<h3>"+inl(l.replace(/^###\s/,""))+"</h3>"); i++; continue; }
    if(/^##\s/.test(l)){ out.push("<h2>"+inl(l.replace(/^##\s/,""))+"</h2>"); i++; continue; }
    if(/^#\s/.test(l)){ out.push("<h1>"+inl(l.replace(/^#\s/,""))+"</h1>"); i++; continue; }
    if(/^---+\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^\|/.test(l)){
      const tbl=[]; while(i<lines.length && /^\|/.test(lines[i])){ tbl.push(lines[i]); i++; }
      const rows=tbl.filter(r=>!/^\|[\s:|-]+\|?\s*$/.test(r));
      out.push("<table>"+rows.map((r,ri)=>{ const cells=r.split("|").slice(1,-1);
        const tag=ri===0?"th":"td"; return "<tr>"+cells.map(c=>`<${tag}>${inl(c.trim())}</${tag}>`).join("")+"</tr>";
      }).join("")+"</table>"); continue;
    }
    if(/^[-*]\s/.test(l)){ const items=[]; while(i<lines.length && /^[-*]\s/.test(lines[i])){ items.push("<li>"+inl(lines[i].replace(/^[-*]\s/,""))+"</li>"); i++; }
      out.push("<ul>"+items.join("")+"</ul>"); continue; }
    if(l.trim()===""){ i++; continue; }
    out.push("<p>"+inl(l)+"</p>"); i++;
  }
  return out.join("");
}

/* ============ resizable assistant panel (Prof. Shi request) ============ */
(function(){
  const bar=$("dragbar"), chat=$("chat");
  const saved=+localStorage.getItem("hcas_chatw");
  if(saved>=240&&saved<=560) chat.style.width=saved+"px";
  let drag=null;
  bar.addEventListener("mousedown",e=>{
    drag={x:e.clientX,w:chat.offsetWidth}; bar.classList.add("on");
    document.body.style.userSelect="none";
    document.querySelectorAll("iframe").forEach(f=>f.style.pointerEvents="none");
    e.preventDefault();
  });
  window.addEventListener("mousemove",e=>{
    if(!drag) return;
    chat.style.width=Math.min(560,Math.max(240,drag.w+(drag.x-e.clientX)))+"px";
  });
  window.addEventListener("mouseup",()=>{
    if(!drag) return;
    localStorage.setItem("hcas_chatw",chat.offsetWidth); drag=null;
    bar.classList.remove("on");
    document.body.style.userSelect="";
    document.querySelectorAll("iframe").forEach(f=>f.style.pointerEvents="");
  });
})();

/* Offer to pick up the last project. Closing the tab never lost work — every
   confirmed step is on disk — but you had to know the 12-character id to get
   back in, so in practice an accidental close did lose it. */
(async function offerResume(){
  let last;
  try{ last = localStorage.getItem("hcas_last_project"); }catch(_){ return; }
  if(!last) return;
  try{
    const p = await api(`/hcas/projects/${last}`);
    const done = (p.steps||[]).filter(s=>s.status==="confirmed").length;
    const bar = document.createElement("div");
    bar.id = "resumebar";
    bar.style.cssText = "display:flex;align-items:center;gap:10px;padding:8px var(--sp-5);"
      + "background:var(--teal-tint);border-bottom:1px solid var(--line);font-size:var(--fs-sm);";
    bar.innerHTML = `<span>Pick up where you left off — <b>${esc(p.meta.title||"your last project")}</b>`
      + ` (${done}/8 steps confirmed)</span>`
      + `<button class="cbtn next" style="padding:4px 12px;" id="resumebtn">Resume</button>`
      + `<button class="cbtn" style="padding:4px 10px;" id="dismissresume">Not now</button>`;
    $("pbar").insertAdjacentElement("afterend", bar);
    $("resumebtn").onclick = ()=>{ bar.remove(); doOpen(last); };
    $("dismissresume").onclick = ()=>{ bar.remove(); try{ localStorage.removeItem("hcas_last_project"); }catch(_){} };
  }catch(_){ /* project deleted or server restarted with a fresh db: stay quiet */ }
})();
</script>
