<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoAssess</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6f8; color: #1a1a2e; min-height: 100vh; }

    header { background: #1a1a2e; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.5px; }
    header span { font-size: 0.8rem; color: #a0aec0; }

    .container { display: flex; height: calc(100vh - 56px); }

    .sidebar { width: 320px; flex-shrink: 0; background: white; border-right: 1px solid #e2e8f0; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

    .sidebar h2 { font-size: 0.9rem; font-weight: 600; color: #4a5568; text-transform: uppercase; letter-spacing: 0.8px; }

    label { display: block; font-size: 0.85rem; color: #4a5568; margin-bottom: 4px; font-weight: 500; }
    select, input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.9rem; background: white; }
    select:focus, input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 2px rgba(66,153,225,0.2); }

    .field { display: flex; flex-direction: column; gap: 4px; }

    .bbox-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn { width: 100%; padding: 10px; background: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: #2c5282; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .metrics { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; font-size: 0.85rem; }
    .metrics .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #edf2f7; }
    .metrics .row:last-child { border-bottom: none; }
    .metrics .label { color: #718096; }
    .metrics .value { font-weight: 600; color: #2d3748; }

    .status { font-size: 0.82rem; color: #718096; text-align: center; }
    .status.error { color: #e53e3e; }

    .map-area { flex: 1; position: relative; }
    .map-area iframe { width: 100%; height: 100%; border: none; }
    .map-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #a0aec0; font-size: 1rem; flex-direction: column; gap: 8px; }
    .map-placeholder svg { opacity: 0.3; }

    .divider { border: none; border-top: 1px solid #e2e8f0; }

    .optional-label { font-size: 0.75rem; color: #a0aec0; font-weight: 400; margin-left: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>GeoAssess</h1>
    <span>Sub-tract urban assessment</span>
  </header>

  <div class="container">
    <div class="sidebar">
      <h2>Study Area</h2>

      <div class="field">
        <label for="state-select">State</label>
        <select id="state-select">
          <option value="">Loading states…</option>
        </select>
      </div>

      <div class="field">
        <label for="county-select">County</label>
        <select id="county-select" disabled>
          <option value="">Select a state first</option>
        </select>
      </div>

      <hr class="divider" />

      <div>
        <label>Custom BBox <span class="optional-label">(optional — overrides county)</span></label>
        <div class="bbox-row" style="margin-top:6px">
          <div class="field"><label>West</label><input type="number" id="bbox-west" step="any" placeholder="-83.1" /></div>
          <div class="field"><label>East</label><input type="number" id="bbox-east" step="any" placeholder="-83.0" /></div>
          <div class="field"><label>South</label><input type="number" id="bbox-south" step="any" placeholder="39.9" /></div>
          <div class="field"><label>North</label><input type="number" id="bbox-north" step="any" placeholder="40.0" /></div>
        </div>
      </div>

      <button class="btn" id="run-btn" onclick="runAssess()">Run Assessment</button>

      <div class="status" id="status-msg"></div>

      <hr class="divider" />

      <h2>Metrics</h2>
      <div class="metrics" id="metrics-panel">
        <div class="row"><span class="label">Building coverage</span><span class="value" id="m-bldg">—</span></div>
        <div class="row"><span class="label">Greenspace coverage</span><span class="value" id="m-green">—</span></div>
        <div class="row"><span class="label">Greenspace area</span><span class="value" id="m-green-area">—</span></div>
        <div class="row"><span class="label">Road density</span><span class="value" id="m-road">—</span></div>
      </div>
    </div>

    <div class="map-area" id="map-area">
      <div class="map-placeholder" id="map-placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 16l4.553-2.276A1 1 0 0021 19.382V8.618a1 1 0 00-.553-.894L15 5m0 18V5M9 7l6-2"/>
        </svg>
        <span>Run an assessment to see the map</span>
      </div>
    </div>
  </div>

  <script>
    async function loadStates() {
      const sel = document.getElementById("state-select");
      try {
        const res = await fetch("/states");
        const data = await res.json();
        sel.innerHTML = '<option value="">Select a state…</option>';
        data.states.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.state_fips;
          opt.textContent = s.state_name;
          sel.appendChild(opt);
        });
      } catch {
        sel.innerHTML = '<option value="">Failed to load states</option>';
      }
    }

    document.getElementById("state-select").addEventListener("change", async function () {
      const countySel = document.getElementById("county-select");
      if (!this.value) { countySel.disabled = true; countySel.innerHTML = '<option value="">Select a state first</option>'; return; }
      countySel.disabled = true;
      countySel.innerHTML = '<option value="">Loading…</option>';
      try {
        const res = await fetch(`/counties/${this.value}`);
        const data = await res.json();
        countySel.innerHTML = '<option value="">Select a county…</option>';
        data.counties.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.county_fips;
          opt.textContent = c.county_name;
          countySel.appendChild(opt);
        });
        countySel.disabled = false;
      } catch {
        countySel.innerHTML = '<option value="">Failed to load counties</option>';
      }
    });

    async function runAssess() {
      const btn = document.getElementById("run-btn");
      const status = document.getElementById("status-msg");
      const stateFips = document.getElementById("state-select").value;
      const countyFips = document.getElementById("county-select").value;
      const west = document.getElementById("bbox-west").value;
      const south = document.getElementById("bbox-south").value;
      const east = document.getElementById("bbox-east").value;
      const north = document.getElementById("bbox-north").value;

      const hasBbox = west && south && east && north;
      if (!stateFips || (!countyFips && !hasBbox)) {
        status.textContent = "Select a state and county (or enter a custom bbox).";
        status.className = "status error";
        return;
      }

      btn.disabled = true;
      status.textContent = "Fetching OSM data…";
      status.className = "status";

      const payload = { state_fips: stateFips, county_fips: countyFips || "000" };
      if (hasBbox) payload.bbox = [parseFloat(west), parseFloat(south), parseFloat(east), parseFloat(north)];

      try {
        const res = await fetch("/assess", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Requested-With": "geoai" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || `HTTP ${res.status}`);
        }
        const data = await res.json();

        document.getElementById("m-bldg").textContent = (data.metrics.building_coverage_ratio * 100).toFixed(1) + "%";
        document.getElementById("m-green").textContent = (data.metrics.greenspace_coverage_ratio * 100).toFixed(1) + "%";
        document.getElementById("m-green-area").textContent = (data.metrics.greenspace_area_m2 / 1e4).toFixed(1) + " ha";
        document.getElementById("m-road").textContent = data.metrics.road_density_km_per_km2.toFixed(2) + " km/km²";

        const mapArea = document.getElementById("map-area");
        document.getElementById("map-placeholder")?.remove();
        let iframe = document.getElementById("assess-iframe");
        if (!iframe) {
          iframe = document.createElement("iframe");
          iframe.id = "assess-iframe";
          mapArea.appendChild(iframe);
        }
        iframe.srcdoc = data.map_html;
        status.textContent = `Assessment complete — ${data.study_area_display}`;
        status.className = "status";
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.className = "status error";
      } finally {
        btn.disabled = false;
      }
    }

    loadStates();
  </script>
</body>
</html>
