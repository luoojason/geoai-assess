<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoAssess</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6f8; color: #1a1a2e; min-height: 100vh; }

    header { background: #1a1a2e; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.5px; }
    header span { font-size: 0.8rem; color: #a0aec0; }

    .container { display: flex; height: calc(100vh - 56px); }

    .sidebar { width: 320px; flex-shrink: 0; background: white; border-right: 1px solid #e2e8f0; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

    .sidebar h2 { font-size: 0.9rem; font-weight: 600; color: #4a5568; text-transform: uppercase; letter-spacing: 0.8px; }

    label { display: block; font-size: 0.85rem; color: #4a5568; margin-bottom: 4px; font-weight: 500; }
    select, input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.9rem; background: white; }
    select:focus, input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 2px rgba(66,153,225,0.2); }

    .field { display: flex; flex-direction: column; gap: 4px; }

    .bbox-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn { width: 100%; padding: 10px; background: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: #2c5282; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .metrics { background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; font-size: 0.85rem; }
    .metrics .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #edf2f7; }
    .metrics .row:last-child { border-bottom: none; }
    .metrics .label { color: #718096; }
    .metrics .value { font-weight: 600; color: #2d3748; }

    .status { font-size: 0.82rem; color: #718096; text-align: center; }
    .status.error { color: #e53e3e; }

    .map-area { flex: 1; position: relative; }
    .map-area iframe { width: 100%; height: 100%; border: none; }
    .map-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #a0aec0; font-size: 1rem; flex-direction: column; gap: 8px; }
    .map-placeholder svg { opacity: 0.3; }

    .divider { border: none; border-top: 1px solid #e2e8f0; }

    .optional-label { font-size: 0.75rem; color: #a0aec0; font-weight: 400; margin-left: 4px; }

    .interventions { display: flex; flex-direction: column; gap: 8px; }
    .intervention-card { border-radius: 6px; padding: 10px 12px; font-size: 0.82rem; border-left: 3px solid; }
    .intervention-card.high { background: #fff5f5; border-color: #e53e3e; }
    .intervention-card.medium { background: #fffbeb; border-color: #d97706; }
    .intervention-card.low { background: #ebf8ff; border-color: #3182ce; }
    .intervention-card .card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .intervention-card .badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; }
    .badge.high { background: #e53e3e; color: white; }
    .badge.medium { background: #d97706; color: white; }
    .badge.low { background: #3182ce; color: white; }
    .intervention-card .category { font-weight: 600; color: #2d3748; }
    .intervention-card .finding { color: #4a5568; margin-bottom: 4px; }
    .intervention-card .rec { color: #2d3748; }
    .intervention-card .std { font-size: 0.75rem; color: #718096; margin-top: 4px; font-style: italic; }
    .interventions-ok { font-size: 0.85rem; color: #38a169; font-weight: 500; text-align: center; padding: 8px; }

    .refs-toggle { font-size: 0.75rem; color: #4299e1; cursor: pointer; background: none; border: none; padding: 4px 0 0; text-align: left; }
    .refs-toggle:hover { text-decoration: underline; }
    .refs-list { display: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid #e2e8f0; }
    .refs-list.open { display: block; }
    .ref-item { font-size: 0.74rem; color: #718096; margin-bottom: 4px; }
    .ref-item strong { color: #4a5568; }

    .btn-secondary { width: 100%; padding: 8px; background: #fff; color: #2b6cb0; border: 1.5px solid #2b6cb0; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.15s; margin-top: 6px; }
    .btn-secondary:hover { background: #ebf8ff; }

    .compare-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #4a5568; cursor: pointer; }
    .compare-toggle input[type=checkbox] { width: auto; }
    .compare-section { display: none; padding: 10px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; }
    .compare-section.visible { display: block; }
    .compare-section h3 { font-size: 0.78rem; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }

    .compare-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px; }
    .compare-table th { background: #edf2f7; padding: 5px 8px; text-align: left; font-weight: 600; color: #4a5568; }
    .compare-table td { padding: 4px 8px; border-bottom: 1px solid #e2e8f0; }
    .compare-table .diff-pos { color: #38a169; }
    .compare-table .diff-neg { color: #e53e3e; }
    .compare-result { margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>GeoAssess</h1>
    <span>Sub-tract urban assessment</span>
  </header>

  <div class="container">
    <div class="sidebar">
      <h2>Study Area</h2>

      <div class="field">
        <label for="state-select">State</label>
        <select id="state-select">
          <option value="">Loading states…</option>
        </select>
      </div>

      <div class="field">
        <label for="county-select">County</label>
        <select id="county-select" disabled>
          <option value="">Select a state first</option>
        </select>
      </div>

      <hr class="divider" />

      <div>
        <label>Custom BBox <span class="optional-label">(optional — overrides county)</span></label>
        <div class="bbox-row" style="margin-top:6px">
          <div class="field"><label>West</label><input type="number" id="bbox-west" step="any" placeholder="-83.1" /></div>
          <div class="field"><label>East</label><input type="number" id="bbox-east" step="any" placeholder="-83.0" /></div>
          <div class="field"><label>South</label><input type="number" id="bbox-south" step="any" placeholder="39.9" /></div>
          <div class="field"><label>North</label><input type="number" id="bbox-north" step="any" placeholder="40.0" /></div>
        </div>
      </div>

      <label class="compare-toggle">
        <input type="checkbox" id="compare-mode" onchange="toggleCompareMode()" />
        Compare mode
      </label>

      <div class="compare-section" id="compare-section">
        <h3>Area B</h3>
        <div class="field">
          <label for="state-select-b">State B</label>
          <select id="state-select-b"><option value="">Select a state…</option></select>
        </div>
        <div class="field" style="margin-top:8px">
          <label for="county-select-b">County B</label>
          <select id="county-select-b" disabled><option value="">Select a state first</option></select>
        </div>
      </div>

      <button class="btn" id="run-btn" onclick="handleRun()">Run Assessment</button>
      <button class="btn-secondary" id="export-btn" style="display:none" onclick="exportReport()">Export Report</button>

      <div class="status" id="status-msg"></div>

      <hr class="divider" />

      <h2>Metrics</h2>
      <div class="metrics" id="metrics-panel">
        <div class="row"><span class="label">Building coverage</span><span class="value" id="m-bldg">—</span></div>
        <div class="row"><span class="label">Greenspace coverage</span><span class="value" id="m-green">—</span></div>
        <div class="row"><span class="label">Greenspace area</span><span class="value" id="m-green-area">—</span></div>
        <div class="row"><span class="label">Road density</span><span class="value" id="m-road">—</span></div>
        <div class="row"><span class="label">Floor Area Ratio</span><span class="value" id="m-far">—</span></div>
        <div class="row"><span class="label">Parking Coverage</span><span class="value" id="m-parking">—</span></div>
        <div class="row"><span class="label">Pedestrian Density</span><span class="value" id="m-ped">—</span></div>
        <div class="row"><span class="label">Transit Stops</span><span class="value" id="m-transit">—</span></div>
      </div>

      <hr class="divider" />

      <h2>Interventions</h2>
      <div class="interventions" id="interventions-panel">
        <div class="interventions-ok">Run an assessment to see interventions</div>
      </div>
    </div>

    <div class="map-area" id="map-area">
      <div class="map-placeholder" id="map-placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 16l4.553-2.276A1 1 0 0021 19.382V8.618a1 1 0 00-.553-.894L15 5m0 18V5M9 7l6-2"/>
        </svg>
        <span>Run an assessment to see the map</span>
      </div>
    </div>
  </div>

  <script>
    let _lastPayload = null;

    async function loadStatesInto(selId) {
      const sel = document.getElementById(selId);
      try {
        const res = await fetch("/states");
        const data = await res.json();
        sel.innerHTML = '<option value="">Select a state…</option>';
        data.states.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.state_fips;
          opt.textContent = s.state_name;
          sel.appendChild(opt);
        });
      } catch {
        sel.innerHTML = '<option value="">Failed to load states</option>';
      }
    }

    async function loadCountiesInto(stateFips, selId) {
      const countySel = document.getElementById(selId);
      if (!stateFips) { countySel.disabled = true; countySel.innerHTML = '<option value="">Select a state first</option>'; return; }
      countySel.disabled = true;
      countySel.innerHTML = '<option value="">Loading…</option>';
      try {
        const res = await fetch(`/counties/${stateFips}`);
        const data = await res.json();
        countySel.innerHTML = '<option value="">Select a county…</option>';
        data.counties.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.county_fips;
          opt.textContent = c.county_name;
          countySel.appendChild(opt);
        });
        countySel.disabled = false;
      } catch {
        countySel.innerHTML = '<option value="">Failed to load counties</option>';
      }
    }

    document.getElementById("state-select").addEventListener("change", function () {
      loadCountiesInto(this.value, "county-select");
    });
    document.getElementById("state-select-b").addEventListener("change", function () {
      loadCountiesInto(this.value, "county-select-b");
    });

    function toggleCompareMode() {
      const on = document.getElementById("compare-mode").checked;
      document.getElementById("compare-section").classList.toggle("visible", on);
      document.getElementById("run-btn").textContent = on ? "Run Comparison" : "Run Assessment";
    }

    function handleRun() {
      if (document.getElementById("compare-mode").checked) runCompare();
      else runAssess();
    }

    function buildPayload(stateSel, countySel) {
      const stateFips = document.getElementById(stateSel).value;
      const countyFips = document.getElementById(countySel).value;
      const west = document.getElementById("bbox-west")?.value;
      const south = document.getElementById("bbox-south")?.value;
      const east = document.getElementById("bbox-east")?.value;
      const north = document.getElementById("bbox-north")?.value;
      const hasBbox = west && south && east && north;
      const p = { state_fips: stateFips, county_fips: countyFips || "000" };
      if (hasBbox) p.bbox = [parseFloat(west), parseFloat(south), parseFloat(east), parseFloat(north)];
      return { stateFips, countyFips, hasBbox, payload: p };
    }

    function renderInterventionCards(interventions) {
      if (!interventions || interventions.length === 0)
        return '<div class="interventions-ok">✓ No issues detected</div>';
      return interventions.map((iv, idx) => {
        const refs = (iv.references || []).map(r =>
          `<div class="ref-item"><strong>${r.title}</strong> — ${r.authors} (${r.year}), <em>${r.journal}</em></div>`
        ).join("");
        const refsHtml = refs
          ? `<button class="refs-toggle" onclick="toggleRefs(${idx})">▶ References (${iv.references.length})</button>
             <div class="refs-list" id="refs-${idx}">${refs}</div>`
          : "";
        return `<div class="intervention-card ${iv.severity}">
          <div class="card-header">
            <span class="badge ${iv.severity}">${iv.severity}</span>
            <span class="category">${iv.category}</span>
          </div>
          <div class="finding">${iv.finding}</div>
          <div class="rec">${iv.recommendation}</div>
          <div class="std">${iv.standard}</div>
          ${refsHtml}
        </div>`;
      }).join("");
    }

    function toggleRefs(idx) {
      const list = document.getElementById(`refs-${idx}`);
      const btn = list.previousElementSibling;
      list.classList.toggle("open");
      btn.textContent = (list.classList.contains("open") ? "▼" : "▶") + btn.textContent.slice(1);
    }

    function applyMetrics(metrics) {
      document.getElementById("m-bldg").textContent = (metrics.building_coverage_ratio * 100).toFixed(1) + "%";
      document.getElementById("m-green").textContent = (metrics.greenspace_coverage_ratio * 100).toFixed(1) + "%";
      document.getElementById("m-green-area").textContent = (metrics.greenspace_area_m2 / 1e4).toFixed(1) + " ha";
      document.getElementById("m-road").textContent = metrics.road_density_km_per_km2.toFixed(2) + " km/km²";
      document.getElementById("m-far").textContent = (metrics.far ?? 0).toFixed(2);
      document.getElementById("m-parking").textContent = ((metrics.parking_coverage_ratio ?? 0) * 100).toFixed(1) + "%";
      document.getElementById("m-ped").textContent = (metrics.pedestrian_density_km_per_km2 ?? 0).toFixed(2) + " km/km²";
      document.getElementById("m-transit").textContent = (metrics.transit_stop_count ?? 0) + " stops";
    }

    async function runAssess() {
      const btn = document.getElementById("run-btn");
      const status = document.getElementById("status-msg");
      const { stateFips, countyFips, hasBbox, payload } = buildPayload("state-select", "county-select");

      if (!stateFips || (!countyFips && !hasBbox)) {
        status.textContent = "Select a state and county (or enter a custom bbox).";
        status.className = "status error";
        return;
      }

      btn.disabled = true;
      status.textContent = "Fetching OSM data…";
      status.className = "status";
      _lastPayload = payload;

      try {
        const res = await fetch("/assess", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Requested-With": "geoai" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || `HTTP ${res.status}`); }
        const data = await res.json();

        applyMetrics(data.metrics);
        document.getElementById("interventions-panel").innerHTML = renderInterventionCards(data.interventions);

        const mapArea = document.getElementById("map-area");
        document.getElementById("map-placeholder")?.remove();
        let iframe = document.getElementById("assess-iframe");
        if (!iframe) { iframe = document.createElement("iframe"); iframe.id = "assess-iframe"; mapArea.appendChild(iframe); }
        iframe.srcdoc = data.map_html;

        document.getElementById("export-btn").style.display = "";
        status.textContent = `Assessment complete — ${data.study_area_display}`;
        status.className = "status";
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.className = "status error";
      } finally {
        btn.disabled = false;
      }
    }

    async function exportReport() {
      if (!_lastPayload) return;
      const status = document.getElementById("status-msg");
      status.textContent = "Generating report…";
      try {
        const res = await fetch("/report", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Requested-With": "geoai" },
          body: JSON.stringify(_lastPayload),
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || `HTTP ${res.status}`); }
        const data = await res.json();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "geoassess-report.json";
        a.click();
        status.textContent = "Report downloaded.";
      } catch (err) {
        status.textContent = `Export error: ${err.message}`;
        status.className = "status error";
      }
    }

    async function runCompare() {
      const btn = document.getElementById("run-btn");
      const status = document.getElementById("status-msg");
      const { stateFips: sfA, countyFips: cfA, hasBbox: hbA, payload: pA } = buildPayload("state-select", "county-select");
      const { stateFips: sfB, countyFips: cfB, hasBbox: hbB, payload: pB } = buildPayload("state-select-b", "county-select-b");

      if (!sfA || (!cfA && !hbA)) { status.textContent = "Area A: select a state and county."; status.className = "status error"; return; }
      if (!sfB || (!cfB && !hbB)) { status.textContent = "Area B: select a state and county."; status.className = "status error"; return; }

      btn.disabled = true;
      status.textContent = "Running comparison…";
      status.className = "status";

      try {
        const res = await fetch("/compare", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Requested-With": "geoai" },
          body: JSON.stringify({ area_a: pA, area_b: pB }),
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || `HTTP ${res.status}`); }
        const data = await res.json();

        applyMetrics(data.area_a.metrics);
        document.getElementById("interventions-panel").innerHTML = renderInterventionCards(data.area_a.interventions);

        const mapArea = document.getElementById("map-area");
        document.getElementById("map-placeholder")?.remove();

        const metricLabels = {
          building_coverage_ratio: "Building Coverage",
          greenspace_coverage_ratio: "Greenspace Coverage",
          greenspace_area_m2: "Greenspace Area (m²)",
          road_density_km_per_km2: "Road Density (km/km²)",
          far: "FAR",
          parking_coverage_ratio: "Parking Coverage",
          pedestrian_density_km_per_km2: "Pedestrian Density (km/km²)",
          transit_stop_count: "Transit Stops",
          transit_stop_density_per_km2: "Transit Density (stops/km²)",
        };
        const rows = Object.keys(metricLabels).map(k => {
          const vA = data.area_a.metrics[k] ?? 0;
          const vB = data.area_b.metrics[k] ?? 0;
          const diff = data.diff[k] ?? 0;
          const fmt = v => typeof v === "number" ? v.toFixed(3) : v;
          const cls = diff > 0 ? "diff-pos" : diff < 0 ? "diff-neg" : "";
          return `<tr><td>${metricLabels[k]}</td><td>${fmt(vA)}</td><td>${fmt(vB)}</td><td class="${cls}">${diff >= 0 ? "+" : ""}${fmt(diff)}</td></tr>`;
        }).join("");

        mapArea.innerHTML = `<div class="compare-result" style="padding:20px;overflow-y:auto;height:100%">
          <h3 style="margin-bottom:10px;font-size:1rem">${data.area_a.study_area_display} vs ${data.area_b.study_area_display}</h3>
          <table class="compare-table">
            <thead><tr><th>Metric</th><th>Area A</th><th>Area B</th><th>Diff (B−A)</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;

        status.textContent = `Comparison complete`;
        status.className = "status";
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.className = "status error";
      } finally {
        btn.disabled = false;
      }
    }

    loadStatesInto("state-select");
    loadStatesInto("state-select-b");
  </script>
</body>
</html>
