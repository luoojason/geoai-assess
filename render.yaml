# Render Blueprint — the whole hosted service defined in code, so the dashboard
# steps are "point at this repo" and nothing else. See DEPLOY.md.
services:
  - type: web
    name: hcas
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Closest Render region to Dartmouth.
    region: virginia
    # 2 GB. Starter (512 MB, $7) is tempting, but a county-sized GeoDataFrame
    # plus a Folium render is exactly the kind of thing that dies at 512 MB, and
    # an out-of-memory kill mid-demo is the failure class that has already cost
    # this project weeks. Downgrade in the dashboard once real usage is measured.
    plan: standard
    healthCheckPath: /healthz
    # A run holds its worker for the whole step and the live progress registry is
    # in-process, so a second instance would answer progress polls for runs it
    # knows nothing about. One instance, on purpose (a disk pins it there too).
    numInstances: 1
    disk:
      # Survives every redeploy: the SQLite database and the osmnx tile cache.
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # sync: false means Render prompts for the value and stores it encrypted.
      # None of these are ever written into the repo.
      - key: ANTHROPIC_API_KEY   # sk-or-... (OpenRouter, credit-capped) or sk-ant-...
        sync: false
      - key: DEMO_PASSWORD       # turns on HTTP Basic auth for every route
        sync: false
      - key: CENSUS_API_KEY      # optional, free — step 1's income/home-value figures
        sync: false
      # 900, matching the app default since 2026-08-11. This blueprint was
      # written before that change and pinned 420 — which would have silently
      # reimposed the exact ceiling that was measured dropping five of eight
      # layers mid-request on a slow link. A healthy run finishes in ~2 minutes
      # and never approaches either number; the ceiling exists to absorb a bad
      # Overpass day, so it must not be set below the app's own default.
      - key: HCAS_LAYER_BUDGET_S
        value: "900"
